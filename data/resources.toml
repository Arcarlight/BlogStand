# ============================================================
#  素材分发页的数据（content/resources.md 里的 {{< resources >}} 读它）
# ------------------------------------------------------------
#  素材文件存在独立仓库：
#    https://github.com/Arcarlight/Nijiboshi-Giveout-Storage
#  主站不存素材本体，只在这里列清单，页面把 cdn + file 拼成真实地址。
#
#  加一件素材 = 在 [[items]] 里加一条（字段说明见 .notes/素材分发.md）：
#    sec   归属分类（下面 sections 的 id）
#    title 卡片标题
#    file  素材仓库里的相对路径
#    note  一句话说明（选填）
#    kind  image（默认）/ audio（音频没有预览图，卡片上显示 ♪）
#
#  ⚠️ 覆盖同名文件 jsDelivr 可能还缓存旧的；新版本最好换文件名，见笔记。
# ============================================================

[meta]
# 主通道：自己的 Cloudflare Worker 反代（board-api/functions/cdn/[[path]].js）
#  浏览器 → Cloudflare 边缘 → raw.githubusercontent，访客永远能看到。
#  为什么不用 jsDelivr 当主力：这个仓库的文件它经常 301 回 raw.githubusercontent，
#  国内打不开；实测一会儿 200 一会儿 301，不可靠。
cdn        = "https://nijiboshi-board.pages.dev/cdn/"
# 备用镜像：主通道挂了按顺序换（jsDelivr 两个节点 + 一个 GitHub 代理）
mirrors    = [
  "https://fastly.jsdelivr.net/gh/Arcarlight/Nijiboshi-Giveout-Storage@main/",
  "https://gcore.jsdelivr.net/gh/Arcarlight/Nijiboshi-Giveout-Storage@main/",
  "https://ghproxy.net/https://raw.githubusercontent.com/Arcarlight/Nijiboshi-Giveout-Storage/main/"
]
repo       = "https://github.com/Arcarlight/Nijiboshi-Giveout-Storage"
releases   = "https://github.com/Arcarlight/Nijiboshi-Giveout-Storage/releases"
license    = "CC BY 4.0"
licenseUrl = "https://creativecommons.org/licenses/by/4.0/"
author     = "虹星（Nijiboshi）"

# ---- 页面文案（编辑器「素材分发」面板可直接改） ----
[intro]
lead        = "这里是《想要飞的始祖小鸟》里可以公开拿走的素材：点阵图、敌人立绘、MIDI、UI 碎片。做游戏、做视频、做网站都行，不用提前问我——唯一的条件是署名。"
lead2       = "素材本体放在单独的仓库里（不占这个博客的体积），图片经自己搭的一层 CDN 反代取自那边（jsDelivr 作备用）；下面对每件素材都标了尺寸和大小，点开能看大图，也能一键复制署名格式。"
lead3       = ""
creditHint  = "偷懒的话，把这张条子贴进你的致谢里就行（点一下就复制）："
licenseLine = "全部素材以 {license} 授权：可以商用、可以修改、可以再分发，唯一的要求是署名。"
footNote    = "缺什么 / 文件坏了，可以在页面底下的留言板说一声。"

# ---- 分类 ----
# zip：填了就在分类末尾出一个「整包下载」按钮（指向素材仓库的 Release）
[[sections]]
id   = "sprite"
name = "点阵图"
desc = "角色行走图、战斗图。整张就是精灵表，按固定格切；页面里放大会保持像素锐利。"
zip  = ""

[[sections]]
id   = "face"
name = "脸图"
desc = "半身像表情表，一格 96×96。从网页精灵表按选用到的表情拆出来的（原表情表里没用到的格子没有）。"
zip  = ""

[[sections]]
id   = "portrait"
name = "立绘"
desc = "敌人和角色的小型立绘，约 500×500，可以直接缩放使用。"
zip  = ""

[[sections]]
id   = "ui"
name = "UI 素材"
desc = "图标集、窗框、按钮底图之类的碎件。"
zip  = ""

[[sections]]
id   = "midi"
name = "MIDI"
desc = "BGM 骨架，可以直接在 DAW 里换音源。"
zip  = ""

