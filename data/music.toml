[[tracks]]
  file = "Lowlayer_moutain.mid"
  title = "低层山"
  artist = "虹星"
  desc = " · 自己写的"
  note = """
  这首是给《飛べないアルケン》写的 BGM 之一，原本用在低层山路那段。
  一开始只写了五个声部：钢片琴、马林巴、贝斯、哨笛、班卓琴。
  想做出「**走在山上、前面还很长**」的感觉，所以旋律一直往上走、不落回主音。

  写的时候踩的坑：打击乐那一路音量给太大了，混起来糊，后来整体压了 6dB。
  """
