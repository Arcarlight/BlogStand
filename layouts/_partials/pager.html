{{ $p := .Paginator }}
{{ if gt $p.TotalPages 1 }}
<div class="pager clearfix">
  <div class="pager-prev">
    {{ with $p.Prev }}<a href="{{ .URL }}">&laquo; 上一页</a>{{ else }}<span class="disabled">&laquo; 上一页</span>{{ end }}
  </div>
  <div class="pager-info">
    第 <strong>{{ $p.PageNumber }}</strong> / {{ $p.TotalPages }} 页
    <span class="pager-total">（共 {{ $p.TotalNumberOfElements }} 篇）</span>
  </div>
  <div class="pager-next">
    {{ with $p.Next }}<a href="{{ .URL }}">下一页 &raquo;</a>{{ else }}<span class="disabled">下一页 &raquo;</span>{{ end }}
  </div>
</div>
{{ end }}
