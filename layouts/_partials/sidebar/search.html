{{/* ============ 站内搜索（走 Bing，因为 Google 当年也经常抽风） ============ */}}
<div class="widget">
  <div class="widget-title">站内搜索</div>
  <div class="widget-body">
    <form id="site-search-form" class="search-form" action="https://www.bing.com/search" method="get" target="_blank">
      <input type="text" id="site-search-input" name="q" placeholder="输入关键字…" autocomplete="off">
      <button type="submit">搜索</button>
    </form>
    <p class="search-tip">提示：搜索结果限定在本站范围内</p>
  </div>
</div>
