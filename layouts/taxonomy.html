{{ define "main" }}

<div class="box">
  <div class="box-title">{{ .Title }}</div>
  <div class="box-body">

    {{ with .Content }}<div class="list-intro">{{ . }}</div>{{ end }}

    <ul class="taxo-list">
      {{ range .Pages }}
      <li class="taxo-item">
        <a class="taxo-name" href="{{ .RelPermalink }}">{{ .Title }}</a>
        <span class="taxo-count">（{{ len .Pages }} 篇）</span>
      </li>
      {{ end }}
    </ul>

  </div>
</div>

{{ end }}
