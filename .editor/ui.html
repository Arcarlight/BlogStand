<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>星虹巢 · 本地编辑器</title>
<style>
  :root{
    --bg:#eef2f7; --panel:#fff; --line:#c9d6e5; --ink:#22303f; --dim:#7488a0;
    --accent:#1b5a9e; --accent2:#ff9900; --danger:#c0392b; --ok:#1e8e3e;
  }
  *{box-sizing:border-box}
  html,body{height:100%;margin:0}
  body{
    font:13px/1.6 "Microsoft YaHei","微软雅黑","PingFang SC","Hiragino Sans GB",-apple-system,"Segoe UI",sans-serif;
    color:var(--ink);background:var(--bg);display:flex;flex-direction:column;overflow:hidden;
  }
  /* ---------- 顶栏 ---------- */
  header{
    display:flex;align-items:center;gap:8px;padding:8px 12px;background:linear-gradient(180deg,#4c93dc,#1c5c9f);
    color:#fff;box-shadow:0 2px 6px rgba(0,0,0,.2);z-index:10;
  }
  header .brand{font-weight:bold;font-size:14px;letter-spacing:.5px;text-shadow:1px 1px 0 rgba(0,0,0,.3)}
  header .spacer{flex:1}
  button{
    font:inherit;padding:5px 12px;border:1px solid var(--line);border-radius:4px;background:#fff;
    color:var(--ink);cursor:pointer;
  }
  button:hover{background:#f0f6ff}
  button:disabled{opacity:.5;cursor:default}
  button.primary{background:#ffb84d;border-color:#e08600;color:#4a2b00;font-weight:bold}
  button.primary:hover{background:#ffc76b}
  button.danger{background:#fff;border-color:#e0b4b0;color:var(--danger)}
  button.danger:hover{background:#fdf0ef}
  button.ghost{background:rgba(255,255,255,.14);border-color:rgba(255,255,255,.4);color:#fff}
  button.ghost:hover{background:rgba(255,255,255,.28)}
  .dirty{background:#fff3cd;color:#7a5b00;border:1px solid #e5c76b;border-radius:3px;padding:1px 7px;font-size:12px}

  /* ---------- 布局 ---------- */
  #main{flex:1;display:flex;min-height:0}
  /* 侧栏是「上面列表可滚动 + 底部版权行固定」的两段式 */
  #side{width:250px;flex:none;background:var(--panel);border-right:1px solid var(--line);display:flex;flex-direction:column;overflow:hidden}
  #tree{flex:1;overflow:auto;padding:8px 0}
  #credits{flex:none;padding:5px 12px;border-top:1px solid var(--line);background:#fafcff;font-size:11px;line-height:1.5;color:var(--dim)}
  #credits a{color:var(--accent);text-decoration:none}
  #credits a:hover{text-decoration:underline}
  #work{flex:1;display:flex;flex-direction:column;min-width:0}
  #toolbar{display:flex;align-items:center;gap:6px;padding:6px 10px;background:var(--panel);border-bottom:1px solid var(--line);flex-wrap:wrap}
  #toolbar button{flex:none;padding:4px 9px}
  #curPath{font-family:Consolas,monospace;color:var(--dim);font-size:12px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
  #toolbar .spacer{flex:1}
  #panes{flex:1;display:flex;min-height:0}

  /* ---------- 侧栏树 ---------- */
  .grp{padding:10px 12px 4px;font-size:11px;font-weight:bold;color:var(--dim);letter-spacing:1px}
  .row{
    display:flex;align-items:center;gap:6px;padding:4px 12px 4px 18px;cursor:pointer;
    white-space:nowrap;overflow:hidden;text-overflow:ellipsis;
  }
  .row:hover{background:#eef5fd}
  .row.active{background:#dcebfa;font-weight:bold;color:var(--accent)}
  .row.tool{padding-left:12px}
  .row .badge{font-size:10px;color:var(--dim);margin-left:auto}
  /* 拖动排序 */
  .row[draggable="true"]{cursor:grab}
  .row.dragging{opacity:.4}
  .row.drop-before{box-shadow:inset 0 2px 0 0 var(--accent)}
  .row.drop-after{box-shadow:inset 0 -2px 0 0 var(--accent)}

  /* ---------- 图片选择器（选站上已有的图） ---------- */
  .galpick{display:grid;grid-template-columns:repeat(auto-fill,minmax(104px,1fr));gap:8px;max-height:60vh;overflow:auto;padding:2px}
  .galpick-cell{position:relative;display:flex;flex-direction:column;align-items:center;gap:3px;padding:5px;cursor:pointer;background:#fff;border:1px solid var(--line);border-radius:4px;font:inherit}
  .galpick-cell img{width:100%;height:74px;object-fit:cover;background:#f6f9fd}
  .galpick-cell span{width:100%;overflow:hidden;font-size:11px;color:var(--dim);white-space:nowrap;text-overflow:ellipsis;text-align:center}
  .galpick-cell:hover{border-color:var(--accent)}
  .galpick-cell.on{border-color:var(--accent);box-shadow:0 0 0 2px #cfe4fb;background:#f2f8ff}
  .galpick-cell.on::after{content:"✓";position:absolute;margin:-4px 0 0 84px;color:#1a7f37;font-weight:bold}
  /* 已经在画廊里的图：灰一点 + 一个「已导入」角标，一眼能扫出来 */
  .galpick-cell.added{background:#f4f6f8;border-style:dashed}
  .galpick-cell.added img{opacity:.45}
  .galpick-cell.added span{color:#8a97a6}
  .galpick-tag{position:absolute;top:5px;left:5px;padding:1px 5px;font-size:10px;font-style:normal;line-height:1.5;color:#fff;background:#7f8c9b;border-radius:3px}

  /* ---------- 侧栏排序面板里的拖动列表 ---------- */
  #sideOrder{list-style:none;max-width:440px;margin:10px 0}
  #sideOrder li{
    display:flex;align-items:center;gap:8px;padding:7px 10px;margin-bottom:4px;
    background:#fff;border:1px solid var(--line);border-radius:4px;cursor:grab;font-size:13px;
  }
  #sideOrder li:hover{background:#f4f9ff}
  #sideOrder li.dragging{opacity:.4}
  #sideOrder li .handle{color:var(--dim);font-size:15px;line-height:1}
  #sideOrder li code{margin-left:auto;font-size:11px;color:var(--dim);background:#f2f7fc;padding:1px 5px;border-radius:3px}

  /* ---------- 编辑区 ---------- */
  #editor{
    flex:1;min-width:0;border:0;outline:0;padding:14px 16px;resize:none;
    font:13.5px/1.75 Consolas,"SF Mono",Menlo,Monaco,"Courier New","Microsoft YaHei","PingFang SC",monospace;
    background:#fbfdff;color:#22303f;tab-size:2;
  }
  #previewPane{flex:1;min-width:0;display:none;flex-direction:column;border-left:1px solid var(--line);background:#fff}
  body.preview #previewPane{display:flex}
  #previewBar{display:flex;align-items:center;gap:6px;padding:3px 8px;background:#f2f7fc;border-bottom:1px solid var(--line);flex:none}
  #previewPath{flex:1;font-family:Consolas,monospace;font-size:12px;color:#44586e;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
  #previewBar button{padding:1px 9px;font-size:12px;line-height:1.5}
  #preview{flex:1;min-width:0;border:0;background:#fff}
  body.preview #editor{flex:1}
  #panel{flex:1;overflow:auto;padding:16px;background:var(--panel);display:none}
  body.panel #panel{display:block}
  body.panel #editor{display:none}
  /* 工具面板和预览可以同时开：左边面板、右边预览，各占一半。
     以前这里有 body.panel #previewPane{display:none}，而且点「预览」还会把
     panel 类摘掉 —— 于是「在画廊里加画」和「盯着一页看效果」不能同时做。 */
  /* 打开工具面板时，跟正文有关的那几个控件收起来（不然点了会改到别的文件） */
  body.panel #toolbar button.fmt,
  body.panel #toolbar .grp-label,
  body.panel #toolbar .sep,
  body.panel #imgWidthSel,
  body.panel #btnApplyWidth,
  body.panel #btnInsertImg,
  body.panel #btnInsertDay,
  body.panel #btnToggleDraft{display:none}

  /* ---------- 表单 ---------- */
  h2.sec{margin:0 0 4px;font-size:15px;color:var(--accent)}
  p.hint{margin:0 0 16px;color:var(--dim);font-size:12px}
  .field{display:flex;align-items:center;gap:10px;padding:5px 0;border-bottom:1px dashed #e6edf6}
  .field label{width:190px;flex:none;font-family:Consolas,monospace;font-size:12px;color:#44586e}
  .field input[type=text],.field textarea{
    flex:1;font:inherit;padding:4px 8px;border:1px solid var(--line);border-radius:3px;background:#fff;
  }
  .field textarea{font-family:Consolas,monospace;font-size:12px;min-height:60px;resize:vertical}
  .field input[type=checkbox]{width:16px;height:16px}
  .field .cmt{color:#9db0c4;font-size:11px;max-width:320px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}

  table.grid{width:100%;border-collapse:collapse;margin-bottom:10px}
  table.grid th{background:#eef5fd;border:1px solid var(--line);padding:5px 8px;font-size:12px;text-align:left}
  table.grid td{border:1px solid var(--line);padding:3px 5px}
  table.grid input{width:100%;font:inherit;font-size:12px;border:1px solid transparent;background:transparent;padding:3px 5px;border-radius:3px}
  table.grid input:focus{border-color:var(--accent);background:#fff;outline:0}
  .swatch{width:34px;height:24px;border:1px solid var(--line);border-radius:3px;padding:0;vertical-align:middle}

  /* ---------- 脚本卡 ---------- */
  .card{border:1px solid var(--line);border-radius:6px;padding:12px 14px;margin-bottom:10px;background:#fbfdff}
  .card h4{margin:0 0 6px;font-size:13px}
  .card .meta{color:var(--dim);font-size:11px;font-family:Consolas,monospace}
  .card .acts{margin-top:8px;display:flex;gap:6px;align-items:center}
  .sw{display:inline-flex;align-items:center;gap:6px;cursor:pointer;font-size:12px}

  /* ---------- 弹窗 ---------- */
  #modal{position:fixed;inset:0;background:rgba(20,32,45,.45);display:flex;align-items:center;justify-content:center;z-index:200}
  #modal[hidden]{display:none}
  .mbox{background:#fff;border-radius:8px;box-shadow:0 12px 40px rgba(0,0,0,.3);width:580px;max-width:92vw;max-height:88vh;display:flex;flex-direction:column}
  .mbox h3{margin:0;padding:14px 18px;font-size:15px;border-bottom:1px solid var(--line);color:var(--accent)}
  #mBody{padding:14px 18px;overflow:auto}
  .mfoot{padding:12px 18px;border-top:1px solid var(--line);display:flex;justify-content:flex-end;gap:8px}
  #mBody .field label{width:150px}
  #mBody select{flex:1;font:inherit;padding:5px 8px;border:1px solid var(--line);border-radius:3px;background:#fff}
  .note{padding:8px 11px;background:#f5f9ff;border:1px dashed #b9d0e8;border-radius:4px;font-size:12px;color:#44586e;margin-bottom:12px;line-height:1.7}

  /* ---------- 宝可梦台词面板 ---------- */
  .pk-h{margin:18px 0 6px;font-size:13px;color:#123f70;border-bottom:1px solid var(--line);padding-bottom:4px}
  .pk-sub{color:#9db0c4;font-size:11px;font-weight:normal;margin-left:6px}
  .pk-in{width:100%;font:inherit;font-size:12.5px;padding:4px 7px;border:1px solid var(--line);border-radius:3px;background:#fff}
  .pk-in:focus{outline:none;border-color:var(--accent);box-shadow:0 0 0 2px #dcebfa}
  .pk-n{text-align:center;color:#9db0c4;font-family:Consolas,monospace;font-size:11px}
  .pk-n.bad{color:#c5221f;font-weight:bold}
  .pk-add{background:#fafcff}
  .pk-add button{padding:2px 8px;font-size:12px}
  .pk-log{margin-top:12px;padding:10px;background:#f7f9fc;border:1px solid var(--line);border-radius:4px;
    font-family:Consolas,monospace;font-size:11.5px;line-height:1.6;white-space:pre-wrap;max-height:240px;overflow:auto}

  /* ---------- 拖拽上传 ---------- */
  #editor.dragover{background:#eef7ff;box-shadow:inset 0 0 0 3px #7fb8f0}
  .row.create{color:var(--accent);font-weight:bold}
  .row.create:hover{background:#e3f0ff}

  /* ---------- 工具栏的格式按钮 ---------- */
  .grp-label{color:var(--dim);font-size:12px;white-space:nowrap;display:inline-flex;align-items:center;gap:5px}
  #toolbar .sep{width:1px;height:18px;background:var(--line);margin:0 2px}
  #toolbar button.fmt{padding:3px 9px;line-height:1.4}
  #toolbar button.fmt.on{background:#dcebfa;border-color:var(--accent);color:var(--accent)}
  #imgWidthSel{font:inherit;padding:3px 6px;border:1px solid var(--line);border-radius:4px;background:#fff}

  /* ---------- 像素图标 ----------
     HackerNoon Pixel Icon Library，画在 24x24 的网格上，1 个单位 = 1 个像素。
     跟站里的点阵字体是同一条规矩：
         图标(CSS px) x devicePixelRatio = 24 的整数倍
     所以大小由 <body> 前面那段脚本按 DPR 算好写进 --ico，别在这里写死。
     实测：100% 缩放 -> 24px，150% -> 16px（你屏幕就是这个），200% -> 24px。 */
  .ico{
    width:var(--ico,20px);height:var(--ico,20px);flex:none;
    fill:currentColor;shape-rendering:crispEdges;vertical-align:-.18em;
  }
  button .ico,.row .ico{margin-right:2px}
  button:has(.ico){display:inline-flex;align-items:center;gap:5px}
  .row .ico{opacity:.85}
  .row.active .ico,.row.create .ico{opacity:1}

  #toast{
    position:fixed;left:50%;bottom:24px;transform:translateX(-50%);
    background:#22303f;color:#fff;padding:9px 18px;border-radius:5px;opacity:0;pointer-events:none;
    transition:opacity .2s, transform .2s;z-index:99;max-width:70vw;
  }
  #toast.show{opacity:1;transform:translateX(-50%) translateY(-6px)}
  #toast.err{background:#a3352b}
  #toast.ok{background:#1e7a3c}
  code{background:#eef2f7;padding:1px 5px;border-radius:3px;font-size:12px}
</style>
</head>
<body>

<script>
  /* 像素图标的整倍缩放：图标(CSS px) x DPR 必须等于 24 的整数倍，
     否则 24x24 的像素格子会被摊到半个设备像素上，边缘立刻发毛。
     算法跟站点里点阵字体那段一样：取让图标落在 15~26px 之间的那个倍数。
       100% 缩放 -> 24px    150% -> 16px    200% -> 24px
     拿不到合适倍数（极端缩放）就用 CSS 里的兜底值。 */
  (function () {
    var GRID = 24, MIN = 15, MAX = 26, TARGET = 17;
    var dpr = window.devicePixelRatio || 1;
    var k = 0, best = 1e9;
    for (var i = 1; i <= 8; i++) {
      var px = GRID * i / dpr;
      if (px < MIN || px > MAX) continue;
      var e = Math.abs(px - TARGET);
      if (e < best - 0.001) { best = e; k = i; }
    }
    if (!k) return;
    document.documentElement.style.setProperty('--ico', (GRID * k / dpr).toFixed(5) + 'px');
  })();
</script>

<div id="toast"></div>

<script>
const TOKEN = "__TOKEN__";
let TREE = [], CUR = null, DIRTY = false;

/* ---------- 小工具 ---------- */
const $ = (s) => document.querySelector(s);
const esc = (s) => String(s).replace(/[&<>"]/g, (c) => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
/** 内联引用 sprite 里的像素图标（见文件顶部那个 <svg id="sprite">） */
const ico = (name) => '<svg class="ico" aria-hidden="true"><use href="#ico-' + name + '"/></svg>';

function toast(msg, kind) {
  const t = $('#toast');
  t.textContent = msg;
  t.className = 'show ' + (kind || '');
  clearTimeout(t._h);
  t._h = setTimeout(() => { t.className = ''; }, kind === 'err' ? 6000 : 2800);
}

async function api(path, opts) {
  const res = await fetch(path, Object.assign({
    headers: { 'X-Editor-Token': TOKEN, 'Content-Type': 'application/json' },
  }, opts));
  const data = await res.json().catch(() => ({}));
  if (!res.ok) throw new Error(data.error || ('HTTP ' + res.status));
  return data;
}
const apiGet = (p) => api(p);
const apiPost = (p, body) => api(p, { method: 'POST', body: JSON.stringify(body || {}) });

function setDirty(v) {
  DIRTY = v;
  $('#dirtyFlag').hidden = !v;
  $('#btnSave').disabled = !v;
}
window.addEventListener('beforeunload', (e) => { if (DIRTY) { e.preventDefault(); e.returnValue = ''; } });

/* ---------- 侧栏 ---------- */
function shortName(p) {
  const b = p.split('/').pop().replace(/\.md$/, '');
  return b;
}

function renderTree() {
  const el = $('#tree');
  let h = '';
  h += '<div class="row create" data-act="new">' + ico('plus') + '新建页面</div>';
  h += '<div class="grp">工具</div>';
  h += '<div class="row tool" data-panel="music">' + ico('music') + '音乐</div>';
  h += '<div class="row tool" data-panel="gallery">' + ico('paint-brush') + '画廊</div>';
  h += '<div class="row tool" data-panel="settings">' + ico('cog') + '站点设置</div>';
  h += '<div class="row tool" data-panel="navbar">' + ico('bars') + '顶部导航</div>';
  h += '<div class="row tool" data-panel="links">' + ico('link') + '友情链接</div>';
  h += '<div class="row tool" data-panel="buttons">' + ico('grid') + '小按钮</div>';
  h += '<div class="row tool" data-panel="updates">' + ico('refresh') + '更新日志</div>';
  h += '<div class="row tool" data-panel="changelog">' + ico('notebook') + '更新历史</div>';
  h += '<div class="row tool" data-panel="notices">' + ico('comment-quote') + '公告栏</div>';
  h += '<div class="row tool" data-panel="pkmn">' + ico('message-dots') + '宝可梦台词</div>';
  h += '<div class="row tool" data-panel="sidebar">' + ico('pencil-ruler') + '侧栏排序</div>';
  h += '<div class="row tool" data-panel="scripts">' + ico('code') + '脚本管理</div>';
  h += '<div class="row tool" data-panel="nav">' + ico('calendar-alt') + '日记日历</div>';
  for (const g of TREE) {
    if (!g.files.length) continue;
    h += `<div class="grp">${esc(g.group)}</div>`;
    for (const f of g.files) {
      // data-group 是拖动排序用的（只允许同组内换位置）；草稿组不参与，不给拖
      const drag = g.draft ? '' : ' draggable="true"';
      const tip = esc(f) + (g.draft ? '' : '（按住可以拖动排序）');
      h += `<div class="row" data-file="${esc(f)}" data-group="${esc(g.group)}"${drag}`
        + ` title="${tip}">${esc(shortName(f))}</div>`;
    }
  }
  el.innerHTML = h;
}

/* ---------- 侧栏拖动排序 ---------- */
let DRAG = null;

function clearDropMarks() {
  document.querySelectorAll('#tree .drop-before,#tree .drop-after')
    .forEach((r) => r.classList.remove('drop-before', 'drop-after'));
}

/** 把当前 DOM 里这一组的顺序存到服务端 */
async function saveTreeOrder(group) {
  const files = [...document.querySelectorAll('#tree .row[data-file]')]
    .filter((r) => r.dataset.group === group)
    .map((r) => r.dataset.file);
  try {
    await apiPost('/api/order', { group, files });
    toast(`「${group}」的顺序已保存`, 'ok');
  } catch (e) { toast('顺序保存失败: ' + e.message, 'err'); }
}

$('#tree').addEventListener('dragstart', (e) => {
  const row = e.target.closest('.row[data-file][draggable="true"]');
  if (!row) { e.preventDefault(); return; }
  DRAG = { el: row, group: row.dataset.group, file: row.dataset.file };
  row.classList.add('dragging');
  e.dataTransfer.effectAllowed = 'move';
  // Firefox 不调 setData 就不会真的开始拖
  try { e.dataTransfer.setData('text/plain', row.dataset.file); } catch (err) { /* 忽略 */ }
});

$('#tree').addEventListener('dragover', (e) => {
  if (!DRAG) return;
  const row = e.target.closest('.row[data-file]');
  // 只允许同一组内换位置（分组是按目录定死的，跨组没有意义）
  if (!row || row.dataset.group !== DRAG.group || row === DRAG.el) { clearDropMarks(); return; }
  e.preventDefault();
  e.dataTransfer.dropEffect = 'move';
  const r = row.getBoundingClientRect();
  const after = e.clientY > r.top + r.height / 2;
  clearDropMarks();
  row.classList.add(after ? 'drop-after' : 'drop-before');
});

$('#tree').addEventListener('drop', async (e) => {
  if (!DRAG) return;
  const row = e.target.closest('.row[data-file]');
  if (!row || row.dataset.group !== DRAG.group || row === DRAG.el) { clearDropMarks(); return; }
  e.preventDefault();
  const after = row.classList.contains('drop-after');
  row.parentNode.insertBefore(DRAG.el, after ? row.nextSibling : row);
  clearDropMarks();
  const g = DRAG.group;
  DRAG = null;

/* ---------- 预览 ---------- */
let PREVIEW_URL = 'http://127.0.0.1:1313/';  // 预览站根地址
let LIVE_URL = '';                           // 线上站地址
let CUR_URL = '/';                           // 正在预览的页面路径

/* 当前编辑的文件 -> 对应的页面地址。
   注意「返回 null」和「返回空串」不一样：
     · 返回地址  -> 预览跳到这一页
     · 返回 ''    -> 这个文件没有独立页面（比如 partial、样式、JS），
                     预览保持原来那一页，不再偷偷跳到首页
   layouts/ 下的模板也尽量对应到真实页面（以前这些点了预览完全不动，
   而它们其实是有页面的：404 模板 -> /404.html、baseof/home -> 首页）。 */
function urlForFile(p) {
  if (!p) return '';
  if (p.startsWith('content/') && p.endsWith('.md')) {
    let rel = p.slice('content/'.length).replace(/\.md$/, '');
    if (rel === '_index') return '/';
    if (rel.endsWith('/_index')) rel = rel.slice(0, -'/_index'.length);
    return '/' + rel + '/';
  }
  if (p === 'assets/css/retro.css') return '';      // 没有单独一页，靠当前页看效果
  if (p.startsWith('static/js/')) return '';
  // 模板 -> 它渲染出来的那个页面
  const LAYOUT_PAGE = {
    'layouts/404.html': '/__editor-404-check/',
    'layouts/home.html': '/',
    'layouts/baseof.html': '/',
    'layouts/list.html': '/blog/',
    'layouts/single.html': '/navigator/',
    'layouts/_partials/header.html': '/',
    'layouts/_partials/footer.html': '/',
    'layouts/_partials/head.html': '/',
    'layouts/_partials/post-meta.html': '/navigator/',
    'layouts/_partials/comments.html': '/navigator/',
  };
  return LAYOUT_PAGE[p] || '';
}

/** 这个文件有没有自己的一页（没有的话预览面板会说明一句，而不是默默不动） */
function hasOwnPage(p) {
  return !!urlForFile(p);
}
function previewTarget() {
  return PREVIEW_URL.replace(/\/+$/, '') + (CUR_URL || '/');
}
/* 预览栏上那行说明：当前文件有没有自己的一页。
   以前编辑模板/样式时点了预览完全没反应，看着像坏了。 */
function updatePreviewPath() {
  const el = $('#previewPath');
  if (!el) return;
  const own = hasOwnPage(CUR);
  el.textContent = own ? (CUR_URL || '/') : ((CUR || '这个文件') + '　—　没有独立页面，看的是上一页');
  el.title = previewTarget();
}
function refreshPreview() {
  $('#preview').src = previewTarget() + '?t=' + Date.now();
  updatePreviewPath();
}
$('#btnPreview').addEventListener('click', async () => {
  // 注意：这里不再摘掉 panel 类 —— 面板和预览可以同时开着。
  const on = document.body.classList.toggle('preview');
  $('#btnPreviewText').textContent = on ? '预览 ▾' : '预览 ▸';
  if (!on) { $('#preview').src = 'about:blank'; return; }
  if ($('#preview').src && $('#preview').src !== 'about:blank') {
    // 已经开着预览窗口（比如刚点是开着面板的）-> 只是重新显示，顺手刷一下
    refreshPreview();
    return;
  }

  $('#preview').src = 'about:blank';

  const s = await apiPost('/api/hugo', { action: 'status' });
  if (s.url) PREVIEW_URL = s.url;

  if (!s.running) {
    toast('正在启动预览服务器，第一次要几秒…');
    const r = await apiPost('/api/hugo', { action: 'start' });
    if (r.url) PREVIEW_URL = r.url;
    if (!r.ok) {
      const detail = (r.log || '').split('\n').filter((x) => x.trim()).slice(-5).join('\n');
      toast('预览启动失败：' + (r.note || '') + (detail ? '\n' + detail : ''), 'err');
      return;
    }
    toast('预览已就绪', 'ok');
  }
  refreshPreview();
});
$('#btnLive').addEventListener('click', () => {
  if (LIVE_URL) window.open(LIVE_URL, '_blank');
  else toast('读不到线上地址（hugo.toml 里的 baseURL）', 'err');
});
$('#btnPreviewRefresh').addEventListener('click', () => {

$('#btnPreviewNew').addEventListener('click', () => window.open(previewTarget(), '_blank'));

/* ---------- 发布 / 同步 ----------
   「发布」= 把本地的改动提交并推上去；「拉取线上」= 把另一台电脑推上来的改动拉下来。
   ⚠️ 推送失败（断网、或者另一台电脑推过了）之后，改动其实**已经提交在本地**了，
   工作区是干净的 —— 所以这里绝不能因为「没有未提交的改动」就早退，
   要看 ahead（比线上多几个提交）决定还能不能推。 */
function gitBad(r) {
  const bad = r.steps.find((s) => s.code !== 0);
  return bad ? (bad.out || '（没有输出）') : '';
}

async function syncPull(auto) {
  let g;
  try { g = await apiGet('/api/git'); } catch (e) { return false; }
  if (g.behind === null || g.behind === undefined) {
    if (!auto) toast('拿不到线上状态：可能没联网，或者没配好 git 远端', 'err');
    return false;
  }
  if (!g.behind) {
    if (!auto) toast('已经和线上一致了');
    return false;
  }
  if (g.status.length) {
    if (!auto) toast(`本地还有 ${g.status.length} 处没提交的改动，先发布（或者撤销）再拉取`, 'err');
    return false;
  }
  if (g.ahead) {
    if (!auto) toast(`本地有 ${g.ahead} 个提交还没推上去，先点「发布」再拉取`, 'err');
    return false;
  }
  toast(`正在从线上拉取 ${g.behind} 个提交…`);
  const r = await apiPost('/api/git', { action: 'pull' });
  if (r.ok) {
    toast(`已从线上同步 ${g.behind} 个提交`, 'ok');
    await bootstrap();
    if (CUR) loadFile(CUR).catch(() => {});
    return true;
  }
  toast('拉取失败：\n' + gitBad(r), 'err');
  return false;
}

$('#btnSync').addEventListener('click', () => syncPull(false));

$('#btnPublish').addEventListener('click', async () => {
  if (DIRTY) { toast('先保存当前文件再发布', 'err'); return; }
  const g = await apiGet('/api/git');
  const changed = g.status.length > 0;
  const ahead = g.ahead || 0;
  if (!changed && !ahead) {
    toast(g.behind
      ? `本地没有改动，但线上有 ${g.behind} 个提交（点「拉取线上」同步）`
      : '没有需要发布的改动');
    return;
  }
  let msg = '更新';
  if (changed) {
    const listing = g.status.map((s) => '  ' + s).join('\n');
    const m = prompt(`将要提交以下改动：\n\n${listing}\n\n写一句这次的更新说明：`, '更新');
    if (m === null) return;
    msg = m || '更新';
  } else {
    // 上次推送失败的常见情况：改动早就提交了，只是没推上去
    if (!confirm(`本地有 ${ahead} 个提交还没推上去（上次推送应该失败了），现在重推一次？`)) return;
    msg = '重试推送';
  }
  toast(changed ? '正在提交并推送…' : '正在推送…');
  const r = await apiPost('/api/git', { action: 'commitpush', message: msg });
  if (r.ok) {
    toast(r.retried
      ? '线上有新提交，已自动合并后推送成功（GitHub 大约 1 分钟后更新线上）'
      : '推送成功，GitHub 大约 1 分钟后更新线上', 'ok');
    await bootstrap();
  } else if (r.conflict) {
    toast('本地和线上改了同一处，要手工解决冲突：\n' + gitBad(r) +
      '\n\n（改动都已经提交在本地了，解决完再点一次发布）', 'err');
  } else {
    toast('发布失败：\n' + gitBad(r) +
      '\n\n改动已经在本地提交好了，修好网络 / 代理之后**再点一次发布**就会重推。', 'err');
  }
});

/* --- 顶部导航（hugo.toml 的 [[menu.main]]） ---
   站长问「首页 / 关于 / 画廊 / 始祖小鸟 这些标签能不能在编辑器里改」——
   以前不能：「站点设置」只管 [params] 段。 */
async function renderNavbar() {
  const d = await apiGet('/api/menu');
  const draw = (items) => {
    // 可选页面：先放几个常用的，再把「首页与单页」里的文件都列上
    const pages = [
      ['/', '首页 /'], ['/self_intros/', '关于 self_intros'],
      ['/blog/', '博客列表 /blog/'], ['/navigator/', '导航 navigator'],
      ['/gallery/', '画廊 gallery'], ['/updates/', '更新日志（全部）updates'],
      ['/tobitaiaaken/', '始祖小鸟 tobitaiaaken'],
    ];
    for (const g of (TREE || [])) {
      if (g.group !== '首页与单页') continue;
      for (const f of g.files) {
        const u = urlForFile(f);
        if (u && !pages.some((p) => p[0] === u)) pages.push([u, f.replace(/^content\//, '')]);
      }
    }
    let h = '<h2 class="sec">顶部导航</h2>';
    h += '<p class="hint">页面顶部那条导航栏（首页 / 关于 / 博客 …），对应 <code>hugo.toml</code> 的 <code>[[menu.main]]</code>。</p>';
    h += '<div class="note">左边那列是<b>显示的文字</b>（想叫什么都行）；右边选它<b>指向哪个页面</b>。<br>' +
         '顺序就是显示顺序，用每行右边的 <b>↑ ↓</b> 调；保存时 weight 会按顺序自动重排（10 / 20 / 30…）。<br>' +
         '「站点设置」面板管不到这里 —— 那边只管 <code>[params]</code>。</div>';
    h += '<table class="grid"><thead><tr>' +
         '<th style="width:30px"></th><th style="width:26%">显示的文字</th>' +
         '<th>指向的页面</th><th style="width:96px"></th></tr></thead><tbody id="tbNav">';
    items.forEach((it, i) => {
      const cur = it.pageRef || it.url || '';
      let opts = '<option value="">（选一个页面）</option>';
      for (const [u, label] of pages) {
        opts += `<option value="${esc(u)}"${u === cur ? ' selected' : ''}>${esc(label)}　${esc(u)}</option>`;
      }
      // 现在指向的地址不在候选里就补一条，免得保存时被悄悄改掉
      if (cur && !pages.some((p) => p[0] === cur)) opts += `<option value="${esc(cur)}" selected>${esc(cur)}（自定义）</option>`;
      h += `<tr>
        <td style="text-align:center;color:#9bb4cc">☰</td>
        <td><input data-f="name" data-i="${i}" value="${esc(it.name || '')}" placeholder="显示的文字"></td>
        <td><select data-f="pageRef" data-i="${i}">${opts}</select></td>
        <td style="text-align:center;white-space:nowrap">
          <button data-up="${i}" title="上移" ${i === 0 ? 'disabled' : ''}>↑</button>
          <button data-down="${i}" title="下移" ${i === items.length - 1 ? 'disabled' : ''}>↓</button>
          <button class="danger" data-del="${i}" title="删掉这一项">×</button>
        </td></tr>`;
    });
    h += '</tbody></table>';
    if (!items.length) h += '<p class="hint">还没有导航项。加一个吧。</p>';
    h += '<button id="btnAddNav">＋ 加一项</button> <button class="primary" id="btnSaveNav">保存</button>';
    showPanel(h);

    const collect = () => {
      document.querySelectorAll('#tbNav [data-f]').forEach((el) => {
        const i = +el.dataset.i;
        if (!items[i]) return;
        items[i][el.dataset.f] = el.value;
      });
    };
    const swap = (a, b) => { const t = items[a]; items[a] = items[b]; items[b] = t; };
    document.querySelectorAll('#tbNav [data-del]').forEach((b) => b.addEventListener('click', () => {
      collect(); items.splice(+b.dataset.del, 1); draw(items);
    }));
    document.querySelectorAll('#tbNav [data-up]').forEach((b) => b.addEventListener('click', () => {
      collect(); const i = +b.dataset.up; if (i > 0) { swap(i, i - 1); draw(items); }
    }));
    document.querySelectorAll('#tbNav [data-down]').forEach((b) => b.addEventListener('click', () => {
      collect(); const i = +b.dataset.down; if (i < items.length - 1) { swap(i, i + 1); draw(items); }
    }));
    $('#btnAddNav').addEventListener('click', () => {
      collect();
      items.push({ name: '新标签', pageRef: '/blog/' });
      draw(items);
    });
    $('#btnSaveNav').addEventListener('click', async () => {
      collect();
      try {
        const r = await apiPost('/api/menu', { items });
        toast('导航栏已保存（预览里刷新一下就能看到）' + (r && r.count ? '，共 ' + r.count + ' 项' : ''), 'ok');
      } catch (e) {
        toast('保存失败：' + e.message, 'err');
      }
    });
  };
  draw(d.items.map((x) => Object.assign({}, x)));
}

         '加一条时会自动带上上一行的日期 —— 同一天要加第二条，直接改文字就行。</div>';
    h += '<table class="grid"><thead><tr>' +
         '<th style="width:140px">日期</th><th>更新内容</th>' +
         '<th style="width:22%">链接（可空）</th><th style="width:118px"></th>' +
         '</tr></thead><tbody id="tbChg">';
    items.forEach((it, i) => {
      h += `<tr${it.indent ? ' class="is-sub"' : ''}>
        <td><input type="date" data-f="date" data-i="${i}" value="${esc(it.date || '')}"></td>
        <td><input data-f="title" data-i="${i}" value="${esc(it.title || '')}" placeholder="比如：连接了花涧堂。"></td>

        <td style="text-align:center;white-space:nowrap">
          <button data-ind="${i}" style="padding:1px 6px"
            title="${it.indent ? '改回并列（不缩进）' : '缩进成上一条的子条目'}">${it.indent ? '子条目' : '并列'}</button>
          <button class="danger" data-del="${i}">×</button>
        </td></tr>`;
    });
    h += '</tbody></table>';
    if (!items.length) h += '<p class="hint">还没有记录。第一条通常是「创建了这个网站」。</p>';
    h += `<p class="hint">共 ${items.length} 条，跨 ${new Set(items.map((x) => String(x.date || '').slice(0, 4))).size} 个年份。</p>`;
    h += '<button id="btnAddChg">＋ 加一条更新</button> ' +
         '<button class="primary" id="btnSaveChg">保存</button>';
    showPanel(h);

    const collect = () => {
      document.querySelectorAll('#tbChg input[data-f]').forEach((el) => {
        const i = +el.dataset.i;
        if (!items[i]) return;
        items[i][el.dataset.f] = el.value;
      });
    };
    document.querySelectorAll('#tbChg [data-del]').forEach((b) => b.addEventListener('click', () => {
      collect(); items.splice(+b.dataset.del, 1); draw(items);
    }));
    // 并列 <-> 子条目
    document.querySelectorAll('#tbChg [data-ind]').forEach((b) => b.addEventListener('click', () => {
      collect();
      const it = items[+b.dataset.ind];
      if (!it) return;
      if (it.indent) delete it.indent; else it.indent = true;
      draw(items);
    }));
    $('#btnAddChg').addEventListener('click', () => {
      collect();
      const lastDate = items.length ? String(items[items.length - 1].date || '') : '';
      items.push({ date: lastDate || today, title: '' });
      draw(items);
    });
    $('#btnSaveChg').addEventListener('click', async () => {
      collect();
      try {
        const r = await apiPost('/api/list/changelog', { items });
        toast('更新历史已保存（预览里刷新一下就能看到）' + (r && r.count ? '，共 ' + r.count + ' 条' : ''), 'ok');
      } catch (e) {
        toast('保存失败：' + e.message, 'err');
      }
    });
  };
  draw(d.items.map((x) => Object.assign({}, x)));
}

async function renderGallery() {
  const d = await apiGet('/api/list/gallery');
  const items = (d.items || []).map((x) => Object.assign({}, x));

  const missing = new Set(d.missing || []);

  let html = '';
  html += '<h2 class="sec">画廊</h2>';
  html += '<p class="hint">画廊页（<code>/gallery/</code>）里的画。页面正文只有一行 <code>{{&lt; gallery &gt;}}</code>，' +
          '分类小节和缩略图都由 <code>data/gallery.toml</code> 生成，这里加一张页面就多一张。</p>';
  html += '<div class="note">' +
          '<b>上传新图</b>：选文件即可，自动存进 <code>static/images/gallery/</code> 并压一张缩略图（首屏只背几十 KB，点开才加载原图）。<br>' +
          '<b>引用已有的图</b>：站上 <code>static/images/</code> 里已经有的图不用再传一份，点「选已有图」挑就行。<br>' +
          '<b>按住左侧 ≡ 拖动</b>就是站内展示顺序（同一分类内：封面最前，其余按创作日期从新到旧）。<br>' +
          '标题和创作日期是页面上显示的那两行；日期留空也行。</div>';

  html += '<table class="grid" id="galTable"><thead><tr>' +
          '<th style="width:26px"></th><th style="width:44px">预览</th>' +
          '<th style="width:22%">图片文件</th><th style="width:22%">标题</th>' +
          '<th style="width:118px">创作日期</th><th style="width:120px">分类</th>' +
          '<th style="width:34px">封面</th><th style="width:34px"></th>' +
          '</tr></thead><tbody id="tbGal"></tbody></table>';
  html += '<div id="galEmpty" class="hint"></div>';
  html += '<div style="margin-top:6px">' +
          '<button id="btnGalUpload">' + ico('upload') + ' 上传新图</button> ' +
          '<button id="btnGalPick">' + ico('grid') + ' 选已有图</button> ' +
          '<button id="btnGalAdd">＋ 手动加一条</button> ' +
          '<button class="primary" id="btnGalSave">' + ico('save') + ' 保存</button>' +
          '</div>';
  html += '<input type="file" id="galFile" accept="image/*" multiple hidden>';

  html += '<h2 class="sec" style="margin-top:18px">分类</h2>';
  html += '<p class="hint">分类就是页面上的小节标题。<b>id 是页内锚点</b>（首字母不能乱改，改了旧链接会失效），' +
          'name 是显示名，desc 是标题下面那行灰字。</p>';
  html += '<div id="galSections"></div>';
  html += '<div style="margin-top:6px"><button id="btnGalAddSec">＋ 加一个分类</button></div>';

  showPanel(html);

  // ---------- 分类 ----------
  const drawSections = () => {
    const box = $('#galSections');
    box.innerHTML = '';
    sections.forEach((s, i) => {
      const row = document.createElement('div');
      row.className = 'gal-secrow';
      row.style.cssText = 'display:flex;gap:6px;margin-bottom:5px;align-items:center';
      const mk = (field, ph, w) => {
        const el = document.createElement('input');
        el.value = s[field] || '';
        el.placeholder = ph;
        el.dataset.sec = String(i);
        el.dataset.field = field;
        el.style.cssText = 'font:inherit;font-size:12px;padding:3px 5px;border:1px solid var(--line);border-radius:3px;' + (w || '');
        return el;
      };
      row.appendChild(mk('id', 'id（锚点）', 'width:130px'));
      row.appendChild(mk('name', '显示名', 'width:170px'));
      row.appendChild(mk('desc', '说明（可空）', 'flex:1'));

      del.addEventListener('click', () => {
        collectSections();
        const used = items.filter((it) => it.cat === sections[i].id).length;

        sections.splice(i, 1);
        drawSections();
      });
      row.appendChild(del);
      box.appendChild(row);
    });
  };
  const collectSections = () => {
    document.querySelectorAll('#galSections input[data-sec]').forEach((el) => {
      sections[+el.dataset.sec][el.dataset.field] = el.value;
    });
  };

  // ---------- 画作表格 ----------
  const draw = () => {
    const tb = $('#tbGal');
    tb.innerHTML = '';
    const nameOf = (id) => (sections.find((s) => s.id === id) || {}).name || '（未选）';

    items.forEach((it, i) => {
      const tr = document.createElement('tr');
      tr.draggable = true;
      tr.dataset.i = String(i);

      const td0 = document.createElement('td');
      td0.style.textAlign = 'center';
      td0.innerHTML = '<span class="handle" style="cursor:grab">≡</span>';

      const td1 = document.createElement('td');
      const img = document.createElement('img');
      img.style.cssText = 'width:36px;height:36px;object-fit:cover;border:1px solid var(--line);background:#fff';
      img.alt = '';
      img.loading = 'lazy';
      img.src = it.file ? '/images/' + it.file : '';
      td1.appendChild(img);

      const tdFile = document.createElement('td');
      const inp = document.createElement('input');
      inp.value = it.file || '';
      inp.placeholder = 'gallery/xxx.png';
      inp.dataset.f = 'file';
      inp.dataset.i = String(i);
      tdFile.appendChild(inp);

      const tdTitle = document.createElement('td');
      const tIn = document.createElement('input');
      tIn.value = it.title || '';
      tIn.placeholder = '画的名字';
      tIn.dataset.f = 'title';
      tIn.dataset.i = String(i);
      // 简介（悬浮卡上显示的那行）：没写就退回该分类的说明，所以可以空着
      const dscIn = document.createElement('input');
      dscIn.value = it.desc || '';
      dscIn.placeholder = '简介（可空，会退回分类说明）';
      dscIn.dataset.f = 'desc';
      dscIn.dataset.i = String(i);
      dscIn.style.cssText = 'margin-top:2px;color:#5a7089';
      tdTitle.append(tIn, dscIn);

      const tdDate = document.createElement('td');
      const dIn = document.createElement('input');
      dIn.type = 'date';
      dIn.value = it.date || '';
      dIn.dataset.f = 'date';
      dIn.dataset.i = String(i);
      tdDate.appendChild(dIn);

      const tdCat = document.createElement('td');
      const sel = document.createElement('select');
      sel.dataset.f = 'cat';
      sel.dataset.i = String(i);
      sel.style.cssText = 'width:100%;font:inherit;font-size:12px;padding:3px';
      const opt0 = document.createElement('option');
      opt0.value = '';
      opt0.textContent = '（选分类）';
      sel.appendChild(opt0);
      sections.forEach((s) => {
        const o = document.createElement('option');
        o.value = s.id;
        o.textContent = s.name;
        if (it.cat === s.id) o.selected = true;
        sel.appendChild(o);
      });
      tdCat.appendChild(sel);

      const tdCover = document.createElement('td');
      tdCover.style.textAlign = 'center';
      const cb = document.createElement('input');
      cb.type = 'checkbox';
      cb.checked = !!it.cover;
      cb.dataset.f = 'cover';
      cb.dataset.i = String(i);
      tdCover.appendChild(cb);

      const tdDel = document.createElement('td');
      tdDel.style.textAlign = 'center';
      const del = document.createElement('button');
      del.className = 'danger';
      del.textContent = '×';
      del.addEventListener('click', () => { collect(); items.splice(i, 1); draw(); });
      tdDel.appendChild(del);

      tr.append(td0, td1, tdFile, tdTitle, tdDate, tdCat, tdCover, tdDel);
      if (it.file && missing.has(it.file)) {
        tr.style.background = '#fff5f5';
        tr.title = '找不到这个图片文件：static/images/' + it.file;
      }
      tb.appendChild(tr);
    });

    $('#galEmpty').innerHTML = items.length ? '' :
      '还没有画。点上面的「上传新图」或「选已有图」开始。';
  };

  const collect = () => {
    document.querySelectorAll('#tbGal [data-f]').forEach((el) => {
      const i = +el.dataset.i;
      if (!items[i]) return;
      items[i][el.dataset.f] = el.dataset.f === 'cover' ? el.checked : el.value;
    });
  };

  const save = async () => {
    collect();
    collectSections();
    const payload = {
      sections: sections.map((s) => ({ id: s.id.trim(), name: s.name.trim(), desc: s.desc.trim() })),
      items: items.map((it) => ({
        title: String(it.title || '').trim(),
        file: String(it.file || '').trim(),
        cat: String(it.cat || '').trim(),
        date: String(it.date || '').trim(),
        desc: String(it.desc || '').trim(),
        cover: !!it.cover,
      })).filter((it) => it.title || it.file),
    };
    try {
      const r = await apiPost('/api/list/gallery', payload);
      (r.missing || []).forEach((f) => missing.add(f));
      toast('画廊已保存' + (r.missing && r.missing.length ? `（有 ${r.missing.length} 张图文件没找到，已标红）` : ''), 'ok');
      return true;
    } catch (e) { toast('保存失败：' + e.message, 'err'); return false; }
  };

  // ---------- 事件 ----------
  drawSections();
  draw();

  $('#btnGalAddSec').addEventListener('click', () => {
    collectSections();
    sections.push({ id: '', name: '', desc: '' });
    drawSections();
    const first = document.querySelector('#galSections input[data-sec]:last-of-type');
    if (first) first.focus();
  });

  $('#btnGalAdd').addEventListener('click', () => {
    collect();
    items.push({ title: '', file: '', cat: sections.length ? sections[0].id : '', date: '', cover: false });
    draw();
  });

  $('#btnGalSave').addEventListener('click', save);

  // 上传：落进 static/images/gallery/，服务端顺手压缩略图
  $('#btnGalUpload').addEventListener('click', () => $('#galFile').click());
  $('#galFile').addEventListener('change', async (e) => {
    const files = [...(e.target.files || [])];
    if (!files.length) return;
    collect();
    toast('正在上传 ' + files.length + ' 张…');
    for (const f of files) {
      try {
        const data = await new Promise((res, rej) => {
          const rd = new FileReader();
          rd.onload = () => res(rd.result);
          rd.onerror = () => rej(new Error('读文件失败'));
          rd.readAsDataURL(f);
        });
        const r = await apiPost('/api/upload', { name: f.name, data, dir: 'images/gallery' });
        items.push({
          title: f.name.replace(/\.[^.]+$/, ''),
          file: 'gallery/' + (r.rel || '').split('/').pop(),
          cat: sections.length ? sections[0].id : '',
          date: '',
          cover: false,
        });
        if (r.thumb && r.thumb.ok === false) toast('缩略图没生成：' + r.thumb.error, 'err');
      } catch (err) {
        toast('「' + f.name + '」上传失败：' + err.message, 'err');
      }
    }
    e.target.value = '';
    await save();
    openPanel('gallery');
  });

  // 选已有图
  $('#btnGalPick').addEventListener('click', async () => {
    collect();
    collectSections();
    await pickExistingImages({
      sections,
      imported: items.map((x) => String(x.file || '').trim()).filter(Boolean),
      back: () => openPanel('gallery'),
      onPick: (files) => {
        // 同一张图重复点进来会很困惑，已经在本页里的就跳过（并说一声）
        const have = new Set(items.map((x) => String(x.file || '').trim()));
        const skipped = [];
        files.forEach((f) => {
          if (have.has(f)) { skipped.push(f); return; }
          have.add(f);
          items.push({
            title: f.replace(/^.*\//, '').replace(/\.[^.]+$/, ''),
            file: f,
            cat: sections.length ? sections[0].id : '',
            date: '',
            cover: false,
          });
        });
        if (skipped.length) toast('已在画廊里，跳过 ' + skipped.length + ' 张：' + skipped.join('、'), 'err');
        if (!files.length || (skipped.length === files.length)) { openPanel('gallery'); return; }
        save().then(() => openPanel('gallery'));
      },
    });
  });

  // 拖拽排序
  const tb = $('#tbGal');
  let drag = null;
  tb.addEventListener('dragstart', (e) => {
    const tr = e.target.closest('tr[data-i]');
    if (!tr) { e.preventDefault(); return; }
    drag = tr; tr.style.opacity = '.45';
    e.dataTransfer.effectAllowed = 'move';
    try { e.dataTransfer.setData('text/plain', tr.dataset.i); } catch (err) {}
  });
  tb.addEventListener('dragover', (e) => {
    if (!drag) return;
    const tr = e.target.closest('tr[data-i]');
    if (!tr || tr === drag) return;
    e.preventDefault();
    const r = tr.getBoundingClientRect();
    tb.insertBefore(drag, e.clientY > r.top + r.height / 2 ? tr.nextSibling : tr);
  });
  tb.addEventListener('drop', (e) => { if (drag) e.preventDefault(); });
  tb.addEventListener('dragend', async () => {
    if (!drag) return;
    drag.style.opacity = ''; drag = null;
    const order = [...tb.querySelectorAll('tr[data-i]')].map((tr) => +tr.dataset.i);
    if (!order.some((v, k) => v !== k)) return;
    const next = order.map((i) => items[i]);
    items.length = 0; items.push(...next);
    if (await save()) openPanel('gallery');
  });
}

/* ---------- 选一张站上已有的图 ----------
   站上 static/images/ 里已经有 100 多张图了（日记、首页、迁移过来的），
   正文里想用它们的时候，以前只能手打路径。这里给个带缩略图的挑选器。 */
async function pickExistingImages(opts) {
  const d = await apiGet('/api/gallery/images');
  const all = d.items || [];

  let h = '<h2 class="sec">选站上已有的图片</h2>';
  h += '<p class="hint">来自 <code>static/images/</code>，共 ' + all.length + ' 张。' +
       '点一张选中，点「插入」就把它加进去 —— 不会复制文件，只是引用。' +
       (opts && opts.imported && opts.imported.length
         ? '带 <b>已导入</b> 标记的是画廊里已经有的。'
         : '') + '</p>';
  h += '<p><input id="galPickSearch" placeholder="按文件名筛…" style="font:inherit;padding:4px 7px;border:1px solid var(--line);border-radius:4px;width:260px"> ' +
       '<button id="galPickInsert" class="primary">插入选中的</button> ' +
       '<button id="galPickBack">返回</button> ' +
       '<span class="cmt" id="galPickInfo"></span></p>';
  h += '<div id="galPickGrid" class="galpick"></div>';
  showPanel(h);

  if (opts && opts.back) {
    $('#galPickBack').hidden = false;
    $('#galPickBack').addEventListener('click', opts.back);
  } else {
    $('#galPickBack').hidden = true;
  }

  const chosen = new Set();
  // 已经在画廊里的图：打个「已导入」标记，省得点进去才发现被跳过
  const imported = new Set(((opts && opts.imported) || []).map((s) => String(s).trim()));
  const grid = $('#galPickGrid');
  const info = $('#galPickInfo');

  const paint = (filter) => {
    const list = all.filter((it) => !filter || it.file.toLowerCase().includes(filter.toLowerCase()));
    grid.innerHTML = '';
    list.slice(0, 300).forEach((it) => {
      const already = imported.has(it.file);
      const cell = document.createElement('button');
      cell.type = 'button';
      cell.className = 'galpick-cell' + (chosen.has(it.file) ? ' on' : '') + (already ? ' added' : '');
      cell.dataset.file = it.file;
      cell.title = it.file + '（' + Math.round(it.bytes / 1024) + ' KB' + (it.thumb ? '，有缩略图' : '') +
        (already ? '，已经在画廊里了' : '') + '）';
      const im = document.createElement('img');
      im.src = it.preview;
      im.loading = 'lazy';
      im.alt = '';
      const cap = document.createElement('span');
      cap.textContent = it.file.split('/').pop();
      cell.append(im, cap);
      if (already) {
        const tag = document.createElement('i');
        tag.className = 'galpick-tag';
        tag.textContent = '已导入';
        cell.appendChild(tag);
      }
      cell.addEventListener('click', () => {
        if (chosen.has(it.file)) chosen.delete(it.file); else chosen.add(it.file);
        cell.classList.toggle('on', chosen.has(it.file));
        info.textContent = chosen.size ? '已选 ' + chosen.size + ' 张' : '';
      });
      grid.appendChild(cell);
    });
    if (list.length > 300) {
      const more = document.createElement('p');
      more.className = 'hint';
      more.textContent = '（只显示前 300 张，用上面的搜索缩小范围）';
      grid.appendChild(more);
    }
    if (!list.length) {
      const none = document.createElement('p');
      none.className = 'hint';
      none.textContent = '没有匹配的图片。';
      grid.appendChild(none);
    }
  };
  paint('');

  $('#galPickSearch').addEventListener('input', (e) => paint(e.target.value.trim()));
  $('#galPickInsert').addEventListener('click', () => {
    if (!chosen.size) { toast('先点几张图选中', 'err'); return; }
    const files = [...chosen];
    if (opts && opts.onPick) { opts.onPick(files); return; }
    // 没给回调就走「插入 <img>」的老路（正文里插图用）
    const w = imgWidthValue();
    let out = '';
    files.forEach((f) => {
      out += makeImg('/images/' + f, f.replace(/^.*\//, '').replace(/\.[^.]+$/, ''), w) + '\n';
    });
    insertText(out);
    toast('已插入 ' + files.length + ' 个 <img>', 'ok');
  });
}

/* --- 音乐播放器（侧栏最上面那条窄条） ---
   音频丢进 static/music/，曲目写在 data/music.toml 的 [[tracks]] 里。
   这个面板就是给那件事用的：拖拽排序、直接上传音频、还能一眼看出
   哪首的音频文件其实不在——那是最容易踩的坑（写了曲名忘了拷文件）。 */
async function renderMusic() {
  const d = await apiGet('/api/list/music');
  const items = (d.items || []).map((x) => Object.assign({}, x));
  const status = {};                       // 文件名 -> 在不在
  (d.status || []).forEach((s) => { status[s.file] = s; });
  const isExt = (f) => /^(https?:)?\/\//i.test(String(f || '').trim());

  const draw = () => {
    let h = '<h2 class="sec">音乐</h2>';
    h += '<p class="hint">侧栏最上面那条播放器。曲目对应 <code>data/music.toml</code>，' +
         '音频放在 <code>static/music/</code>。</p>';
    h += '<div class="note"><b>按住左侧 ≡ 拖动</b>就是播放顺序，松手即保存，不用另点保存按钮。<br>' +
         '「上传音频」会把文件直接存进 <code>static/music/</code> 并自动加一条曲目 —— ' +
         '这是最省事的做法；已经手动拷进去的，把<b>文件名</b>（不带目录）填进第一列也行。<br>' +
         '也可以用外链：第一列直接写完整的 <code>https://</code> 地址。<br>' +
         '一首都没有时，侧栏那条播放器整个不显示。</div>';
    h += '<table class="grid"><thead><tr>' +
         '<th style="width:28px"></th>' +
         '<th style="width:30%">音频文件</th>' +
         '<th style="width:26%">曲名（可空）</th>' +
         '<th style="width:22%">作者 / 出处（可空）</th>' +
         '<th style="width:30px"></th></tr></thead><tbody id="tbMusic"></tbody></table>';
    h += '<div id="musicRows"></div>';
    h += '<p id="musicEmpty" class="hint">' + (items.length ? '' : '还没有曲目。点下面的「上传音频」或「＋ 手动加一条」开始。') + '</p>';
    h += '<button id="btnMusicUpload">' + ico('upload') + ' 上传音频</button> ';
    h += '<button id="btnMusicAdd">＋ 手动加一条</button> ';
    h += '<button class="primary" id="btnMusicSave">' + ico('save') + ' 保存</button>';
    h += '<input type="file" id="musicFile" accept="audio/*,.mp3,.ogg,.m4a,.wav,.flac" multiple hidden>';
    showPanel(h);

    const tb = $('#tbMusic');
    items.forEach((it, i) => {
      const f = String(it.file || '').trim();
      const st = status[f];
      let badge = '';
      if (f) {
        if (isExt(f)) badge = '<span style="color:var(--dim)">外链</span>';
        else if (st && st.exists) badge = '<span style="color:#2e7d32">✓ 在位</span>';
        else badge = '<span style="color:var(--danger)">⚑ 找不到</span>';
      }
      const tr = document.createElement('tr');
      tr.draggable = true;
      tr.dataset.i = String(i);
      tr.innerHTML =
        `<td style="text-align:center"><span class="handle" style="cursor:grab">≡</span></td>` +
        `<td><input data-f="file" data-i="${i}" value="${esc(it.file || '')}" placeholder="iforest.mp3"></td>` +
        `<td><input data-f="title" data-i="${i}" value="${esc(it.title || '')}" placeholder="不填就显示文件名"></td>` +
        `<td><input data-f="artist" data-i="${i}" value="${esc(it.artist || '')}" placeholder="来源未知"></td>` +
        `<td style="text-align:center;white-space:nowrap">${badge}<br><button class="danger" data-del="${i}" title="删掉这条">×</button></td>`;
      tb.appendChild(tr);
    });

    const collect = () => {
      document.querySelectorAll('#tbMusic input[data-f]').forEach((el) => {
        if (items[+el.dataset.i]) items[+el.dataset.i][el.dataset.f] = el.value;
      });
    };
    document.querySelectorAll('#tbMusic [data-del]').forEach((b) => {
      b.addEventListener('click', () => { collect(); items.splice(+b.dataset.del, 1); draw(); });
    });
    $('#btnMusicAdd').addEventListener('click', () => {
      collect(); items.push({ file: '', title: '', artist: '' }); draw();
    });

    // 拖拽排序（和「侧栏排序」同一套做法）
    let drag = null;
    tb.addEventListener('dragstart', (e) => {
      const tr = e.target.closest('tr[data-i]');
      if (!tr) { e.preventDefault(); return; }
      drag = tr;
      tr.style.opacity = '.45';
      e.dataTransfer.effectAllowed = 'move';
      try { e.dataTransfer.setData('text/plain', tr.dataset.i); } catch (err) { /* 忽略 */ }
    });
    tb.addEventListener('dragover', (e) => {
      if (!drag) return;
      const tr = e.target.closest('tr[data-i]');
      if (!tr || tr === drag) return;
      e.preventDefault();
      const r = tr.getBoundingClientRect();
      tb.insertBefore(drag, e.clientY > r.top + r.height / 2 ? tr.nextSibling : tr);
    });
    tb.addEventListener('drop', (e) => { if (drag) e.preventDefault(); });
    tb.addEventListener('dragend', async () => {
      if (!drag) return;
      drag.style.opacity = '';
      drag = null;
      const order = [...tb.querySelectorAll('tr[data-i]')].map((tr) => +tr.dataset.i);
      const next = order.map((i) => items[i]);
      const changed = order.some((v, k) => v !== k);
      if (!changed) return;
      items.length = 0;
      items.push(...next);
      const saved = await saveMusic(items);
      if (saved) draw();
    });

    // 上传音频：读成 base64 -> /api/upload-audio -> 落进 static/music/ 并加一条
    $('#btnMusicUpload').addEventListener('click', () => $('#musicFile').click());
    $('#musicFile').addEventListener('change', async (e) => {
      const files = [...(e.target.files || [])];
      if (!files.length) return;
      collect();
      toast('正在上传 ' + files.length + ' 个音频…');
      for (const f of files) {
        try {
          const data = await new Promise((res, rej) => {
            const rd = new FileReader();
            rd.onload = () => res(rd.result);
            rd.onerror = () => rej(new Error('读文件失败'));
            rd.readAsDataURL(f);
          });
          const r = await apiPost('/api/upload-audio', { name: f.name, data });
          items.push({ file: r.file, title: '', artist: '' });
        } catch (err) {
          toast('「' + f.name + '」上传失败：' + err.message, 'err');
        }
      }
      e.target.value = '';
      await saveMusic(items);
      toast('已上传并加入曲单（刷新预览就能听到）', 'ok');
      openPanel('music');
    });

    $('#btnMusicSave').addEventListener('click', async () => {
      collect();
      const ok = await saveMusic(items);
      if (ok) toast('曲单已保存（预览里刷新一下就能听到）', 'ok');
    });
  };

  const saveMusic = async (list) => {
    try {
      const r = await apiPost('/api/list/music', {
        items: list.map((x) => ({
          file: String(x.file || '').trim(),
          title: String(x.title || '').trim(),
          artist: String(x.artist || '').trim(),
        })).filter((x) => x.file),
      });
      // 报「文件不在」的那些，现在就反映到状态角标上
      (r.status || []).forEach((s) => { status[s.file] = s; });
      return true;
    } catch (err) {
      toast('保存失败：' + err.message, 'err');
      return false;
    }
  };

  draw();
}

/* --- 宝可梦放养区：台词（data/pkmn-talk/<图鉴号>.toml） ---
   一只一个文件，每只二十来个池子（它自己的 7 个 + 页面 8 个 + 天气 7 个）。
   改完保存时会顺手跑 tools/build-pkmn.py --talk，重新生成页面真正读取的
   static/pkmn/talk/<图鉴号>.json。40 字上限和「至少留几句」都跟着
   build-pkmn.py 里的校验走：这里超了会变红，真拦下来的还是脚本那一步。 */
let PK = null;

async function renderPkmn() {
  const meta = await apiGet('/api/pkmn');
  if (!meta.items.length) {
    return showPanel('<h2 class="sec">宝可梦台词</h2><p class="hint">没读到 <code>data/pkmn-pool.toml</code>，或者名单是空的。</p>');
  }
  const dex = (PK && meta.items.some((x) => x.dex === PK.dex)) ? PK.dex : meta.items[0].dex;
  const d = await apiGet('/api/pkmn/' + dex);
  PK = {
    meta, dex,
    // 名单里有、台词文件还没生成的（比如刚往 pkmn-pool.toml 里加了新的一只）也要能打开
    name: d.name || (meta.items.find((x) => x.dex === dex) || {}).name || String(dex),
    header: d.header,
    pools: d.pools || {}, page: d.page || {}, weather: d.weather || {},
    order: d.order || null,
    groups: meta.groups,
  };
  PK.loaded = JSON.stringify(pkmnPayload());
  paintPkmn();
}

/** 面板上的当前内容，拼成要发给服务端的形状（顺序按池子定义，空串丢掉） */
function pkmnPayload() {
  const strip = (o, keys) => {
    const out = {};
    for (const [k] of keys) {
      out[k] = (o[k] || []).map((s) => String(s).trim()).filter(Boolean);
    }
    return out;
  };
  return {
    name: PK.name, header: PK.header, order: PK.order,
    pools: strip(PK.pools, PK.groups.pools),
    page: strip(PK.page, PK.groups.page),
    weather: strip(PK.weather, PK.groups.weather),
  };
}

function pkmnTable(groupKey, title, hint, keys) {
  const arr = PK[groupKey];
  let h = `<h3 class="pk-h">${esc(title)}`;
  if (hint) h += ` <span class="pk-sub">${esc(hint)}</span>`;
  h += '</h3>';
  h += '<table class="grid"><thead><tr><th>说的话（一句一行，别用引号括号 emoji）</th>'
     + '<th style="width:56px">字数</th><th style="width:38px"></th></tr></thead><tbody>';
  (keys || []).forEach(([k, label, min]) => {
    const list = arr[k] || [];
    list.forEach((s, i) => {
      const n = [...String(s)].length;
      h += `<tr><td><input class="pk-in" data-g="${groupKey}" data-k="${esc(k)}" value="${esc(s)}"></td>`
         + `<td class="pk-n${n > 40 ? ' bad' : ''}">${n}</td>`
         + `<td style="text-align:center"><button class="danger" data-del="${groupKey}:${esc(k)}:${i}">×</button></td></tr>`;
    });
    h += `<tr><td colspan="3" class="pk-add"><span class="pk-sub">${esc(k)}`
       + `${min ? '（至少留 ' + min + ' 句）' : ''}</span> `
       + `<button data-add="${groupKey}:${esc(k)}">＋ 加一条</button></td></tr>`;
  });
  h += '</tbody></table>';
  return h;
}

function paintPkmn() {
  const it = PK.meta.items.find((x) => x.dex === PK.dex) || {};
  let h = '<h2 class="sec">宝可梦台词</h2>';
  h += `<div class="note">这里是侧栏「宝可梦放养区」里每只宝可梦说的话，一只一个文件
    （<code>data/pkmn-talk/${PK.dex}.toml</code>）。改完点最下面的<b>保存并生成</b> ——
    编辑器会顺手重新生成页面真正读取的 JSON，刷新预览页就能看到。<br>
    规矩：每句<b>不超过 40 个字</b>（对话框只有三行），不要用引号、书名号、括号，
    也不用写「${esc(PK.name)}：」这种前缀；同一只里面别出现重复的句子。<br>
    符号：<b>♪ ♫ ★ ☆ ♥ ■ □ ● ○ ← → ☀ ☁</b> 这些站里的点阵字体都有，随便用；
    字体里没有的（比如 ♡ ♩ ♬）保存时会红字拦下来 —— 它会掉到系统字体上、边缘发糊。</div>`;

  h += '<div class="field"><label>改哪一只</label><select id="pkSel">';
  for (const x of PK.meta.items) {
    h += `<option value="${x.dex}"${x.dex === PK.dex ? ' selected' : ''}>`
       + `${esc(x.name)}（${x.dex}·${x.sleep === 'day' ? '白天睡' : '夜里睡'}）</option>`;
  }
  h += `</select><span class="cmt">${it.total != null ? '现在共 ' + it.total + ' 句' : ''}</span></div>`;

  h += pkmnTable('pools', '它自己的话', '（按什么时候说分）', PK.groups.pools);
  h += pkmnTable('page', '看着某一页时说的', '（它正在陪你看这一页）', PK.groups.page);
  h += pkmnTable('weather', '外面什么天气时说的', '（按访客当地天气）', PK.groups.weather);

  h += '<div style="margin-top:18px"><button class="primary" id="btnSavePkmn">保存并生成</button> '
     + `<span class="cmt">${PK.meta.pythonOk ? '（保存后会自动重跑生成脚本）' : '⚠ 没找到 python：保存后不会重新生成 JSON'}</span></div>`;
  h += '<pre id="pkLog" class="pk-log" hidden></pre>';
  showPanel(h);
  bindPkmn();
}

function bindPkmn() {
  const collect = () => {
    const out = { pools: {}, page: {}, weather: {} };
    document.querySelectorAll('#panel input[data-g]').forEach((el) => {
      const g = el.dataset.g, k = el.dataset.k;
      if (!out[g][k]) out[g][k] = [];
      out[g][k].push(el.value);
    });
    PK.pools = out.pools; PK.page = out.page; PK.weather = out.weather;
  };
  document.querySelectorAll('#panel .pk-in').forEach((el) => el.addEventListener('input', () => {
    const td = el.closest('tr').querySelector('.pk-n');
    const n = [...el.value].length;
    td.textContent = n;
    td.classList.toggle('bad', n > 40);
  }));
  document.querySelectorAll('#panel [data-del]').forEach((b) => b.addEventListener('click', () => {
    collect();
    const [g, k, i] = b.dataset.del.split(':');
    PK[g][k].splice(+i, 1);
    paintPkmn();
  }));
  document.querySelectorAll('#panel [data-add]').forEach((b) => b.addEventListener('click', () => {
    collect();
    const [g, k] = b.dataset.add.split(':');
    (PK[g][k] = PK[g][k] || []).push('');
    paintPkmn();
    const rows = document.querySelectorAll(`#panel input[data-k="${CSS.escape(k)}"]`);
    const last = rows[rows.length - 1];
    if (last) last.focus();
  }));
  $('#pkSel').addEventListener('change', async (e) => {
    collect();
    if (JSON.stringify(pkmnPayload()) !== PK.loaded &&
        !confirm('这一只还有没保存的改动，换过去就丢了。要继续吗？')) {
      e.target.value = String(PK.dex);
      return;
    }
    PK.dex = Number(e.target.value);
    const d = await apiGet('/api/pkmn/' + PK.dex);
    PK.name = d.name || (PK.meta.items.find((x) => x.dex === PK.dex) || {}).name || String(PK.dex);
    PK.header = d.header;
    PK.order = d.order || null;
    PK.pools = d.pools || {}; PK.page = d.page || {}; PK.weather = d.weather || {};
    PK.loaded = JSON.stringify(pkmnPayload());
    paintPkmn();
  });
  $('#btnSavePkmn').addEventListener('click', async () => {
    collect();
    const payload = pkmnPayload();
    const btn = $('#btnSavePkmn');
    btn.disabled = true;
    btn.textContent = '正在生成…';
    try {
      const r = await apiPost('/api/pkmn/' + PK.dex, payload);
      const log = $('#pkLog');
      log.hidden = false;
      log.textContent = (r.ok ? '✓ 已保存，并重新生成了页面用的 JSON\n\n'
                              : '✗ 文件存下了，但生成时报错（页面上的台词还是旧的那份）\n\n') + (r.log || '');
      log.style.color = r.ok ? '#1e8e3e' : '#c5221f';
      toast(r.ok ? '台词已保存并生成' : '保存了，但生成失败 —— 看面板下面的报错', r.ok ? 'ok' : 'err');
      const d = await apiGet('/api/pkmn/' + PK.dex);
      PK.pools = d.pools || {}; PK.page = d.page || {}; PK.weather = d.weather || {};
      PK.loaded = JSON.stringify(pkmnPayload());
    } finally {
      btn.disabled = false;
      btn.textContent = '保存并生成';
    }
  });
}

async function renderSidebar() {
  const d = await apiGet('/api/sidebar');
  const label = {};
  d.widgets.forEach((w) => { label[w.key] = w.label; });
  const items = d.order.slice();

  let h = '<h2 class="sec">侧栏排序</h2>';
  h += '<p class="hint">右侧「侧边栏」里那些挂件的上下顺序。<b>按住一行拖动</b>即可，松手就保存到 <code>data/sidebar.toml</code>。</p>';
  h += '<div class="note">挂件本身的开关不在这一页 —— 访客统计 / 时钟 / 一言 / 更新日志 的开关在「站点设置」里，' +
       '友情链接和小按钮的内容在各自的面板里。</div>';
  h += '<ul id="sideOrder">';
  items.forEach((k) => {
    h += `<li draggable="true" data-key="${esc(k)}"><span class="handle">≡</span><span class="name">${esc(label[k] || k)}</span><code>${esc(k)}</code></li>`;
  });
  h += '</ul>';
  h += '<p class="hint">没列进去的挂件（比如以后新加的）会自动排在最后。</p>';
  showPanel(h);

  const ul = $('#sideOrder');
  let drag = null;
  ul.addEventListener('dragstart', (e) => {
    const li = e.target.closest('li[data-key]');
    if (!li) { e.preventDefault(); return; }
    drag = li;
    li.classList.add('dragging');
    e.dataTransfer.effectAllowed = 'move';
    try { e.dataTransfer.setData('text/plain', li.dataset.key); } catch (err) { /* 忽略 */ }
  });
  ul.addEventListener('dragover', (e) => {
    if (!drag) return;
    const li = e.target.closest('li[data-key]');
    if (!li || li === drag) return;
    e.preventDefault();
    const r = li.getBoundingClientRect();
    const after = e.clientY > r.top + r.height / 2;
    li.parentNode.insertBefore(drag, after ? li.nextSibling : li);
  });
  ul.addEventListener('drop', (e) => { if (drag) e.preventDefault(); });
  ul.addEventListener('dragend', async () => {
    if (!drag) return;
    drag.classList.remove('dragging');
    drag = null;
    const order = [...ul.querySelectorAll('li[data-key]')].map((li) => li.dataset.key);
    try {
      await apiPost('/api/sidebar', { order });
      toast('侧栏顺序已保存', 'ok');
    } catch (err) { toast('保存失败：' + err.message, 'err'); }
  });
}
