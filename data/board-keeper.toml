# ============================================================
#  拉鲁瓦 —— 布告栏的管理员
#  ------------------------------------------------------------
#  /board/ 页面里从右边飞进来的那只超音波幼虫。点它会弹出对话框，
#  里面有它的头图（精灵表里的"脸图"那一行）和一句闲聊。
#
#  闲聊分两种，一起随机抽：
#    1. 自动带数据的（便签时间、访客人数、最近更新…）—— 由
#       static/js/board-keeper.js 现算，改不了措辞但内容都是真的。
#    2. 下面这些**手写的固定台词** —— 想说点什么就写在这儿。
#
#  注意：
#    · 这里**不要**写占位符，写了也不会被替换（自动那几条是代码里拼的）。
#    · 想只在某几天说，用 from / to（"2026-10-01" 这种），不写就是一直说。
#    · 一句一行就行，太长的会自动换行；建议不超过 60 字。
# ============================================================

[[lines]]
  text = "布告栏这一块归我管。你贴的每一张我都会看哦。"

[[lines]]
  text = "便签可以自己挑颜色的，别老是米白色的那一张呀。"

[[lines]]
  text = "风大的时候板子会响，那是藤蔓在敲画框，不是坏了。"

[[lines]]
  text = "砖墙上那只蜗牛？它没来过这边，你别问了。"

[[lines]]
  text = "写完了记得看一眼自己写的话，贴出去就收不回来啦。"

[[lines]]
  text = "要是看到不该看的，跟虹星说一声，她会把它撤下来。"
