{{ define "main" }}

<div class="box">
  <div class="box-title">404 - 页面走丢了</div>
  <div class="box-body error-body">
    <div class="error-code">404</div>
    <p class="error-text">
      抱歉，你要找的页面已经不在了。<br>
      可能是链接过期，也可能是站长手滑把文件删了……
    </p>
    <p class="error-tips">
      要不要试试：
    </p>
    <ul class="error-links">
      <li><a href="{{ "/" | relURL }}">返回首页</a></li>
      <li><a href="{{ "/blog" | relURL }}">看看博客</a></li>
      <li><a href="{{ "/links" | relURL }}">逛逛友链</a></li>
    </ul>
    <p class="error-quote">「404 Not Found —— 这是互联网最诚实的错误码。」</p>
  </div>
</div>

{{ end }}
