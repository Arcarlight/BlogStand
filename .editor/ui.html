<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>星虹巢 · 本地编辑器</title>
<style>
  :root{
    --bg:#eef2f7; --panel:#fff; --line:#c9d6e5; --ink:#22303f; --dim:#7488a0;
    --accent:#1b5a9e; --accent2:#ff9900; --danger:#c0392b; --ok:#1e8e3e;
  }
  *{box-sizing:border-box}
  html,body{height:100%;margin:0}
  body{
    font:13px/1.6 "Microsoft YaHei","微软雅黑","PingFang SC","Hiragino Sans GB",-apple-system,"Segoe UI",sans-serif;
    color:var(--ink);background:var(--bg);display:flex;flex-direction:column;overflow:hidden;
  }
  /* ---------- 顶栏 ---------- */
  header{
    display:flex;align-items:center;gap:8px;padding:8px 12px;background:linear-gradient(180deg,#4c93dc,#1c5c9f);
    color:#fff;box-shadow:0 2px 6px rgba(0,0,0,.2);z-index:10;
  }
  header .brand{font-weight:bold;font-size:14px;letter-spacing:.5px;text-shadow:1px 1px 0 rgba(0,0,0,.3)}
  header .spacer{flex:1}
  button{
    font:inherit;padding:5px 12px;border:1px solid var(--line);border-radius:4px;background:#fff;
    color:var(--ink);cursor:pointer;
  }
  button:hover{background:#f0f6ff}
  button:disabled{opacity:.5;cursor:default}
  button.primary{background:#ffb84d;border-color:#e08600;color:#4a2b00;font-weight:bold}
  button.primary:hover{background:#ffc76b}
  button.danger{background:#fff;border-color:#e0b4b0;color:var(--danger)}
  button.danger:hover{background:#fdf0ef}
  button.ghost{background:rgba(255,255,255,.14);border-color:rgba(255,255,255,.4);color:#fff}
  button.ghost:hover{background:rgba(255,255,255,.28)}
  .dirty{background:#fff3cd;color:#7a5b00;border:1px solid #e5c76b;border-radius:3px;padding:1px 7px;font-size:12px}

  /* ---------- 布局 ---------- */
  #main{flex:1;display:flex;min-height:0}
  /* 侧栏是「上面列表可滚动 + 底部版权行固定」的两段式 */
  #side{width:250px;flex:none;background:var(--panel);border-right:1px solid var(--line);display:flex;flex-direction:column;overflow:hidden}
  #tree{flex:1;overflow:auto;padding:8px 0}
  #credits{flex:none;padding:5px 12px;border-top:1px solid var(--line);background:#fafcff;font-size:11px;line-height:1.5;color:var(--dim)}
  #credits a{color:var(--accent);text-decoration:none}
  #credits a:hover{text-decoration:underline}
  #work{flex:1;display:flex;flex-direction:column;min-width:0}
  #toolbar{display:flex;align-items:center;gap:6px;padding:6px 10px;background:var(--panel);border-bottom:1px solid var(--line);flex-wrap:wrap}
  #toolbar button{flex:none;padding:4px 9px}
  #curPath{font-family:Consolas,monospace;color:var(--dim);font-size:12px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
  #toolbar .spacer{flex:1}
  #panes{flex:1;display:flex;min-height:0}

  /* ---------- 侧栏树 ---------- */
  .grp{padding:10px 12px 4px;font-size:11px;font-weight:bold;color:var(--dim);letter-spacing:1px}
  .row{
    display:flex;align-items:center;gap:6px;padding:4px 12px 4px 18px;cursor:pointer;
    white-space:nowrap;overflow:hidden;text-overflow:ellipsis;
  }
  .row:hover{background:#eef5fd}
  .row.active{background:#dcebfa;font-weight:bold;color:var(--accent)}
  .row.tool{padding-left:12px}
  .row .badge{font-size:10px;color:var(--dim);margin-left:auto}
  /* 拖动排序 */
  .row[draggable="true"]{cursor:grab}
  .row.dragging{opacity:.4}
  .row.drop-before{box-shadow:inset 0 2px 0 0 var(--accent)}
  .row.drop-after{box-shadow:inset 0 -2px 0 0 var(--accent)}

  /* ---------- 侧栏排序面板里的拖动列表 ---------- */
  #sideOrder{list-style:none;max-width:440px;margin:10px 0}
  #sideOrder li{
    display:flex;align-items:center;gap:8px;padding:7px 10px;margin-bottom:4px;
    background:#fff;border:1px solid var(--line);border-radius:4px;cursor:grab;font-size:13px;
  }
  #sideOrder li:hover{background:#f4f9ff}
  #sideOrder li.dragging{opacity:.4}
  #sideOrder li .handle{color:var(--dim);font-size:15px;line-height:1}
  #sideOrder li code{margin-left:auto;font-size:11px;color:var(--dim);background:#f2f7fc;padding:1px 5px;border-radius:3px}

  /* ---------- 编辑区 ---------- */
  #editor{
    flex:1;min-width:0;border:0;outline:0;padding:14px 16px;resize:none;
    font:13.5px/1.75 Consolas,"SF Mono",Menlo,Monaco,"Courier New","Microsoft YaHei","PingFang SC",monospace;
    background:#fbfdff;color:#22303f;tab-size:2;
  }
  #previewPane{flex:1;min-width:0;display:none;flex-direction:column;border-left:1px solid var(--line);background:#fff}
  body.preview #previewPane{display:flex}
  #previewBar{display:flex;align-items:center;gap:6px;padding:3px 8px;background:#f2f7fc;border-bottom:1px solid var(--line);flex:none}
  #previewPath{flex:1;font-family:Consolas,monospace;font-size:12px;color:#44586e;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
  #previewBar button{padding:1px 9px;font-size:12px;line-height:1.5}
  #preview{flex:1;min-width:0;border:0;background:#fff}
  body.preview #editor{flex:1}
  #panel{flex:1;overflow:auto;padding:16px;background:var(--panel);display:none}
  body.panel #panel{display:block}
  body.panel #editor{display:none}
  body.panel #previewPane{display:none}
  /* 打开工具面板时，跟正文有关的那几个控件收起来（不然点了会改到别的文件） */
  body.panel #toolbar button.fmt,
  body.panel #toolbar .grp-label,
  body.panel #toolbar .sep,
  body.panel #imgWidthSel,
  body.panel #btnApplyWidth,
  body.panel #btnInsertImg,
  body.panel #btnInsertDay,
  body.panel #btnToggleDraft{display:none}

  /* ---------- 表单 ---------- */
  h2.sec{margin:0 0 4px;font-size:15px;color:var(--accent)}
  p.hint{margin:0 0 16px;color:var(--dim);font-size:12px}
  .field{display:flex;align-items:center;gap:10px;padding:5px 0;border-bottom:1px dashed #e6edf6}
  .field label{width:190px;flex:none;font-family:Consolas,monospace;font-size:12px;color:#44586e}
  .field input[type=text],.field textarea{
    flex:1;font:inherit;padding:4px 8px;border:1px solid var(--line);border-radius:3px;background:#fff;
  }
  .field textarea{font-family:Consolas,monospace;font-size:12px;min-height:60px;resize:vertical}
  .field input[type=checkbox]{width:16px;height:16px}
  .field .cmt{color:#9db0c4;font-size:11px;max-width:320px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}

  table.grid{width:100%;border-collapse:collapse;margin-bottom:10px}
  table.grid th{background:#eef5fd;border:1px solid var(--line);padding:5px 8px;font-size:12px;text-align:left}
  table.grid td{border:1px solid var(--line);padding:3px 5px}
  table.grid input{width:100%;font:inherit;font-size:12px;border:1px solid transparent;background:transparent;padding:3px 5px;border-radius:3px}
  table.grid input:focus{border-color:var(--accent);background:#fff;outline:0}
  .swatch{width:34px;height:24px;border:1px solid var(--line);border-radius:3px;padding:0;vertical-align:middle}

  /* ---------- 脚本卡 ---------- */
  .card{border:1px solid var(--line);border-radius:6px;padding:12px 14px;margin-bottom:10px;background:#fbfdff}
  .card h4{margin:0 0 6px;font-size:13px}
  .card .meta{color:var(--dim);font-size:11px;font-family:Consolas,monospace}
  .card .acts{margin-top:8px;display:flex;gap:6px;align-items:center}
  .sw{display:inline-flex;align-items:center;gap:6px;cursor:pointer;font-size:12px}

  /* ---------- 弹窗 ---------- */
  #modal{position:fixed;inset:0;background:rgba(20,32,45,.45);display:flex;align-items:center;justify-content:center;z-index:200}
  #modal[hidden]{display:none}
  .mbox{background:#fff;border-radius:8px;box-shadow:0 12px 40px rgba(0,0,0,.3);width:580px;max-width:92vw;max-height:88vh;display:flex;flex-direction:column}
  .mbox h3{margin:0;padding:14px 18px;font-size:15px;border-bottom:1px solid var(--line);color:var(--accent)}
  #mBody{padding:14px 18px;overflow:auto}
  .mfoot{padding:12px 18px;border-top:1px solid var(--line);display:flex;justify-content:flex-end;gap:8px}
  #mBody .field label{width:150px}
  #mBody select{flex:1;font:inherit;padding:5px 8px;border:1px solid var(--line);border-radius:3px;background:#fff}
  .note{padding:8px 11px;background:#f5f9ff;border:1px dashed #b9d0e8;border-radius:4px;font-size:12px;color:#44586e;margin-bottom:12px;line-height:1.7}

  /* ---------- 宝可梦台词面板 ---------- */
  .pk-h{margin:18px 0 6px;font-size:13px;color:#123f70;border-bottom:1px solid var(--line);padding-bottom:4px}
  .pk-sub{color:#9db0c4;font-size:11px;font-weight:normal;margin-left:6px}
  .pk-in{width:100%;font:inherit;font-size:12.5px;padding:4px 7px;border:1px solid var(--line);border-radius:3px;background:#fff}
  .pk-in:focus{outline:none;border-color:var(--accent);box-shadow:0 0 0 2px #dcebfa}
  .pk-n{text-align:center;color:#9db0c4;font-family:Consolas,monospace;font-size:11px}
  .pk-n.bad{color:#c5221f;font-weight:bold}
  .pk-add{background:#fafcff}
  .pk-add button{padding:2px 8px;font-size:12px}
  .pk-log{margin-top:12px;padding:10px;background:#f7f9fc;border:1px solid var(--line);border-radius:4px;
    font-family:Consolas,monospace;font-size:11.5px;line-height:1.6;white-space:pre-wrap;max-height:240px;overflow:auto}

  /* ---------- 拖拽上传 ---------- */
  #editor.dragover{background:#eef7ff;box-shadow:inset 0 0 0 3px #7fb8f0}
  .row.create{color:var(--accent);font-weight:bold}
  .row.create:hover{background:#e3f0ff}

  /* ---------- 工具栏的格式按钮 ---------- */
  .grp-label{color:var(--dim);font-size:12px;white-space:nowrap;display:inline-flex;align-items:center;gap:5px}
  #toolbar .sep{width:1px;height:18px;background:var(--line);margin:0 2px}
  #toolbar button.fmt{padding:3px 9px;line-height:1.4}
  #toolbar button.fmt.on{background:#dcebfa;border-color:var(--accent);color:var(--accent)}
  #imgWidthSel{font:inherit;padding:3px 6px;border:1px solid var(--line);border-radius:4px;background:#fff}

  /* ---------- 像素图标 ----------
     HackerNoon Pixel Icon Library，画在 24x24 的网格上，1 个单位 = 1 个像素。
     跟站里的点阵字体是同一条规矩：
         图标(CSS px) x devicePixelRatio = 24 的整数倍
     所以大小由 <body> 前面那段脚本按 DPR 算好写进 --ico，别在这里写死。
     实测：100% 缩放 -> 24px，150% -> 16px（你屏幕就是这个），200% -> 24px。 */
  .ico{
    width:var(--ico,20px);height:var(--ico,20px);flex:none;
    fill:currentColor;shape-rendering:crispEdges;vertical-align:-.18em;
  }
  button .ico,.row .ico{margin-right:2px}
  button:has(.ico){display:inline-flex;align-items:center;gap:5px}
  .row .ico{opacity:.85}
  .row.active .ico,.row.create .ico{opacity:1}

  #toast{
    position:fixed;left:50%;bottom:24px;transform:translateX(-50%);
    background:#22303f;color:#fff;padding:9px 18px;border-radius:5px;opacity:0;pointer-events:none;
    transition:opacity .2s, transform .2s;z-index:99;max-width:70vw;
  }
  #toast.show{opacity:1;transform:translateX(-50%) translateY(-6px)}
  #toast.err{background:#a3352b}
  #toast.ok{background:#1e7a3c}
  code{background:#eef2f7;padding:1px 5px;border-radius:3px;font-size:12px}
</style>
</head>
<body>

<script>
  /* 像素图标的整倍缩放：图标(CSS px) x DPR 必须等于 24 的整数倍，
     否则 24x24 的像素格子会被摊到半个设备像素上，边缘立刻发毛。
     算法跟站点里点阵字体那段一样：取让图标落在 15~26px 之间的那个倍数。
       100% 缩放 -> 24px    150% -> 16px    200% -> 24px
     拿不到合适倍数（极端缩放）就用 CSS 里的兜底值。 */
  (function () {
    var GRID = 24, MIN = 15, MAX = 26, TARGET = 17;
    var dpr = window.devicePixelRatio || 1;
    var k = 0, best = 1e9;
    for (var i = 1; i <= 8; i++) {
      var px = GRID * i / dpr;
      if (px < MIN || px > MAX) continue;
      var e = Math.abs(px - TARGET);
      if (e < best - 0.001) { best = e; k = i; }
    }
    if (!k) return;
    document.documentElement.style.setProperty('--ico', (GRID * k / dpr).toFixed(5) + 'px');
  })();
</script>

<div id="toast"></div>

<script>
const TOKEN = "__TOKEN__";
let TREE = [], CUR = null, DIRTY = false;

/* ---------- 小工具 ---------- */
const $ = (s) => document.querySelector(s);
const esc = (s) => String(s).replace(/[&<>"]/g, (c) => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
/** 内联引用 sprite 里的像素图标（见文件顶部那个 <svg id="sprite">） */
const ico = (name) => '<svg class="ico" aria-hidden="true"><use href="#ico-' + name + '"/></svg>';

function toast(msg, kind) {
  const t = $('#toast');
  t.textContent = msg;
  t.className = 'show ' + (kind || '');
  clearTimeout(t._h);
  t._h = setTimeout(() => { t.className = ''; }, kind === 'err' ? 6000 : 2800);
}

async function api(path, opts) {
  const res = await fetch(path, Object.assign({
    headers: { 'X-Editor-Token': TOKEN, 'Content-Type': 'application/json' },
  }, opts));
  const data = await res.json().catch(() => ({}));
  if (!res.ok) throw new Error(data.error || ('HTTP ' + res.status));
  return data;
}
const apiGet = (p) => api(p);
const apiPost = (p, body) => api(p, { method: 'POST', body: JSON.stringify(body || {}) });

function setDirty(v) {
  DIRTY = v;
  $('#dirtyFlag').hidden = !v;
  $('#btnSave').disabled = !v;
}
window.addEventListener('beforeunload', (e) => { if (DIRTY) { e.preventDefault(); e.returnValue = ''; } });

/* ---------- 侧栏 ---------- */
function shortName(p) {
  const b = p.split('/').pop().replace(/\.md$/, '');
  return b;
}

function renderTree() {
  const el = $('#tree');
  let h = '';
  h += '<div class="row create" data-act="new">' + ico('plus') + '新建页面</div>';
  h += '<div class="grp">工具</div>';
  h += '<div class="row tool" data-panel="settings">' + ico('cog') + '站点设置</div>';
  h += '<div class="row tool" data-panel="links">' + ico('link') + '友情链接</div>';
  h += '<div class="row tool" data-panel="buttons">' + ico('grid') + '小按钮</div>';
  h += '<div class="row tool" data-panel="updates">' + ico('refresh') + '更新日志</div>';
  h += '<div class="row tool" data-panel="notices">' + ico('comment-quote') + '公告栏</div>';
  h += '<div class="row tool" data-panel="pkmn">' + ico('message-dots') + '宝可梦台词</div>';
  h += '<div class="row tool" data-panel="sidebar">' + ico('pencil-ruler') + '侧栏排序</div>';
  h += '<div class="row tool" data-panel="scripts">' + ico('code') + '脚本管理</div>';
  h += '<div class="row tool" data-panel="nav">' + ico('calendar-alt') + '日记日历</div>';
  for (const g of TREE) {
    if (!g.files.length) continue;
    h += `<div class="grp">${esc(g.group)}</div>`;
    for (const f of g.files) {
      // data-group 是拖动排序用的（只允许同组内换位置）；草稿组不参与，不给拖
      const drag = g.draft ? '' : ' draggable="true"';
      const tip = esc(f) + (g.draft ? '' : '（按住可以拖动排序）');
      h += `<div class="row" data-file="${esc(f)}" data-group="${esc(g.group)}"${drag}`
        + ` title="${tip}">${esc(shortName(f))}</div>`;
    }
  }
  el.innerHTML = h;
}

/* ---------- 侧栏拖动排序 ---------- */
let DRAG = null;

function clearDropMarks() {
  document.querySelectorAll('#tree .drop-before,#tree .drop-after')
    .forEach((r) => r.classList.remove('drop-before', 'drop-after'));
}

/** 把当前 DOM 里这一组的顺序存到服务端 */
async function saveTreeOrder(group) {
  const files = [...document.querySelectorAll('#tree .row[data-file]')]
    .filter((r) => r.dataset.group === group)
    .map((r) => r.dataset.file);
  try {
    await apiPost('/api/order', { group, files });
    toast(`「${group}」的顺序已保存`, 'ok');
  } catch (e) { toast('顺序保存失败: ' + e.message, 'err'); }
}

$('#tree').addEventListener('dragstart', (e) => {
  const row = e.target.closest('.row[data-file][draggable="true"]');
  if (!row) { e.preventDefault(); return; }
  DRAG = { el: row, group: row.dataset.group, file: row.dataset.file };
  row.classList.add('dragging');
  e.dataTransfer.effectAllowed = 'move';
  // Firefox 不调 setData 就不会真的开始拖
  try { e.dataTransfer.setData('text/plain', row.dataset.file); } catch (err) { /* 忽略 */ }
});

$('#tree').addEventListener('dragover', (e) => {
  if (!DRAG) return;
  const row = e.target.closest('.row[data-file]');
  // 只允许同一组内换位置（分组是按目录定死的，跨组没有意义）
  if (!row || row.dataset.group !== DRAG.group || row === DRAG.el) { clearDropMarks(); return; }
  e.preventDefault();
  e.dataTransfer.dropEffect = 'move';
  const r = row.getBoundingClientRect();
  const after = e.clientY > r.top + r.height / 2;
  clearDropMarks();
  row.classList.add(after ? 'drop-after' : 'drop-before');
});

$('#tree').addEventListener('drop', async (e) => {
  if (!DRAG) return;
  const row = e.target.closest('.row[data-file]');
  if (!row || row.dataset.group !== DRAG.group || row === DRAG.el) { clearDropMarks(); return; }
  e.preventDefault();
  const after = row.classList.contains('drop-after');
  row.parentNode.insertBefore(DRAG.el, after ? row.nextSibling : row);
  clearDropMarks();
  const g = DRAG.group;
  DRAG = null;
  await saveTreeOrder(g);
});

$('#tree').addEventListener('dragend', () => {
  if (DRAG) DRAG.el.classList.remove('dragging');
  DRAG = null;
  clearDropMarks();
});

function markActive(sel) {
  document.querySelectorAll('.row').forEach((r) => r.classList.remove('active'));
  if (sel) sel.classList.add('active');
}

document.addEventListener('click', async (e) => {
  const row = e.target.closest('.row');
  if (!row) return;

  if (row.dataset.act === 'new') { newPage(); return; }

  if (row.dataset.panel) {
    markActive(row);
    CUR = null;
    $('#curPath').textContent = '工具 / ' + row.textContent.trim();
    $('#btnDelete').disabled = true;
    $('#btnToggleDraft').hidden = true;
    $('#btnInsertDay').hidden = true;
    setDirty(false);
    document.body.classList.add('panel');
    location.hash = row.dataset.panel;
    await openPanel(row.dataset.panel);
    return;
  }

  if (row.dataset.file) {
    if (DIRTY && !confirm('当前文件还没保存，确定要离开吗？')) return;
    markActive(row);
    document.body.classList.remove('panel');
    await openFile(row.dataset.file);
  }
});

/* ---------- 打开文件 ---------- */
async function openFile(p) {
  try {
    const d = await apiGet('/api/file?p=' + encodeURIComponent(p));
    CUR = p;
    $('#editor').value = d.text;
    $('#curPath').textContent = p;
    $('#btnDelete').disabled = false;
    const u = urlForFile(p);
    if (u) CUR_URL = u;
    $('#btnInsertDay').hidden = !/^content\/niki\/niki_\d{6}\.md$/.test(p);
    const showDraft = /\.md$/.test(p);
    $('#btnToggleDraft').hidden = !showDraft;
    if (showDraft) {
      const draft = isDraft(d.text);
      $('#btnDraftText').textContent = draft ? '草稿中 → 点此发布' : '设为草稿';
      $('#btnToggleDraft').style.background = draft ? '#fff3cd' : '';
      $('#btnToggleDraft').style.borderColor = draft ? '#e5c76b' : '';
    }
    setDirty(false);
    if (document.body.classList.contains('preview')) refreshPreview();
  } catch (e) { toast('打开失败: ' + e.message, 'err'); }
}

async function saveFile() {
  if (!CUR) return;
  try {
    await apiPost('/api/file', { p: CUR, text: $('#editor').value });
    setDirty(false);
    toast('已保存 ' + CUR, 'ok');
    if (document.body.classList.contains('preview')) refreshPreview();
  } catch (e) { toast('保存失败: ' + e.message, 'err'); }
}

$('#editor').addEventListener('input', () => setDirty(true));
$('#btnSave').addEventListener('click', saveFile);
document.addEventListener('keydown', (e) => {
  if ((e.ctrlKey || e.metaKey) && e.key.toLowerCase() === 's') { e.preventDefault(); saveFile(); }
});

$('#btnDelete').addEventListener('click', async () => {
  if (!CUR) return;
  if (!confirm(`确定删除 ${CUR} 吗？\n（会先挪到 .editor/trash/，可以手动找回）`)) return;
  try {
    await apiPost('/api/delete', { p: CUR });
    toast('已删除（可在 .editor/trash 找回）', 'ok');
    CUR = null; $('#editor').value = ''; $('#curPath').textContent = '← 从左边选一个文件';
    $('#btnDelete').disabled = true; setDirty(false);
    await bootstrap();
  } catch (e) { toast('删除失败: ' + e.message, 'err'); }
});

/* ---------- 预览 ---------- */
let PREVIEW_URL = 'http://127.0.0.1:1313/';  // 预览站根地址
let LIVE_URL = '';                           // 线上站地址
let CUR_URL = '/';                           // 正在预览的页面路径

/* 当前编辑的文件 -> 对应的页面地址 */
function urlForFile(p) {
  if (!p || !p.startsWith('content/') || !p.endsWith('.md')) return null;
  let rel = p.slice('content/'.length).replace(/\.md$/, '');
  if (rel === '_index') return '/';
  if (rel.endsWith('/_index')) rel = rel.slice(0, -'/_index'.length);
  return '/' + rel + '/';
}
function previewTarget() {
  return PREVIEW_URL.replace(/\/+$/, '') + (CUR_URL || '/');
}
function refreshPreview() {
  const path = CUR_URL || '/';
  $('#preview').src = previewTarget() + '?t=' + Date.now();
  $('#previewPath').textContent = path;
  $('#previewPath').title = previewTarget();
}
$('#btnPreview').addEventListener('click', async () => {
  const on = document.body.classList.toggle('preview');
  $('#btnPreviewText').textContent = on ? '预览 ▾' : '预览 ▸';
  if (!on) { $('#preview').src = 'about:blank'; return; }

  document.body.classList.remove('panel');
  $('#preview').src = 'about:blank';

  const s = await apiPost('/api/hugo', { action: 'status' });
  if (s.url) PREVIEW_URL = s.url;

  if (!s.running) {
    toast('正在启动预览服务器，第一次要几秒…');
    const r = await apiPost('/api/hugo', { action: 'start' });
    if (r.url) PREVIEW_URL = r.url;
    if (!r.ok) {
      const detail = (r.log || '').split('\n').filter((x) => x.trim()).slice(-5).join('\n');
      toast('预览启动失败：' + (r.note || '') + (detail ? '\n' + detail : ''), 'err');
      return;
    }
    toast('预览已就绪', 'ok');
  }
  refreshPreview();
});
$('#btnLive').addEventListener('click', () => {
  if (LIVE_URL) window.open(LIVE_URL, '_blank');
  else toast('读不到线上地址（hugo.toml 里的 baseURL）', 'err');
});
$('#btnPreviewRefresh').addEventListener('click', () => {
  if (document.body.classList.contains('preview')) refreshPreview();
  else $('#btnPreview').click();
});
$('#btnPreviewNew').addEventListener('click', () => window.open(previewTarget(), '_blank'));
$('#btnBuild').addEventListener('click', async () => {
  toast('正在构建…');
  const r = await apiPost('/api/hugo', { action: 'build' });

/* ---------- 发布 / 同步 ----------
   「发布」= 把本地的改动提交并推上去；「拉取线上」= 把另一台电脑推上来的改动拉下来。
   ⚠️ 推送失败（断网、或者另一台电脑推过了）之后，改动其实**已经提交在本地**了，
   工作区是干净的 —— 所以这里绝不能因为「没有未提交的改动」就早退，
   要看 ahead（比线上多几个提交）决定还能不能推。 */
function gitBad(r) {
  const bad = r.steps.find((s) => s.code !== 0);
  return bad ? (bad.out || '（没有输出）') : '';
}

async function syncPull(auto) {
  let g;
  try { g = await apiGet('/api/git'); } catch (e) { return false; }
  if (g.behind === null || g.behind === undefined) {
    if (!auto) toast('拿不到线上状态：可能没联网，或者没配好 git 远端', 'err');
    return false;
  }
  if (!g.behind) {
    if (!auto) toast('已经和线上一致了');
    return false;
  }
  if (g.status.length) {
    if (!auto) toast(`本地还有 ${g.status.length} 处没提交的改动，先发布（或者撤销）再拉取`, 'err');
    return false;
  }
  if (g.ahead) {
    if (!auto) toast(`本地有 ${g.ahead} 个提交还没推上去，先点「发布」再拉取`, 'err');
    return false;
  }
  toast(`正在从线上拉取 ${g.behind} 个提交…`);
  const r = await apiPost('/api/git', { action: 'pull' });
  if (r.ok) {
    toast(`已从线上同步 ${g.behind} 个提交`, 'ok');
    await bootstrap();
    if (CUR) loadFile(CUR).catch(() => {});
    return true;
  }
  toast('拉取失败：\n' + gitBad(r), 'err');
  return false;
}

$('#btnSync').addEventListener('click', () => syncPull(false));

$('#btnPublish').addEventListener('click', async () => {
  if (DIRTY) { toast('先保存当前文件再发布', 'err'); return; }
  const g = await apiGet('/api/git');
  const changed = g.status.length > 0;
  const ahead = g.ahead || 0;
  if (!changed && !ahead) {
    toast(g.behind
      ? `本地没有改动，但线上有 ${g.behind} 个提交（点「拉取线上」同步）`
      : '没有需要发布的改动');
    return;
  }
  let msg = '更新';
  if (changed) {
    const listing = g.status.map((s) => '  ' + s).join('\n');
    const m = prompt(`将要提交以下改动：\n\n${listing}\n\n写一句这次的更新说明：`, '更新');
    if (m === null) return;
    msg = m || '更新';
  } else {
    // 上次推送失败的常见情况：改动早就提交了，只是没推上去
    if (!confirm(`本地有 ${ahead} 个提交还没推上去（上次推送应该失败了），现在重推一次？`)) return;
    msg = '重试推送';
  }
  toast(changed ? '正在提交并推送…' : '正在推送…');
  const r = await apiPost('/api/git', { action: 'commitpush', message: msg });
  if (r.ok) {
    const n = r.state && r.state.ahead === 0 ? '' : '（本地还有提交没推上去，再看看日志）';
    toast('推送成功，GitHub 大约 1 分钟后更新线上' + n, 'ok');
    await bootstrap();
  } else {
    toast('发布失败：\n' + gitBad(r) +
      '\n\n改动已经在本地提交好了，修好网络 / 代理之后**再点一次发布**就会重推。', 'err');
  }
});

    order: d.order || null,

  };
  PK.loaded = JSON.stringify(pkmnPayload());
  paintPkmn();
}

/** 面板上的当前内容，拼成要发给服务端的形状（顺序按池子定义，空串丢掉） */
function pkmnPayload() {
  const strip = (o, keys) => {
    const out = {};
    for (const [k] of keys) {
      out[k] = (o[k] || []).map((s) => String(s).trim()).filter(Boolean);
    }
    return out;
  };
  return {
    name: PK.name, header: PK.header, order: PK.order,
    pools: strip(PK.pools, PK.groups.pools),
    page: strip(PK.page, PK.groups.page),
    weather: strip(PK.weather, PK.groups.weather),
  };
}

function pkmnTable(groupKey, title, hint, keys) {
  const arr = PK[groupKey];
  let h = `<h3 class="pk-h">${esc(title)}`;
  if (hint) h += ` <span class="pk-sub">${esc(hint)}</span>`;
  h += '</h3>';
  h += '<table class="grid"><thead><tr><th>说的话（一句一行，别用引号括号 emoji）</th>'
     + '<th style="width:56px">字数</th><th style="width:38px"></th></tr></thead><tbody>';
  (keys || []).forEach(([k, label, min]) => {
    const list = arr[k] || [];
    list.forEach((s, i) => {
      const n = [...String(s)].length;
      h += `<tr><td><input class="pk-in" data-g="${groupKey}" data-k="${esc(k)}" value="${esc(s)}"></td>`
         + `<td class="pk-n${n > 40 ? ' bad' : ''}">${n}</td>`
         + `<td style="text-align:center"><button class="danger" data-del="${groupKey}:${esc(k)}:${i}">×</button></td></tr>`;
    });
    h += `<tr><td colspan="3" class="pk-add"><span class="pk-sub">${esc(k)}`
       + `${min ? '（至少留 ' + min + ' 句）' : ''}</span> `
       + `<button data-add="${groupKey}:${esc(k)}">＋ 加一条</button></td></tr>`;
  });
  h += '</tbody></table>';
  return h;
}

function paintPkmn() {
  const it = PK.meta.items.find((x) => x.dex === PK.dex) || {};
  let h = '<h2 class="sec">宝可梦台词</h2>';
  h += `<div class="note">这里是侧栏「宝可梦放养区」里每只宝可梦说的话，一只一个文件
    （<code>data/pkmn-talk/${PK.dex}.toml</code>）。改完点最下面的<b>保存并生成</b> ——
    编辑器会顺手重新生成页面真正读取的 JSON，刷新预览页就能看到。<br>
    规矩：每句<b>不超过 40 个字</b>（对话框只有三行），不要用引号、书名号、括号，
    也不用写「${esc(PK.name)}：」这种前缀；同一只里面别出现重复的句子。<br>
    符号：<b>♪ ♫ ★ ☆ ♥ ■ □ ● ○ ← → ☀ ☁</b> 这些站里的点阵字体都有，随便用；
    字体里没有的（比如 ♡ ♩ ♬）保存时会红字拦下来 —— 它会掉到系统字体上、边缘发糊。</div>`;

  h += '<div class="field"><label>改哪一只</label><select id="pkSel">';
  for (const x of PK.meta.items) {
    h += `<option value="${x.dex}"${x.dex === PK.dex ? ' selected' : ''}>`
       + `${esc(x.name)}（${x.dex}·${x.sleep === 'day' ? '白天睡' : '夜里睡'}）</option>`;
  }
  h += `</select><span class="cmt">${it.total != null ? '现在共 ' + it.total + ' 句' : ''}</span></div>`;

  h += pkmnTable('pools', '它自己的话', '（按什么时候说分）', PK.groups.pools);
  h += pkmnTable('page', '看着某一页时说的', '（它正在陪你看这一页）', PK.groups.page);
  h += pkmnTable('weather', '外面什么天气时说的', '（按访客当地天气）', PK.groups.weather);

  h += '<div style="margin-top:18px"><button class="primary" id="btnSavePkmn">保存并生成</button> '
     + `<span class="cmt">${PK.meta.pythonOk ? '（保存后会自动重跑生成脚本）' : '⚠ 没找到 python：保存后不会重新生成 JSON'}</span></div>`;
  h += '<pre id="pkLog" class="pk-log" hidden></pre>';
  showPanel(h);
  bindPkmn();
}

function bindPkmn() {
  const collect = () => {
    const out = { pools: {}, page: {}, weather: {} };
    document.querySelectorAll('#panel input[data-g]').forEach((el) => {
      const g = el.dataset.g, k = el.dataset.k;
      if (!out[g][k]) out[g][k] = [];
      out[g][k].push(el.value);
    });
    PK.pools = out.pools; PK.page = out.page; PK.weather = out.weather;
  };
  document.querySelectorAll('#panel .pk-in').forEach((el) => el.addEventListener('input', () => {
    const td = el.closest('tr').querySelector('.pk-n');
    const n = [...el.value].length;
    td.textContent = n;
    td.classList.toggle('bad', n > 40);
  }));
  document.querySelectorAll('#panel [data-del]').forEach((b) => b.addEventListener('click', () => {
    collect();
    const [g, k, i] = b.dataset.del.split(':');
    PK[g][k].splice(+i, 1);
    paintPkmn();
  }));
  document.querySelectorAll('#panel [data-add]').forEach((b) => b.addEventListener('click', () => {
    collect();
    const [g, k] = b.dataset.add.split(':');
    (PK[g][k] = PK[g][k] || []).push('');
    paintPkmn();
    const rows = document.querySelectorAll(`#panel input[data-k="${CSS.escape(k)}"]`);
    const last = rows[rows.length - 1];
    if (last) last.focus();
  }));
  $('#pkSel').addEventListener('change', async (e) => {
    collect();
    if (JSON.stringify(pkmnPayload()) !== PK.loaded &&
        !confirm('这一只还有没保存的改动，换过去就丢了。要继续吗？')) {
      e.target.value = String(PK.dex);
      return;
    }
    PK.dex = Number(e.target.value);
    const d = await apiGet('/api/pkmn/' + PK.dex);
    PK.name = d.name || (PK.meta.items.find((x) => x.dex === PK.dex) || {}).name || String(PK.dex);
    PK.header = d.header;
    PK.order = d.order || null;
    PK.pools = d.pools || {}; PK.page = d.page || {}; PK.weather = d.weather || {};
    PK.loaded = JSON.stringify(pkmnPayload());
    paintPkmn();
  });
  $('#btnSavePkmn').addEventListener('click', async () => {
    collect();
    const payload = pkmnPayload();
    const btn = $('#btnSavePkmn');
    btn.disabled = true;
    btn.textContent = '正在生成…';
    try {
      const r = await apiPost('/api/pkmn/' + PK.dex, payload);
      const log = $('#pkLog');
      log.hidden = false;
      log.textContent = (r.ok ? '✓ 已保存，并重新生成了页面用的 JSON\n\n'
                              : '✗ 文件存下了，但生成时报错（页面上的台词还是旧的那份）\n\n') + (r.log || '');
      log.style.color = r.ok ? '#1e8e3e' : '#c5221f';
      toast(r.ok ? '台词已保存并生成' : '保存了，但生成失败 —— 看面板下面的报错', r.ok ? 'ok' : 'err');
      const d = await apiGet('/api/pkmn/' + PK.dex);
      PK.pools = d.pools || {}; PK.page = d.page || {}; PK.weather = d.weather || {};
      PK.loaded = JSON.stringify(pkmnPayload());
    } finally {
      btn.disabled = false;
      btn.textContent = '保存并生成';
    }
  });
}

/* --- 侧栏排序（拖动改挂件顺序，存到 data/sidebar.toml） --- */
async function renderSidebar() {
  const d = await apiGet('/api/sidebar');
  const label = {};
  d.widgets.forEach((w) => { label[w.key] = w.label; });
  const items = d.order.slice();

  let h = '<h2 class="sec">侧栏排序</h2>';
  h += '<p class="hint">右侧「侧边栏」里那些挂件的上下顺序。<b>按住一行拖动</b>即可，松手就保存到 <code>data/sidebar.toml</code>。</p>';
  h += '<div class="note">挂件本身的开关不在这一页 —— 访客统计 / 时钟 / 一言 / 更新日志 的开关在「站点设置」里，' +
       '友情链接和小按钮的内容在各自的面板里。</div>';
  h += '<ul id="sideOrder">';
  items.forEach((k) => {
    h += `<li draggable="true" data-key="${esc(k)}"><span class="handle">≡</span><span class="name">${esc(label[k] || k)}</span><code>${esc(k)}</code></li>`;
  });
  h += '</ul>';
  h += '<p class="hint">没列进去的挂件（比如以后新加的）会自动排在最后。</p>';
  showPanel(h);

  const ul = $('#sideOrder');
  let drag = null;
  ul.addEventListener('dragstart', (e) => {
    const li = e.target.closest('li[data-key]');
    if (!li) { e.preventDefault(); return; }
    drag = li;
    li.classList.add('dragging');
    e.dataTransfer.effectAllowed = 'move';
    try { e.dataTransfer.setData('text/plain', li.dataset.key); } catch (err) { /* 忽略 */ }
  });
  ul.addEventListener('dragover', (e) => {
    if (!drag) return;
    const li = e.target.closest('li[data-key]');
    if (!li || li === drag) return;
    e.preventDefault();
    const r = li.getBoundingClientRect();
    const after = e.clientY > r.top + r.height / 2;
    li.parentNode.insertBefore(drag, after ? li.nextSibling : li);
  });
  ul.addEventListener('drop', (e) => { if (drag) e.preventDefault(); });
  ul.addEventListener('dragend', async () => {
    if (!drag) return;
    drag.classList.remove('dragging');
    drag = null;
    const order = [...ul.querySelectorAll('li[data-key]')].map((li) => li.dataset.key);
    try {
      await apiPost('/api/sidebar', { order });
      toast('侧栏顺序已保存', 'ok');
    } catch (err) { toast('保存失败：' + err.message, 'err'); }
  });
}

/* ---------- 图片：拖拽 / 选择 / 粘贴 ---------- */
function isDraft(text) {
  const m = text.match(/^---\r?\n([\s\S]*?)\r?\n---/);
  return !!(m && /^draft:\s*true\s*$/m.test(m[1]));
}

function insertText(text) {
  const ta = $('#editor');
  if (ta.selectionStart === undefined) { ta.value += text; }
  else {
    const s = ta.selectionStart, e = ta.selectionEnd;
    ta.value = ta.value.slice(0, s) + text + ta.value.slice(e);
    ta.selectionStart = ta.selectionEnd = s + text.length;
  }
  ta.focus();
  setDirty(true);
}

/** 替换编辑区里 [s,e) 这一段，顺便把选区设成 [ss,se) */
function replaceRange(s, e, text, ss, se) {
  const ta = $('#editor');
  ta.value = ta.value.slice(0, s) + text + ta.value.slice(e);
  ta.focus();
  if (ss !== undefined) ta.setSelectionRange(ss, se === undefined ? ss : se);
  setDirty(true);
  updateFmtButtons();
}

/* ---------- 选中文字套格式（加粗 / 倾斜 / 心声） ----------
   正文里必须写标签：这些页面的正文是整段原生 HTML，Markdown 的
   **粗体** / *斜体* 在 HTML 块里不会被解析，只会原样显示成星号。 */
const FMT = {
  bold: { open: '<strong>', close: '</strong>' },
  italic: { open: '<i>', close: '</i>' },
  voice: { open: '<span class="inner-voice">', close: '</span>' },
};

function fmtRange(key) {
  const { open, close } = FMT[key];
  const ta = $('#editor');
  const s = ta.selectionStart, e = ta.selectionEnd;
  const v = ta.value;
  const sel = v.slice(s, e);
  // ① 选中的就是整对标签：<strong>x</strong> → 拆掉
  if (sel.length > open.length + close.length
      && sel.slice(0, open.length) === open && sel.slice(-close.length) === close) {
    const inner = sel.slice(open.length, sel.length - close.length);
    replaceRange(s, e, inner, s, s + inner.length);
    return;
  }
  // ② 标签紧贴在选区外侧：<strong>|x|</strong> → 拆掉
  if (s >= open.length && e + close.length <= v.length
      && v.slice(s - open.length, s) === open && v.slice(e, e + close.length) === close) {
    replaceRange(s - open.length, e + close.length, sel, s - open.length, e - open.length);
    return;
  }
  // ③ 其它情况：套上去。没选中就插一对空标签，光标停在中间
  replaceRange(s, e, open + sel + close, s + open.length, s + open.length + sel.length);
}

/** 光标正处在这对标签里时，把工具栏按钮点亮 */
function updateFmtButtons() {
  const ta = $('#editor');
  if (!ta || ta.selectionStart === undefined) return;
  const s = ta.selectionStart, e = ta.selectionEnd, v = ta.value;
  for (const [key, sel] of [['bold', '#btnBold'], ['italic', '#btnItalic'], ['voice', '#btnVoice']]) {
    const { open, close } = FMT[key];
    const on = (s >= open.length && v.slice(s - open.length, s) === open
                && v.slice(e, e + close.length) === close)
            || (v.slice(s, s + open.length) === open
                && v.slice(Math.max(s, e - close.length), e) === close);
    const btn = $(sel);
    if (btn) btn.classList.toggle('on', on);
  }
}

for (const [id, key] of [['#btnBold', 'bold'], ['#btnItalic', 'italic'], ['#btnVoice', 'voice']]) {
  $(id).addEventListener('click', () => {
    if (!CUR) { toast('先从左边选一个文件', 'err'); return; }
    fmtRange(key);
  });
}

['keyup', 'mouseup', 'click', 'select', 'input'].forEach((ev) =>
  $('#editor').addEventListener(ev, updateFmtButtons));

$('#editor').addEventListener('keydown', (e) => {
  if (!(e.ctrlKey || e.metaKey) || e.altKey) return;
  const k = e.key.toLowerCase();
  if (k === 'b') { e.preventDefault(); fmtRange('bold'); }
  else if (k === 'i') { e.preventDefault(); fmtRange('italic'); }
});

async function uploadImages(files) {
  const imgs = [...files].filter((f) => /^image\//.test(f.type));
  if (!imgs.length) { if (files.length) toast('只能上传图片文件', 'err'); return; }
  toast(`正在上传 ${imgs.length} 张图片…`);
  const w = imgWidthValue();
  let out = '';
  try {
    for (const f of imgs) {
      const data = await new Promise((res, rej) => {
        const r = new FileReader();
        r.onload = () => res(r.result);
        r.onerror = rej;
        r.readAsDataURL(f);
      });
      const r = await apiPost('/api/upload', { name: f.name, data });
      out += makeImg(r.url, f.name.replace(/\.[^.]+$/, ''), w) + '\n';
    }
    insertText(out);
    const wtxt = w ? `，宽度 ${w}${/%$/.test(w) ? '' : 'px'}` : '，原尺寸';
    toast(`已存入 static/images/，并在光标处插入 ${imgs.length} 个 <img>${wtxt}`, 'ok');
  } catch (e) { toast('上传失败: ' + e.message, 'err'); }
}

/* ---------- 图片宽度 ----------
   站点里的写法：整数用 width="300"，百分比只能用 style="width:100%"
   （HTML 的 width 属性不接受 "100%" 这种值，写了会被浏览器直接忽略，
   之前迁移过来的图里就有 width="500px" / width=30% 这种没生效的）。
   宽度存在 localStorage，插图时自动带上。 */
function imgWidthValue() {
  const v = $('#imgWidthSel').value;
  if (v === 'custom') return localStorage.getItem('editor.imgWidth.custom') || '';
  return v;
}

function makeImg(url, alt, w) {
  const attrs = [`src="${url}"`, `alt="${alt}"`];
  if (w) attrs.push(/%$/.test(w) ? `style="width:${w}"` : `width="${w}"`);
  attrs.push('loading="lazy"');
  return `<img ${attrs.join(' ')} />`;
}

/** 改一个 <img> 标签上的宽度：两种写法都先清掉，再按需要写回去 */
function setImgWidth(tag, w) {
  let style = '';
  let t = tag.replace(/\s+style\s*=\s*(?:"([^"]*)"|'([^']*)')/gi, (m, a, b) => {
    style = a !== undefined ? a : (b || '');
    return '';
  });
  t = t.replace(/\s+width\s*=\s*(?:"[^"]*"|'[^']*'|[^\s>]+)/gi, '');
  const props = style.split(';').map((s) => s.trim()).filter((s) => s && !/^width\s*:/i.test(s));
  if (w && /%$/.test(w)) props.push(`width:${w}`);
  const extra = [];
  if (props.length) extra.push(`style="${props.join('; ')}"`);
  if (w && !/%$/.test(w)) extra.push(`width="${w}"`);
  const selfClose = /\/>\s*$/.test(t);
  t = t.replace(/\s*\/?>\s*$/, '');
  return t + (extra.length ? ' ' + extra.join(' ') : '') + (selfClose ? ' />' : '>');
}

/** 把当前宽度应用到选中的 <img>（可以一次选好几个） */
function applyWidthToSelection() {
  const ta = $('#editor');
  const s = ta.selectionStart, e = ta.selectionEnd;
  if (s === e) { toast('先在编辑区里选中包含 <img> 的一段文字', 'err'); return; }
  const sel = ta.value.slice(s, e);
  if (!/<img\b/i.test(sel)) { toast('选中的这段里没有 <img>', 'err'); return; }
  const w = imgWidthValue();
  let n = 0;
  const out = sel.replace(/<img\b[^>]*>/gi, (tag) => { n++; return setImgWidth(tag, w); });
  replaceRange(s, e, out, s, s + out.length);
  toast(`改了 ${n} 张图的宽度 → ${w ? w + (/%$/.test(w) ? '' : 'px') : '原尺寸'}`, 'ok');
}

$('#imgWidthSel').addEventListener('change', () => {
  if ($('#imgWidthSel').value !== 'custom') { localStorage.setItem('editor.imgWidth', $('#imgWidthSel').value); return; }
  const v = (prompt('想要多宽？填数字（像素），或者带 % 的百分比，比如 300 / 60%', '300') || '').trim();
  if (!/^\d+%?$/.test(v)) {
    toast('没填对，宽度得是数字或百分比', 'err');
    $('#imgWidthSel').value = localStorage.getItem('editor.imgWidth') || '';
    return;
  }
  localStorage.setItem('editor.imgWidth.custom', v);
  localStorage.setItem('editor.imgWidth', 'custom');
  const sel = $('#imgWidthSel');
  let op = sel.querySelector('option[data-custom]');
  if (!op) {
    op = document.createElement('option');
    op.dataset.custom = '1';
    sel.insertBefore(op, sel.querySelector('option[value="custom"]'));
  }
  op.value = v;
  op.textContent = `自定义 ${v}`;
  sel.value = v;
});

$('#btnApplyWidth').addEventListener('click', applyWidthToSelection);

$('#btnInsertImg').addEventListener('click', () => $('#filePicker').click());
$('#filePicker').addEventListener('change', (e) => { uploadImages(e.target.files); e.target.value = ''; });

['dragenter', 'dragover'].forEach((ev) => $('#editor').addEventListener(ev, (e) => {
  if (e.dataTransfer && [...e.dataTransfer.types].includes('Files')) {
    e.preventDefault();
    $('#editor').classList.add('dragover');
  }
}));
['dragleave', 'drop'].forEach((ev) => $('#editor').addEventListener(ev, (e) => {
  e.preventDefault();
  $('#editor').classList.remove('dragover');
}));
$('#editor').addEventListener('drop', (e) => {
  const files = [...((e.dataTransfer && e.dataTransfer.files) || [])];
  if (files.length) uploadImages(files);
});
$('#editor').addEventListener('paste', (e) => {
  const files = [...((e.clipboardData && e.clipboardData.files) || [])];
  if (files.length) { e.preventDefault(); uploadImages(files); }
});

/* ---------- 插入日期锚点（日记专用） ---------- */
$('#btnInsertDay').addEventListener('click', () => {
  const m = CUR && CUR.match(/niki_(\d{4})(\d{2})\.md$/);
  if (!m) return;
  const mm = m[2], mi = parseInt(mm, 10);
  const day = prompt(`插入 ${mi} 月的哪一天？（1-31）`, String(new Date().getDate()));
  if (!day) return;
  const n = parseInt(day, 10);
  if (!(n >= 1 && n <= 31)) { toast('日期不对', 'err'); return; }
  const dd = String(n).padStart(2, '0');
  insertText(`\n<h2><span id="${mm}${dd}">${mi}月 ${n}日</span></h2>\n\n`);
  toast('锚点已插入。写完保存就行，日记页和导航页的日历会自动多出这一天', 'ok');
});

/* ---------- 草稿开关 ---------- */
$('#btnToggleDraft').addEventListener('click', async () => {
  if (!CUR) return;
  const now = isDraft($('#editor').value);
  try {
    await apiPost('/api/draft', { p: CUR, draft: !now });
    await openFile(CUR);
    await bootstrap();
    toast(now ? '已发布，不再是草稿' : '已设为草稿，不会出现在线上站', 'ok');
  } catch (e) { toast('操作失败: ' + e.message, 'err'); }
});

/* ---------- 通用弹窗 ---------- */
function modal({ title, fields, okText = '确定', bind }) {
  return new Promise((resolve) => {
    $('#mTitle').textContent = title;
    $('#mBody').innerHTML = fields.map((f) => {
      const id = 'mf_' + f.key;
      if (f.type === 'checkbox') {
        return `<div class="field"><label>${esc(f.label)}</label>
          <input type="checkbox" id="${id}" ${f.value ? 'checked' : ''}>
          <span class="cmt">${esc(f.hint || '')}</span></div>`;
      }
      if (f.type === 'select') {
        return `<div class="field"><label>${esc(f.label)}</label>
          <select id="${id}">${f.options.map((o) =>
            `<option value="${esc(o.v)}"${o.v === f.value ? ' selected' : ''}>${esc(o.t)}</option>`).join('')}</select></div>`;
      }
      return `<div class="field"><label>${esc(f.label)}</label>
        <input type="text" id="${id}" value="${esc(f.value ?? '')}" placeholder="${esc(f.ph || '')}">
        <span class="cmt">${esc(f.hint || '')}</span></div>`;
    }).join('');
    $('#mOk').textContent = okText;
    $('#modal').hidden = false;
    if (bind) { try { bind(); } catch (e) { console.warn(e); } }

    const done = (v) => { $('#modal').hidden = true; resolve(v); };
    $('#mCancel').onclick = () => done(null);
    $('#mOk').onclick = () => {
      const out = {};
      for (const f of fields) {
        const el = document.getElementById('mf_' + f.key);
        out[f.key] = f.type === 'checkbox' ? el.checked : el.value.trim();
      }
      done(out);
    };
    $('#modal').onkeydown = (e) => {
      if (e.key === 'Escape') done(null);
      if (e.key === 'Enter' && e.target.tagName === 'INPUT') $('#mOk').click();
    };
    const first = $('#mBody input[type=text]');
    if (first) { first.focus(); first.select(); }
  });
}

/* ---------- 新建页面 ---------- */
function defaultNameTitle(kind) {
  const now = new Date();
  if (kind === 'niki') {
    const y = now.getFullYear(), m = now.getMonth() + 1;
    return { name: `niki_${y}${String(m).padStart(2, '0')}`, title: `${y}年${m}月日记` };
  }
  if (kind === 'blog') return { name: 'new-post', title: '新文章' };
  return { name: 'new-page', title: '新页面' };
}

async function newPage() {
  const d0 = defaultNameTitle('niki');
  const res = await modal({
    title: '新建页面',
    okText: '创建',
    // 换类型时把文件名/标题的默认值也跟着换（不然选了「博客」还留着 niki_202609）
    bind() {
      const sel = $('#mf_kind');
      if (!sel) return;
      sel.addEventListener('change', () => {
        const d = defaultNameTitle(sel.value);
        $('#mf_name').value = d.name;
        $('#mf_title').value = d.title;
      });
    },
    fields: [
      { key: 'kind', type: 'select', label: '类型', value: 'niki', options: [
        { v: 'niki', t: '日记（挂到导航页，不进博客列表）' },
        { v: 'blog', t: '博客文章' },
        { v: 'page', t: '独立单页' },
      ] },
      { key: 'name', type: 'text', label: '文件名', value: d0.name, hint: '英文/数字/下划线，不用写 .md' },
      { key: 'title', type: 'text', label: '标题', value: d0.title },
      { key: 'date', type: 'text', label: '日期', value: new Date().toISOString().slice(0, 10), hint: 'YYYY-MM-DD' },
      { key: 'asDraft', type: 'checkbox', label: '先存为草稿', value: true, hint: '写完在工具栏一键发布' },
    ],
  });
  if (!res) return;
  try {
    const r = await apiPost('/api/new', res);
    await bootstrap();
    document.body.classList.remove('panel');
    markActive(null);
    await openFile(r.p);
    let msg = '已创建 ' + r.p + (res.asDraft ? '（草稿）' : '');
    if (res.kind === 'niki') msg += '，日历会自动收录';
    toast(msg, 'ok');
  } catch (e) { toast('创建失败: ' + e.message, 'err'); }
}

/* ---------- 启动 ---------- */
let BOOTED = false;
const PANELS = ['settings', 'links', 'buttons', 'scripts', 'nav', 'pkmn'];

/** 恢复上次用的图片宽度、给顶栏的新建按钮接线 */
function initToolbar() {
  // macOS 上快捷键是 ⌘ 不是 Ctrl，按钮提示跟着换（代码里两种都认）
  const isMac = /Mac|iPhone|iPad|iPod/.test(navigator.platform || navigator.userAgent || '');
  if (isMac) {
    const mod = '⌘';
    $('#btnSave').title = mod + 'S';
    $('#btnBold').title = '加粗（' + mod + 'B）';
    $('#btnItalic').title = '倾斜（' + mod + 'I）';
  }

  const saved = localStorage.getItem('editor.imgWidth') || '';
  const sel = $('#imgWidthSel');
  if (saved && saved !== 'custom' && /^\d+%$/.test(saved)) {
    const op = document.createElement('option');
    op.dataset.custom = '1';
    op.value = saved;
    op.textContent = `自定义 ${saved}`;
    sel.insertBefore(op, sel.querySelector('option[value="custom"]'));
  }
  if (saved && [...sel.options].some((o) => o.value === saved)) sel.value = saved;
  $('#btnNewTop').addEventListener('click', () => newPage());
}

async function bootstrap() {
  const d = await apiGet('/api/bootstrap');
  TREE = d.tree;
  PREVIEW_URL = d.previewUrl;
  LIVE_URL = d.liveUrl || '';
  renderTree();
  if (CUR) {
    const r = document.querySelector(`.row[data-file="${CSS.escape(CUR)}"]`);
    if (r) r.classList.add('active');
  }
  // 首次打开时按地址栏的 #锚点 直达：
  //   #settings / #links / #buttons / #scripts / #nav   打开工具面板
  //   #preview                                          进预览模式
  //   #f=content/niki/niki_202602.md&preview             打开某个文件并预览它
  if (!BOOTED) {
    BOOTED = true;
    const raw = decodeURIComponent(location.hash.replace(/^#/, ''));
    if (raw.startsWith('f=')) {
      const hp = new URLSearchParams(raw);
      const file = hp.get('f');
      const row = file && document.querySelector(`.row[data-file="${CSS.escape(file)}"]`);
      if (row) row.click();
      if (hp.has('preview')) setTimeout(() => { if (!document.body.classList.contains('preview')) $('#btnPreview').click(); }, 500);
    } else if (PANELS.includes(raw)) {
      const row = document.querySelector(`.row[data-panel="${raw}"]`);
      if (row) row.click();
    } else if (raw === 'preview') {
      $('#btnPreview').click();
    }
  }
}
initToolbar();
bootstrap().catch((e) => toast('初始化失败: ' + e.message, 'err'));

/* 开机先跟线上对一次账：
   · 本机干净、也没欠着没推的提交 → 自动把线上的改动拉下来（换电脑编辑就不用管了）
   · 有本地提交没推上去 → 提示一句（多半是上次推送失败）
   · 有没提交的改动 → 不动，交给「发布」 */
async function checkRemote() {
  let g;
  try { g = await apiGet('/api/git'); } catch { return; }
  if (g.behind === null || g.behind === undefined) return;
  if (g.behind > 0 && !g.status.length && !g.ahead) { await syncPull(true); return; }
  if (g.ahead > 0) {
    toast(`本地有 ${g.ahead} 个提交还没推上去（上次推送大概失败了）—— 点「发布」重推`, 'err');
  } else if (g.behind > 0) {
    toast(`线上有 ${g.behind} 个新提交 —— 点「拉取线上」同步`, 'err');
  }
}
setTimeout(checkRemote, 1200);
</script>
