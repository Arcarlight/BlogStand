# ============================================================
#  拉鲁瓦 —— 布告栏的管理员
#  ------------------------------------------------------------
#  /board/ 页面里从右边飞进来的那只超音波幼虫。点它会弹出对话框，
#  里面有它的头图（精灵表里的"脸图"那一行）和一句闲聊。
#
#  闲聊分两种，一起随机抽：
#    1. 自动带数据的（便签时间、张数、字数、谁留的名字、虹星回过几张、
#       最早那张挂了多久、大家爱用什么颜色的纸、访客人数、最近更新、
#       最近写的日记、按现在几点打招呼…）—— 由 static/js/board-keeper.js 现算，
#       措辞改不了，但内容都是真的。
#    2. 下面这些**手写的固定台词** —— 想说点什么就写在这儿。
#
#  注意：
#    · 这里**不要**写占位符，写了也不会被替换（自动那几条是代码里拼的）。
#    · 想只在某几天说，用 from / to（"2026-10-01" 这种），不写就是一直说。
#    · 一句一行就行，太长的会自动换行；建议不超过 60 字。
#    · 写得多一点，它才不会翻来覆去那几句。
# ============================================================

[[lines]]
  text = "布告栏这一块归我管。你贴的每一张我都会看哦。"

[[lines]]
  text = "便签可以自己挑颜色的，别老是米白色的那一张呀。"

[[lines]]
  text = "风大的时候板子会响，那是藤蔓在敲画框，不是坏了。"

[[lines]]
  text = "砖墙上那只蜗牛？它没来过这边，你别问了。"

[[lines]]
  text = "写完了记得看一眼自己写的话，贴出去就收不回来啦。"

[[lines]]
  text = "要是看到不该看的，跟虹星说一声，她会把它撤下来。"

[[lines]]
  text = "我白天多半在打盹。你要找我，戳一下就行。"

[[lines]]
  text = "这张板子是从虹星那边搬过来的。之前那块小得多，贴三张就满了。"

[[lines]]
  text = "你注意过没有，左下角那丛草是我叫它长在那儿的，正好挡住板脚的钉子。"

[[lines]]
  text = "……刚才有只飞虫从砖墙那边过去，我没追上。算了。"

[[lines]]
  text = "便签是从下面那叠空白的里拿的。拿一张少一张，不过没关系，用不完。"

[[lines]]
  text = "要是字写得小一点、段落短一点，在板子上看起来会舒服很多。"

[[lines]]
  text = "有人问过我为什么守着这块板子。因为……总得有人看着呀。"

[[lines]]
  text = "下雨那天我躲到画框底下去了，便签一张都没湿。"

[[lines]]
  text = "你不说话我也没关系。我就站在这儿，你慢慢看。"

[[lines]]
  text = "嗯……我刚才在想事情。你叫我？"

[[lines]]
  text = "板子右上角那颗黄色图钉有点松了，我明天再弄。"

[[lines]]
  text = "贴完便签要是不好意思，就当是留给我看的吧。"
