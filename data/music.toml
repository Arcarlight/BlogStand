# ============================================================
#  音乐播放器 —— 侧栏最上面那条窄条挂件
#
#  这份文件由编辑器左侧的「音乐」面板管理（音频也能直接上传进去），
#  手改也行。曲目段落名必须是 [[tracks]]，编辑器认这个。
#
#  字段：
#    file   = "iforest.mp3"   必填 —— static/music/ 里的文件名（不带目录），
#                              或者完整的 https:// 外链
#    title  = "iforest"       选填 —— 显示的名字；不写就用文件名
#    artist = "来源未知"       选填 —— 作者 / 出处
#
#  一首都没填时，侧栏那条播放器整个不显示。
# ============================================================

assetDir = "music/"
title = "音乐"

[[tracks]]
  file = "iforest.mp3"
