# ============================================================
#  画廊（Infinite Gallery）—— 画作清单
#
#  由编辑器左侧「画作」面板维护，手改也行。
#  页面 content/gallery.md 正文里只写一行 {{< gallery >}}，
#  分类小节和缩略图网格都由这个文件生成。
#
#  一张画：
#    title = "画的名字"         必填
#    file  = "xxx.png"          必填 —— 相对 /images/ 的路径。
#                               编辑器上传的会落在 gallery/ 下，写 "gallery/xxx.png"
#    cat   = "hoshihum"         必填 —— 属于哪个分类（用分类的 id）
#    date  = "2026-08-07"       选填 —— 创作日期，没有就留空
#    cover = true               选填 —— 这张当分类封面（排最前）
#
#  分类：id 是页面锚点，改了旧链接会失效；desc 是标题下面那行灰色说明。
#
#  缩略图在 static/images/gallery/thumbs/（由编辑器上传/点按时生成），
#  没有缩略图就用原图，不影响显示。
# ============================================================

[[sections]]
  id = "hoshihum"
  name = "虹星（人）"
  desc = "次要形态的虹星，用在其他形态不太适合出场的地方。"

[[sections]]
  id = "hoshicat"
  name = "虹星（猫）"
  desc = "最早的虹星喵形，后来随着混圈范围扩大变成了「猫形」。"

[[sections]]
  id = "hoshiflya"
  name = "虹星（沙漠蜻蜓）"
  desc = "2026 年初混日文宝可梦圈时诞生的设定，主要用在日区活动。"

[[sections]]
  id = "pkmn"
  name = "宝可梦（除沙漠蜻蜓、暴飞龙）"
  desc = "宝可梦 IP 的其他角色，一般不指定具体某一只。"

[[sections]]
  id = "pkmnflya"
  name = "沙漠蜻蜓、暴飞龙"
  desc = "我推的孩子：沙漠蜻蜓与暴飞龙。多是阿特拉斯 × 欧亚西莉亚。"

[[sections]]
  id = "theothers"
  name = "其他IP"
  desc = "宝可梦以外的同人图，包括节奏天国、ROM 只读记忆等。"

[[sections]]
  id = "websiteuse"
  name = "网站用"
  desc = "网站上使用的装饰插图（日记里出现的图不记在这里）。"

