# ============================================================
#  「吐槽」出场名单
#  ------------------------------------------------------------
#  写博客的时候想在正文里插一句吐槽：编辑器里点「吐槽」，
#  选一只、选个表情、写一句话，它就会被插进正文里。
#
#    dex  = 全国图鉴编号
#           脸图从 static/pkmn/sprite/<dex>.png 里取（第 3 行是脸图），
#           所以这只必须**已经有素材** —— 也就是在 data/pkmn-pool.toml 里。
#    name = 出现在对话框上的名字（可以起人名，比如赤面龙叫福波斯）
#    note = 编辑器下拉框里显示的备注，不写就显示图鉴里的中文名
#
#  想加新的一只：
#    1. 在这里加一段；
#    2. 素材没有的话先 python tools/build-pkmn.py；
#    3. 编辑器重启一下，下拉框里就有了。
# ============================================================

[[items]]
  dex  = 621
  name = "福波斯"
  note = "赤面龙"
