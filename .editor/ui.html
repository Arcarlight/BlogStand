/* --- 蒂安希听到了（文集侧栏那个挂件要转述的话） ---
   数据 data/diancie-heard.toml 分成**三张表**（当初只有一张 [[items]]，后来站长
   的要求变成「会长三类话」）：
     [[heard]]   小碎钻们听到的事情 —— 站长写的，当树洞
     [[said]]    小碎钻们说的话     —— 和宝可梦设定有关
     [[thought]] 蒂安希的感悟       —— 站长写的，当树洞
   面板因此分成三个区，各区的名字/说明用接口给的 labels / hints（服务端和
   tools/build-pkmn.py 里那两份文案逐字一致，页面上的说法也是同一套）。
   保存一次下发三类；服务端缺的类当空数组，所以这里永远三类都发。

   emotion 留空 = 页面上按文本关键词自动挑脸，右边那格就是这件事的预览
   （带一张真的表情小图，图由 GET /api/diancie/face/<名字> 现裁）。

   ⚠️ 下面的 DIANCIE_WORDS 必须和 **两份** 同样的表一致：
        · static/js/diancie-heard.js（页面上真正显示哪张脸，是那份算的）
        · .editor/emotion-words.mjs（服务端那份，改关键词时以它和客户端为准）
      三份是同一张表。**顺序也是优先级**，所以不能只加词、不排位置。
      面板的预览要是和页面算的不一样，站长会照着一个错的预览去调 —— 比没有预览更糟。 */
const DIANCIE_WORDS = [
  ['Crying',      ['哭', '泪', '呜呜', '抽泣', '哽咽']],
  ['Sad',         ['难过', '伤心', '低落', '失落', '寂寞', '孤单', '遗憾', '舍不得', '断了']],
  ['Angry',       ['生气', '气死', '愤怒', '讨厌', '可恶', '烦人']],
  ['Surprised',   ['吃惊', '惊讶', '居然', '竟然', '没想到', '吓了一跳', '有人来']],
  ['Worried',     ['担心', '不安', '放心不下', '有事', '危险', '等它', '一直在等']],
  ['Sigh',        ['叹气', '叹了', '唉', '无奈', '算了']],
  ['Teary-Eyed',  ['眼眶', '含泪', '差点掉下']],
  ['Shouting',    ['大声', '喊', '吼', '叫了']],
  ['Pain',        ['疼', '痛', '受伤']],
  ['Dizzy',       ['晕', '天旋地转', '晃']],
  ['Stunned',     ['愣', '呆住', '说不出话']],
  ['Joyous',      ['雀跃', '跳起来', '太好了', '真好', '欢呼']],
  ['Happy',       ['开心', '高兴', '愉快', '笑', '喜欢', '好看', '温柔', '暖']],
  ['Inspired',    ['想法', '灵感', '启发', '有意思', '像一小片', '很像']],
  ['Determined',  ['一定', '决定', '坚持', '继续', '不会停']],
];
// 服务端拿不到时（比如旧进程）的兜底名单，顺序和 emotion-words.mjs 的 EMOTION_NAMES 一样
const DIANCIE_EMOTIONS = [
  'Normal', 'Happy', 'Joyous', 'Inspired', 'Determined', 'Angry', 'Sad', 'Crying',
  'Teary-Eyed', 'Worried', 'Sigh', 'Shouting', 'Surprised', 'Stunned', 'Dizzy', 'Pain',
];
// 服务端拿不到 emotionCn 时的兜底中文名（和 server.mjs 的 DIANCIE_EMOTION_CN 一样）
const DIANCIE_EMOTION_CN = {
  'Normal': '平静', 'Happy': '开心', 'Joyous': '雀跃', 'Inspired': '受到启发',
  'Determined': '坚定', 'Angry': '生气', 'Sad': '难过', 'Crying': '哭',
  'Teary-Eyed': '含泪', 'Worried': '担心', 'Sigh': '叹气', 'Shouting': '大声',
  'Surprised': '吃惊', 'Stunned': '愣住', 'Dizzy': '晕', 'Pain': '疼',
};
function diancieClassify(text) {
  const s = String(text || '');
  for (const [name, words] of DIANCIE_WORDS) {
    for (const w of words) if (s.includes(w)) return name;
  }
  return 'Normal';
}

/* 表情小图缓存：名字 -> blob: 地址（空串 = 这个表情取不到）。
   一次面板会话只拉一遍，不因为重画面板反复下载同 16 张图。
   blob 而不是 apiGet：接口吐的是 PNG 不是 JSON，用 fetch 拿 blob 再转地址即可。
   返回的 Promise 要 await —— 不等它就把面板画出来，第一遍画的全是没 src 的
   空位（站长看到的就是「还是不显示」），得等图到了再画。 */
let DIANCIE_FACE_URLS = null;
let DIANCIE_FACE_LOADING = null;
function diancieFacesOnce() {
  if (DIANCIE_FACE_LOADING) return DIANCIE_FACE_LOADING;
  if (DIANCIE_FACE_URLS) return Promise.resolve(DIANCIE_FACE_URLS);
  DIANCIE_FACE_LOADING = (async () => {
    const out = {};
    /* ⚠️ **必须串行**，不能 Promise.all 并发。
       之前是 16 个 fetch 一起发，实测有一大半会挂（面板上 36 张脸只出来 11 张，
       其余 src 是空串、显示成破图 —— 站长要解决的正是这个）。
       串行 16 个请求也就几百毫秒，换的是「一定都能拿到」。 */
    for (const n of DIANCIE_EMOTIONS) {
      try {
        const res = await fetch('/api/diancie/face/' + encodeURIComponent(n),
          { headers: { 'X-Editor-Token': TOKEN } });
        if (!res.ok) throw new Error('HTTP ' + res.status);
        out[n] = URL.createObjectURL(await res.blob());
      } catch (e) {
        out[n] = '';      // 取不到就只显示名字，面板照常能用
      }
    }
    DIANCIE_FACE_URLS = out;
    return out;
  })().finally(() => { DIANCIE_FACE_LOADING = null; });
  return DIANCIE_FACE_LOADING;
}

async function renderDiancie() {
  const d = await apiGet('/api/diancie/heard');
  const emotions = (d.emotions && d.emotions.length) ? d.emotions : DIANCIE_EMOTIONS;
  const emotionCn = Object.assign({}, DIANCIE_EMOTION_CN, d.emotionCn || {});
  const labels = Object.assign({}, {
    heard: '小碎钻们听到的事情', said: '小碎钻们说的话', thought: '蒂安希的感悟',
  }, d.labels || {});
  const hints = Object.assign({}, {
    heard: '站长自己写，当树洞用。', said: '和宝可梦设定有关的小事。', thought: '站长自己写，当树洞用。',
  }, d.hints || {});

  // 三类都要在（接口少给一类时补空数组），顺序固定：文件里也是这个顺序
  const items = { heard: [], said: [], thought: [] };
  for (const k of ['heard', 'said', 'thought']) {
    const arr = (d.kinds && Array.isArray(d.kinds[k])) ? d.kinds[k] : [];
    items[k] = arr.map((x) => ({ text: x.text || '', emotion: x.emotion || '' }));
  }

  // 挂件开关就是 hugo.toml [params] 里的 diancieHeard，走「站点设置」那对接口改。
  // 键还不存在时（只可能是第一次开）当关着 —— 和 layouts 那边 `if site.Params.diancieHeard` 一致。
  let on = false;
  try {
    const p = await apiGet('/api/params');
    on = !!(p.items && p.items.diancieHeard && p.items.diancieHeard.value);
  } catch (e) { /* 读不到就按关着显示；保存开关时接口自己会报错 */ }

  // 表情小图先取回来再画面板：不等它的话，第一遍画出来的是 16 个没 src 的空位，
  // 站长看到的就是「选表情这一块还是不显示图」。
  await diancieFacesOnce().catch(() => {});

  /** 名字 + 中文 + 小图。
      取不到图时**不摆空 src**（浏览器会显示成一个破图图标，比什么都难看），
      改成直接不输出 <img>，只留名字。 */
  const faceHtml = (name) => {
    const url = DIANCIE_FACE_URLS && DIANCIE_FACE_URLS[name];
    if (!url) return '<span class="dc-face-missing" title="这张脸没取到">（无图）</span>';
    return '<img class="dc-face" alt="' + esc(name) + '" src="' + esc(url) + '"' +
      ' title="' + esc(name + ' ' + (emotionCn[name] || '')) + '">';
  };
  const emotionName = (n) => n + '　' + (emotionCn[n] || '');

  /* 一行的预览：手动指定就照他选的，空着就现算「自动 → X」。
     两种情况都把小图摆出来 —— 站长要的就是「能看出这张脸长什么样」。 */
  const previewHtml = (it) => {
    if (it.emotion) {
      return '<span class="dc-auto">手动指定</span> ' + faceHtml(it.emotion);
    }
    const auto = diancieClassify(it.text);
    return '<span class="dc-auto">自动 → <b>' + esc(auto) + '</b></span> ' + faceHtml(auto);
  };

  const emotionOptions = (cur) => '<option value="">自动判断</option>'
    + emotions.map((n) => '<option value="' + esc(n) + '"' + (n === cur ? ' selected' : '') +
        '>' + esc(emotionName(n)) + '</option>').join('');

  const draw = () => {
    let h = '<h2 class="sec">蒂安希听到了</h2>';
    h += '<p class="hint">文集侧栏那个挂件要讲的话，对应 <code>data/diancie-heard.toml</code>。'
      + '文件里是 <b>三张表</b>，下面三个区各管一张。</p>';
    h += '<div class="note">' +
      '<b>改完不用跑任何脚本</b> —— 保存后到页面上<b>刷新一下</b>就能看到（编辑器会顺手重新导出一次 JSON）。<br>' +
      '表情选「自动判断」时，页面上按这句话里的关键词挑脸，右边那格显示<b>现在会挑到哪张</b>（配小图）；' +
      '想固定成某张脸就直接在下拉框里选，选完小图也跟着换。<br>' +
      '换行写没关系，保存时会被压成一行（TOML 的字符串不能跨行，页面上也是一行一句地念）。' +
      '保存前编辑器会把原文件复制一份到 <code>data/diancie-heard.toml.bak</code>。</div>';

    h += '<div class="field"><label for="chkDiancie" title="hugo.toml 的 [params].diancieHeard">显示蒂安希挂件</label>'
      + '<input type="checkbox" id="chkDiancie" ' + (on ? 'checked' : '') + '>'
      + '<span class="cmt">hugo.toml 的 diancieHeard</span></div>';
    h += '<p class="hint">关掉后侧栏那整块就不显示了。第一次打开时，编辑器会在 <code>hugo.toml</code> 的 ' +
      '<code>[params]</code> 末尾补上一行 <code>diancieHeard = true</code>（「站点设置」面板补新键也是这么做的）。</p>';
    h += '<div style="margin-bottom:6px"><button class="primary" id="btnSaveDiancieSw"><img class="ico" src="/editor-icons/fugue/disk.png" alt="" draggable="false">保存开关</button></div>';

    /* 16 张脸一次摆出来（每个名字配中文）：站长原来的抱怨就是「看不出选的是哪张」，
       这里让他先认脸，再到下拉框里挑。 */
    h += '<div class="dc-legend">'
      + emotions.map((n) => '<span class="dc-legend-item">' + faceHtml(n)
        + '<span class="dc-legend-name">' + esc(emotionCn[n] || '') + '</span>'
        + '<span class="dc-legend-code">' + esc(n) + '</span></span>').join('')
      + '</div>';

    for (const kind of ['heard', 'said', 'thought']) {
      const list = items[kind];
      h += '<div class="dc-sec">';
      h += '<h3 class="dc-sec-title"><span class="label">' + esc(labels[kind]) + '</span>'
        + '<span class="code">[[' + kind + ']]</span>'
        + '<span class="cell" data-count="' + kind + '">共 ' + list.length + ' 条</span></h3>';
      h += '<p class="dc-sec-hint">' + esc(hints[kind]) + '</p>';
      h += '<table class="grid"><thead><tr>'
        + '<th style="width:44px">表情</th><th>内容</th>'
        + '<th style="width:190px">表情</th><th style="width:170px">自动判断</th><th style="width:34px"></th>'
        + '</tr></thead><tbody data-tb="' + kind + '">';
      list.forEach((it, i) => {
        h += '<tr>'
          + '<td class="dc-face-cell" data-face="' + kind + '" data-i="' + i + '">' + faceHtml(it.emotion || diancieClassify(it.text)) + '</td>'
          + '<td><textarea class="dc-text" data-f="text" data-kind="' + kind + '" data-i="' + i + '"'
          + ' placeholder="比如：它们说，光从上面漏下来的样子，和宝石里面的光很像。">' + esc(it.text) + '</textarea></td>'
          + '<td><select class="dc-sel" data-f="emotion" data-kind="' + kind + '" data-i="' + i + '">'
          + emotionOptions(it.emotion) + '</select></td>'
          + '<td class="dc-preview" data-auto="' + kind + '" data-i="' + i + '">' + previewHtml(it) + '</td>'
          + '<td style="text-align:center"><button class="danger" data-del="' + i + '" data-kind="' + kind + '"><img class="ico" src="/editor-icons/fugue/cross.png" alt="" draggable="false"></button></td>'
          + '</tr>';
      });
      h += '</tbody></table>';
      if (!list.length) {
        h += '<p class="hint">这一类还没有话。点下面的「＋ 加一条」写第一句 —— ' +
          '三类都是空的时候，侧栏那块挂件会说「我还没听到什么」。</p>';
      }
      h += '<button data-add="' + kind + '"><img class="ico" src="/editor-icons/fugue/plus.png" alt="" draggable="false"> 加一条</button></div>';
    }

    h += '<div style="margin-top:16px">'
      + '<button class="primary" id="btnSaveDiancie">' + ico('save') + ' 保存三类</button></div>';
    showPanel(h);

    const KINDS = ['heard', 'said', 'thought'];

    /* DOM -> items。三个区一起收（textarea / select 都有 data-kind + data-i） */
    const collectAll = () => {
      document.querySelectorAll('#panel [data-f]').forEach((el) => {
        const kind = el.dataset.kind, i = +el.dataset.i;
        if (items[kind] && items[kind][i]) items[kind][i][el.dataset.f] = el.value;
      });
    };
    /** 只重画某一行的两张小图和自动判断文字（整块重画会把光标顶掉） */
    const refreshRow = (kind, i) => {
      const it = items[kind] && items[kind][i];
      if (!it) return;
      const cell = document.querySelector('#panel .dc-preview[data-auto="' + kind + '"][data-i="' + i + '"]');
      if (cell) cell.innerHTML = previewHtml(it);
      const face = document.querySelector('#panel [data-face="' + kind + '"][data-i="' + i + '"]');
      if (face) face.innerHTML = faceHtml(it.emotion || diancieClassify(it.text));
    };
    /** 条数小标签（增删之后要跟着变） */
    const refreshCounts = () => {
      for (const k of KINDS) {
        const el = document.querySelector('#panel [data-count="' + k + '"]');
        if (el) el.textContent = '共 ' + items[k].length + ' 条';
      }
    };

    document.querySelectorAll('#panel textarea[data-f="text"]').forEach((el) => {
      el.addEventListener('input', () => {
        const kind = el.dataset.kind, i = +el.dataset.i;
        if (!items[kind] || !items[kind][i]) return;
        items[kind][i].text = el.value;
        refreshRow(kind, i);      // 实时：「自动 → X」和小图跟着字变
      });
    });
    document.querySelectorAll('#panel select[data-f="emotion"]').forEach((el) => {
      el.addEventListener('change', () => {
        const kind = el.dataset.kind, i = +el.dataset.i;
        if (!items[kind] || !items[kind][i]) return;
        items[kind][i].emotion = el.value;
        refreshRow(kind, i);
      });
    });
    document.querySelectorAll('#panel [data-del]').forEach((b) => b.addEventListener('click', () => {
      collectAll();
      items[b.dataset.kind].splice(+b.dataset.del, 1);
      draw();
    }));
    document.querySelectorAll('#panel [data-add]').forEach((b) => b.addEventListener('click', () => {
      collectAll();
      items[b.dataset.add].push({ text: '', emotion: '' });
      draw();
    }));
    $('#btnSaveDiancie').addEventListener('click', async () => {
      collectAll();
      /* 全空的行（点了「加一条」还没写）服务端会丢掉，这里先自己清掉再画一遍，
         免得保存成功之后面板上还挂着一个其实没落盘的空行。
         注意是**原地**清（items[k] 是闭包里那个数组，重新赋值会让上面那些
         监听器指向旧数组），也别整份重画 —— 站长可能正停在某个格子里打字。 */
      let dropped = 0;
      for (const k of KINDS) {
        const kept = items[k].filter((x) => String(x.text || '').trim() || String(x.emotion || '').trim());
        dropped += items[k].length - kept.length;
        items[k].length = 0;
        for (const x of kept) items[k].push(x);
      }
      if (dropped) { refreshCounts(); toast('有 ' + dropped + ' 条空行没有内容，没有保存', 'err'); }
      try {
        const r = await apiPost('/api/diancie/heard', { kinds: items });
        const c = (r && r.counts) || {};
        const sum = KINDS.reduce((n, k) => n + (c[k] || 0), 0);
        toast('已保存：听到 ' + (c.heard || 0) + ' 条 / 说的 ' + (c.said || 0) + ' 条 / 感悟 ' + (c.thought || 0) +
          ' 条，共 ' + sum + ' 条（到页面上刷新一下就能看到）', 'ok');
        // 后端说「TOML 存住了但 JSON 没导出」时得让站长看见（页面读的是那份 JSON）
        if (r && r.warned) toast('已保存，但有件事要留意：' + r.warned, 'err');
      } catch (e) {
        toast('保存失败：' + e.message, 'err');
      }
    });
    $('#btnSaveDiancieSw').addEventListener('click', async () => {
      const checked = $('#chkDiancie').checked;
      try {
        await apiPost('/api/params', { updates: { diancieHeard: { type: 'bool', value: checked } } });
        on = checked;
        toast(checked ? '已打开：侧栏会显示「蒂安希听到了」' : '已关掉：侧栏不再显示「蒂安希听到了」', 'ok');
      } catch (e) {
        toast('开关保存失败：' + e.message, 'err');
      }
    });
  };
  draw();
}

/* --- 画廊（content/gallery.md 的 {{< gallery >}} + data/gallery.toml） ---
   页面正文只有一行短代码，分类小节和缩略图网格都由 data/gallery.toml 生成。
   面板里能：上传新图（自动压缩略图）、引用站上已有的图、拖动排序、
   填标题/创作日期、选分类、指定封面。 */
let GAL_CACHE = null;      // { items, sections }，给「选已有图」复用

async function renderGallery() {
  const d = await apiGet('/api/list/gallery');
  const items = (d.items || []).map((x) => Object.assign({}, x));
  let sections = (d.sections || []).map((x) => Object.assign({}, x));
  const missing = new Set(d.missing || []);

  let html = '';
  html += '<h2 class="sec">画廊</h2>';
  html += '<p class="hint">画廊页（<code>/gallery/</code>）里的画。页面正文只有一行 <code>{{&lt; gallery &gt;}}</code>，' +
          '分类小节和缩略图都由 <code>data/gallery.toml</code> 生成，这里加一张页面就多一张。</p>';
  html += '<div class="note">' +
          '<b>上传新图</b>：选文件即可，自动存进 <code>static/images/gallery/</code> 并压一张缩略图（首屏只背几十 KB，点开才加载原图）。<br>' +
          '<b>引用已有的图</b>：站上 <code>static/images/</code> 里已经有的图不用再传一份，点「选已有图」挑就行。<br>' +
          '<b>按住左侧的把手拖动</b>就是站内展示顺序（同一分类内：封面最前，其余按创作日期从新到旧）。<br>' +
          '标题和创作日期是页面上显示的那两行；日期留空也行。</div>';

  html += '<table class="grid" id="galTable"><thead><tr>' +
          '<th style="width:26px"></th><th style="width:44px">预览</th>' +
          '<th style="width:22%">图片文件</th><th style="width:22%">标题</th>' +
          '<th style="width:118px">创作日期</th><th style="width:120px">分类</th>' +
          '<th style="width:34px">封面</th><th style="width:34px"></th>' +
          '</tr></thead><tbody id="tbGal"></tbody></table>';
  html += '<div id="galEmpty" class="hint"></div>';
  html += '<div style="margin-top:6px">' +
          '<button id="btnGalUpload">' + ico('upload') + ' 上传新图</button> ' +
          '<button id="btnGalPick">' + ico('grid') + ' 选已有图</button> ' +
          '<button id="btnGalAdd"><img class="ico" src="/editor-icons/fugue/plus.png" alt="" draggable="false"> 手动加一条</button> ' +
          '<button class="primary" id="btnGalSave">' + ico('save') + ' 保存</button>' +
          '</div>';
  html += '<input type="file" id="galFile" accept="image/*" multiple hidden>';

  html += '<h2 class="sec" style="margin-top:18px">分类</h2>';
  html += '<p class="hint">分类就是页面上的小节标题。<b>id 是页内锚点</b>（首字母不能乱改，改了旧链接会失效），' +
          'name 是显示名，desc 是标题下面那行灰字。</p>';
  html += '<div id="galSections"></div>';
  html += '<div style="margin-top:6px"><button id="btnGalAddSec"><img class="ico" src="/editor-icons/fugue/plus.png" alt="" draggable="false"> 加一个分类</button></div>';

  showPanel(html);

  // ---------- 分类 ----------
  const drawSections = () => {
    const box = $('#galSections');
    box.innerHTML = '';
    sections.forEach((s, i) => {
      const row = document.createElement('div');
      row.className = 'gal-secrow';
      row.style.cssText = 'display:flex;gap:6px;margin-bottom:5px;align-items:center';
      const mk = (field, ph, w) => {
        const el = document.createElement('input');
        el.value = s[field] || '';
        el.placeholder = ph;
        el.dataset.sec = String(i);
        el.dataset.field = field;
        el.style.cssText = 'font:inherit;font-size:12px;padding:3px 5px;border:1px solid var(--line);border-radius:3px;' + (w || '');
        return el;
      };
      row.appendChild(mk('id', 'id（锚点）', 'width:130px'));
      row.appendChild(mk('name', '显示名', 'width:170px'));
      row.appendChild(mk('desc', '说明（可空）', 'flex:1'));
      const del = document.createElement('button');
      del.className = 'danger';
      del.textContent = '×';
      del.title = '删掉这个分类（下面有画的话会拒绝保存）';
      del.addEventListener('click', () => {
        collectSections();
        const used = items.filter((it) => it.cat === sections[i].id).length;
        if (used) { toast(`「${sections[i].name}」里还有 ${used} 张画，先把它们换到别的分类`, 'err'); return; }
        sections.splice(i, 1);
        drawSections();
      });
      row.appendChild(del);
      box.appendChild(row);
    });
  };
  const collectSections = () => {
    document.querySelectorAll('#galSections input[data-sec]').forEach((el) => {
      sections[+el.dataset.sec][el.dataset.field] = el.value;
    });
  };

  // ---------- 画作表格 ----------
  const draw = () => {
    const tb = $('#tbGal');
    tb.innerHTML = '';
    const nameOf = (id) => (sections.find((s) => s.id === id) || {}).name || '（未选）';

    items.forEach((it, i) => {
      const tr = document.createElement('tr');
      tr.draggable = true;
      tr.dataset.i = String(i);

      const td0 = document.createElement('td');
      td0.style.textAlign = 'center';
      td0.innerHTML = '<span class="handle" style="cursor:grab"><img class="ico" src="/editor-icons/fugue/arrow-move.png" alt="" draggable="false"></span>';

      const td1 = document.createElement('td');
      const img = document.createElement('img');
      img.style.cssText = 'width:36px;height:36px;object-fit:cover;border:1px solid var(--line);background:#fff';
      img.alt = '';
      img.loading = 'lazy';
      img.src = it.file ? '/images/' + it.file : '';
      td1.appendChild(img);

      const tdFile = document.createElement('td');
      const inp = document.createElement('input');
      inp.value = it.file || '';
      inp.placeholder = 'gallery/xxx.png';
      inp.dataset.f = 'file';
      inp.dataset.i = String(i);
      tdFile.appendChild(inp);

      const tdTitle = document.createElement('td');
      const tIn = document.createElement('input');
      tIn.value = it.title || '';
      tIn.placeholder = '画的名字';
      tIn.dataset.f = 'title';
      tIn.dataset.i = String(i);
      // 简介（悬浮卡上显示的那行）：没写就退回该分类的说明，所以可以空着
      const dscIn = document.createElement('input');
      dscIn.value = it.desc || '';
      dscIn.placeholder = '简介（可空，会退回分类说明）';
      dscIn.dataset.f = 'desc';
      dscIn.dataset.i = String(i);
      dscIn.style.cssText = 'margin-top:2px;color:#5a7089';
      tdTitle.append(tIn, dscIn);

      const tdDate = document.createElement('td');
      const dIn = document.createElement('input');
      dIn.type = 'date';
      dIn.value = it.date || '';
      dIn.dataset.f = 'date';
      dIn.dataset.i = String(i);
      tdDate.appendChild(dIn);

      const tdCat = document.createElement('td');
      const sel = document.createElement('select');
      sel.dataset.f = 'cat';
      sel.dataset.i = String(i);
      sel.style.cssText = 'width:100%;font:inherit;font-size:12px;padding:3px';
      const opt0 = document.createElement('option');
      opt0.value = '';
      opt0.textContent = '（选分类）';
      sel.appendChild(opt0);
      sections.forEach((s) => {
        const o = document.createElement('option');
        o.value = s.id;
        o.textContent = s.name;
        if (it.cat === s.id) o.selected = true;
        sel.appendChild(o);
      });
      tdCat.appendChild(sel);

      const tdCover = document.createElement('td');
      tdCover.style.textAlign = 'center';
      const cb = document.createElement('input');
      cb.type = 'checkbox';
      cb.checked = !!it.cover;
      cb.dataset.f = 'cover';
      cb.dataset.i = String(i);
      tdCover.appendChild(cb);

      const tdDel = document.createElement('td');
      tdDel.style.textAlign = 'center';
      const del = document.createElement('button');
      del.className = 'danger';
      del.textContent = '×';
      del.addEventListener('click', () => { collect(); items.splice(i, 1); draw(); });
      tdDel.appendChild(del);

      tr.append(td0, td1, tdFile, tdTitle, tdDate, tdCat, tdCover, tdDel);
      if (it.file && missing.has(it.file)) {
        tr.style.background = '#fff5f5';
        tr.title = '找不到这个图片文件：static/images/' + it.file;
      }
      tb.appendChild(tr);
    });

    $('#galEmpty').innerHTML = items.length ? '' :
      '还没有画。点上面的「上传新图」或「选已有图」开始。';
  };

  const collect = () => {
    document.querySelectorAll('#tbGal [data-f]').forEach((el) => {
      const i = +el.dataset.i;
      if (!items[i]) return;
      items[i][el.dataset.f] = el.dataset.f === 'cover' ? el.checked : el.value;
    });
  };

  const save = async () => {
    collect();
    collectSections();
    const payload = {
      sections: sections.map((s) => ({ id: s.id.trim(), name: s.name.trim(), desc: s.desc.trim() })),
      items: items.map((it) => ({
        title: String(it.title || '').trim(),
        file: String(it.file || '').trim(),
        cat: String(it.cat || '').trim(),
        date: String(it.date || '').trim(),
        desc: String(it.desc || '').trim(),
        cover: !!it.cover,
      })).filter((it) => it.title || it.file),
    };
    try {
      const r = await apiPost('/api/list/gallery', payload);
      (r.missing || []).forEach((f) => missing.add(f));
      toast('画廊已保存' + (r.missing && r.missing.length ? `（有 ${r.missing.length} 张图文件没找到，已标红）` : ''), 'ok');
      return true;
    } catch (e) { toast('保存失败：' + e.message, 'err'); return false; }
  };

  // ---------- 事件 ----------
  drawSections();
  draw();

  $('#btnGalAddSec').addEventListener('click', () => {
    collectSections();
    sections.push({ id: '', name: '', desc: '' });
    drawSections();
    const first = document.querySelector('#galSections input[data-sec]:last-of-type');
    if (first) first.focus();
  });

  $('#btnGalAdd').addEventListener('click', () => {
    collect();
    items.push({ title: '', file: '', cat: sections.length ? sections[0].id : '', date: '', cover: false });
    draw();
  });

  $('#btnGalSave').addEventListener('click', save);

  // 上传：落进 static/images/gallery/，服务端顺手压缩略图
  $('#btnGalUpload').addEventListener('click', () => $('#galFile').click());
  $('#galFile').addEventListener('change', async (e) => {
    const files = [...(e.target.files || [])];
    if (!files.length) return;
    collect();
    toast('正在上传 ' + files.length + ' 张…');
    for (const f of files) {
      try {
        const data = await new Promise((res, rej) => {
          const rd = new FileReader();
          rd.onload = () => res(rd.result);
          rd.onerror = () => rej(new Error('读文件失败'));
          rd.readAsDataURL(f);
        });
        const r = await apiPost('/api/upload', { name: f.name, data, dir: 'images/gallery' });
        items.push({
          title: f.name.replace(/\.[^.]+$/, ''),
          file: 'gallery/' + (r.rel || '').split('/').pop(),
          cat: sections.length ? sections[0].id : '',
          date: '',
          cover: false,
        });
        if (r.thumb && r.thumb.ok === false) toast('缩略图没生成：' + r.thumb.error, 'err');
      } catch (err) {
        toast('「' + f.name + '」上传失败：' + err.message, 'err');
      }
    }
    e.target.value = '';
    await save();
    openPanel('gallery');
  });

  // 选已有图
  $('#btnGalPick').addEventListener('click', async () => {
    collect();
    collectSections();
    await pickExistingImages({
      sections,
      imported: items.map((x) => String(x.file || '').trim()).filter(Boolean),
      back: () => openPanel('gallery'),
      onPick: (files) => {
        // 同一张图重复点进来会很困惑，已经在本页里的就跳过（并说一声）
        const have = new Set(items.map((x) => String(x.file || '').trim()));
        const skipped = [];
        files.forEach((f) => {
          if (have.has(f)) { skipped.push(f); return; }
          have.add(f);
          items.push({
            title: f.replace(/^.*\//, '').replace(/\.[^.]+$/, ''),
            file: f,
            cat: sections.length ? sections[0].id : '',
            date: '',
            cover: false,
          });
        });
        if (skipped.length) toast('已在画廊里，跳过 ' + skipped.length + ' 张：' + skipped.join('、'), 'err');
        if (!files.length || (skipped.length === files.length)) { openPanel('gallery'); return; }
        save().then(() => openPanel('gallery'));
      },
    });
  });

  // 拖拽排序
  const tb = $('#tbGal');
  let drag = null;
  tb.addEventListener('dragstart', (e) => {
    const tr = e.target.closest('tr[data-i]');
    if (!tr) { e.preventDefault(); return; }
    drag = tr; tr.style.opacity = '.45';
    e.dataTransfer.effectAllowed = 'move';
    try { e.dataTransfer.setData('text/plain', tr.dataset.i); } catch (err) {}
  });
  tb.addEventListener('dragover', (e) => {
    if (!drag) return;
    const tr = e.target.closest('tr[data-i]');
    if (!tr || tr === drag) return;
    e.preventDefault();
    const r = tr.getBoundingClientRect();
    tb.insertBefore(drag, e.clientY > r.top + r.height / 2 ? tr.nextSibling : tr);
  });
  tb.addEventListener('drop', (e) => { if (drag) e.preventDefault(); });
  tb.addEventListener('dragend', async () => {
    if (!drag) return;
    drag.style.opacity = ''; drag = null;
    const order = [...tb.querySelectorAll('tr[data-i]')].map((tr) => +tr.dataset.i);
    if (!order.some((v, k) => v !== k)) return;
    const next = order.map((i) => items[i]);
    items.length = 0; items.push(...next);
    if (await save()) openPanel('gallery');
  });
}

/* ---------- 选一张站上已有的图 ----------
   站上 static/images/ 里已经有 100 多张图了（日记、首页、迁移过来的），
   正文里想用它们的时候，以前只能手打路径。这里给个带缩略图的挑选器。 */
async function pickExistingImages(opts) {
  const d = await apiGet('/api/gallery/images');
  const all = d.items || [];

  let h = '<h2 class="sec">选站上已有的图片</h2>';
  h += '<p class="hint">来自 <code>static/images/</code>，共 ' + all.length + ' 张。' +
       '点一张选中，点「插入」就把它加进去 —— 不会复制文件，只是引用。' +
       (opts && opts.imported && opts.imported.length
         ? '带 <b>已导入</b> 标记的是画廊里已经有的。'
         : '') + '</p>';
  h += '<p><input id="galPickSearch" placeholder="按文件名筛…" style="font:inherit;padding:4px 7px;border:1px solid var(--line);border-radius:4px;width:260px"> ' +
       '<button id="galPickInsert" class="primary"><img class="ico" src="/editor-icons/fugue/tick.png" alt="" draggable="false">插入选中的</button> ' +
       '<button id="galPickBack"><img class="ico" src="/editor-icons/fugue/arrow-180-small.png" alt="" draggable="false">返回</button> ' +
       '<span class="cmt" id="galPickInfo"></span></p>';
  h += '<div id="galPickGrid" class="galpick"></div>';
  showPanel(h);

  if (opts && opts.back) {
    $('#galPickBack').hidden = false;
    $('#galPickBack').addEventListener('click', opts.back);
  } else {
    $('#galPickBack').hidden = true;
  }

  const chosen = new Set();
  // 已经在画廊里的图：打个「已导入」标记，省得点进去才发现被跳过
  const imported = new Set(((opts && opts.imported) || []).map((s) => String(s).trim()));
  const grid = $('#galPickGrid');
  const info = $('#galPickInfo');

  const paint = (filter) => {
    const list = all.filter((it) => !filter || it.file.toLowerCase().includes(filter.toLowerCase()));
    grid.innerHTML = '';
    list.slice(0, 300).forEach((it) => {
      const already = imported.has(it.file);
      const cell = document.createElement('button');
      cell.type = 'button';
      cell.className = 'galpick-cell' + (chosen.has(it.file) ? ' on' : '') + (already ? ' added' : '');
      cell.dataset.file = it.file;
      cell.title = it.file + '（' + Math.round(it.bytes / 1024) + ' KB' + (it.thumb ? '，有缩略图' : '') +
        (already ? '，已经在画廊里了' : '') + '）';
      const im = document.createElement('img');
      im.src = it.preview;
      im.loading = 'lazy';
      im.alt = '';
      const cap = document.createElement('span');
      cap.textContent = it.file.split('/').pop();
      cell.append(im, cap);
      if (already) {
        const tag = document.createElement('i');
        tag.className = 'galpick-tag';
        tag.textContent = '已导入';
        cell.appendChild(tag);
      }
      cell.addEventListener('click', () => {
        if (chosen.has(it.file)) chosen.delete(it.file); else chosen.add(it.file);
        cell.classList.toggle('on', chosen.has(it.file));
        info.textContent = chosen.size ? '已选 ' + chosen.size + ' 张' : '';
      });
      grid.appendChild(cell);
    });
    if (list.length > 300) {
      const more = document.createElement('p');
      more.className = 'hint';
      more.textContent = '（只显示前 300 张，用上面的搜索缩小范围）';
      grid.appendChild(more);
    }
    if (!list.length) {
      const none = document.createElement('p');
      none.className = 'hint';
      none.textContent = '没有匹配的图片。';
      grid.appendChild(none);
    }
  };
  paint('');

  $('#galPickSearch').addEventListener('input', (e) => paint(e.target.value.trim()));
  $('#galPickInsert').addEventListener('click', () => {
    if (!chosen.size) { toast('先点几张图选中', 'err'); return; }
    const files = [...chosen];
    if (opts && opts.onPick) { opts.onPick(files); return; }
    // 没给回调就走「插入图片」的老路（正文里插图用）
    const w = imgWidthValue();
    const wpOf = new Map(all.map((it) => [it.file, !!it.webp]));
    let out = '';
    files.forEach((f) => {
      const stem = f.replace(/^.*\//, '').replace(/\.[^.]+$/, '');
      const wp = wpOf.get(f) ? '/images/' + f.replace(/\.[^.]+$/, '.webp') : null;
      out += makePicture('/images/' + f, wp, stem, w) + '\n';
    });
    insertText(out);
    toast('已插入 ' + files.length + ' 个图' +
      (files.some((f) => wpOf.get(f)) ? '（其中几张带 webp，已写成 <picture>）' : ''), 'ok');
  });
}

/* --- 音乐播放器（侧栏最上面那条窄条） ---
   音频丢进 static/music/，曲目写在 data/music.toml 的 [[tracks]] 里。
   这个面板就是给那件事用的：拖拽排序、直接上传音频、还能一眼看出
   哪首的音频文件其实不在——那是最容易踩的坑（写了曲名忘了拷文件）。 */
async function renderMusic() {
  const d = await apiGet('/api/list/music');
  const items = (d.items || []).map((x) => Object.assign({}, x));
  const status = {};                       // 文件名 -> 在不在
  (d.status || []).forEach((s) => { status[s.file] = s; });
  const isExt = (f) => /^(https?:)?\/\//i.test(String(f || '').trim());

  const draw = () => {
    let h = '<h2 class="sec">音乐</h2>';
    h += '<p class="hint">侧栏最上面那条播放器。曲目对应 <code>data/music.toml</code>，' +
         '音频放在 <code>static/music/</code>。</p>';
    h += '<div class="note"><b>按住左侧的把手拖动</b>就是播放顺序，松手即保存，不用另点保存按钮。<br>' +
         '「上传音频」会把文件直接存进 <code>static/music/</code> 并自动加一条曲目 —— ' +
         '这是最省事的做法；已经手动拷进去的，把<b>文件名</b>（不带目录）填进第一列也行。<br>' +
         '也可以用外链：第一列直接写完整的 <code>https://</code> 地址。<br>' +
         '一首都没有时，侧栏那条播放器整个不显示。</div>';
    h += '<table class="grid"><thead><tr>' +
         '<th style="width:28px"></th>' +
         '<th style="width:30%">音频文件</th>' +
         '<th style="width:26%">曲名（可空）</th>' +
         '<th style="width:22%">作者 / 出处（可空）</th>' +
         '<th style="width:30px"></th></tr></thead><tbody id="tbMusic"></tbody></table>';
    h += '<div id="musicRows"></div>';
    h += '<p id="musicEmpty" class="hint">' + (items.length ? '' : '还没有曲目。点下面的「上传音频」或「＋ 手动加一条」开始。') + '</p>';
    h += '<button id="btnMusicUpload">' + ico('upload') + ' 上传音频</button> ';
    h += '<button id="btnMusicAdd"><img class="ico" src="/editor-icons/fugue/plus.png" alt="" draggable="false"> 手动加一条</button> ';
    h += '<button class="primary" id="btnMusicSave">' + ico('save') + ' 保存</button>';
    h += '<input type="file" id="musicFile" accept="audio/*,.mp3,.ogg,.m4a,.wav,.flac" multiple hidden>';
    showPanel(h);

    const tb = $('#tbMusic');
    items.forEach((it, i) => {
      const f = String(it.file || '').trim();
      const st = status[f];
      let badge = '';
      if (f) {
        if (isExt(f)) badge = '<span style="color:var(--dim)">外链</span>';
        else if (st && st.exists) badge = '<span style="color:#2e7d32">✓ 在位</span>';
        else badge = '<span style="color:var(--danger)">⚑ 找不到</span>';
      }
      const tr = document.createElement('tr');
      tr.draggable = true;
      tr.dataset.i = String(i);
      tr.innerHTML =
        `<td style="text-align:center"><span class="handle" style="cursor:grab"><img class="ico" src="/editor-icons/fugue/arrow-move.png" alt="" draggable="false"></span></td>` +
        `<td><input data-f="file" data-i="${i}" value="${esc(it.file || '')}" placeholder="iforest.mp3"></td>` +
        `<td><input data-f="title" data-i="${i}" value="${esc(it.title || '')}" placeholder="不填就显示文件名"></td>` +
        `<td><input data-f="artist" data-i="${i}" value="${esc(it.artist || '')}" placeholder="来源未知"></td>` +
        `<td style="text-align:center;white-space:nowrap">${badge}<br><button class="danger" data-del="${i}" title="删掉这条"><img class="ico" src="/editor-icons/fugue/cross.png" alt="" draggable="false"></button></td>`;
      tb.appendChild(tr);
    });

    const collect = () => {
      document.querySelectorAll('#tbMusic input[data-f]').forEach((el) => {
        if (items[+el.dataset.i]) items[+el.dataset.i][el.dataset.f] = el.value;
      });
    };
    document.querySelectorAll('#tbMusic [data-del]').forEach((b) => {
      b.addEventListener('click', () => { collect(); items.splice(+b.dataset.del, 1); draw(); });
    });
    $('#btnMusicAdd').addEventListener('click', () => {
      collect(); items.push({ file: '', title: '', artist: '' }); draw();
    });

    // 拖拽排序（和「侧栏排序」同一套做法）
    let drag = null;
    tb.addEventListener('dragstart', (e) => {
      const tr = e.target.closest('tr[data-i]');
      if (!tr) { e.preventDefault(); return; }
      drag = tr;
      tr.style.opacity = '.45';
      e.dataTransfer.effectAllowed = 'move';
      try { e.dataTransfer.setData('text/plain', tr.dataset.i); } catch (err) { /* 忽略 */ }
    });
    tb.addEventListener('dragover', (e) => {
      if (!drag) return;
      const tr = e.target.closest('tr[data-i]');
      if (!tr || tr === drag) return;
      e.preventDefault();
      const r = tr.getBoundingClientRect();
      tb.insertBefore(drag, e.clientY > r.top + r.height / 2 ? tr.nextSibling : tr);
    });
    tb.addEventListener('drop', (e) => { if (drag) e.preventDefault(); });
    tb.addEventListener('dragend', async () => {
      if (!drag) return;
      drag.style.opacity = '';
      drag = null;
      const order = [...tb.querySelectorAll('tr[data-i]')].map((tr) => +tr.dataset.i);
      const next = order.map((i) => items[i]);
      const changed = order.some((v, k) => v !== k);
      if (!changed) return;
      items.length = 0;
      items.push(...next);
      const saved = await saveMusic(items);
      if (saved) draw();
    });

    // 上传音频：读成 base64 -> /api/upload-audio -> 落进 static/music/ 并加一条
    $('#btnMusicUpload').addEventListener('click', () => $('#musicFile').click());
    $('#musicFile').addEventListener('change', async (e) => {
      const files = [...(e.target.files || [])];
      if (!files.length) return;
      collect();
      toast('正在上传 ' + files.length + ' 个音频…');
      for (const f of files) {
        try {
          const data = await new Promise((res, rej) => {
            const rd = new FileReader();
            rd.onload = () => res(rd.result);
            rd.onerror = () => rej(new Error('读文件失败'));
            rd.readAsDataURL(f);
          });
          const r = await apiPost('/api/upload-audio', { name: f.name, data });
          items.push({ file: r.file, title: '', artist: '' });
        } catch (err) {
          toast('「' + f.name + '」上传失败：' + err.message, 'err');
        }
      }
      e.target.value = '';
      await saveMusic(items);
      toast('已上传并加入曲单（刷新预览就能听到）', 'ok');
      openPanel('music');
    });

    $('#btnMusicSave').addEventListener('click', async () => {
      collect();
      const ok = await saveMusic(items);
      if (ok) toast('曲单已保存（预览里刷新一下就能听到）', 'ok');
    });
  };

  const saveMusic = async (list) => {
    try {
      const r = await apiPost('/api/list/music', {
        items: list.map((x) => ({
          file: String(x.file || '').trim(),
          title: String(x.title || '').trim(),
          artist: String(x.artist || '').trim(),
        })).filter((x) => x.file),
      });
      // 报「文件不在」的那些，现在就反映到状态角标上
      (r.status || []).forEach((s) => { status[s.file] = s; });
      return true;
    } catch (err) {
      toast('保存失败：' + err.message, 'err');
      return false;
    }
  };

  draw();
}

/* --- 宝可梦放养区：台词（data/pkmn-talk/<图鉴号>.toml） ---
   一只一个文件，每只二十来个池子（它自己的 7 个 + 页面 8 个 + 天气 7 个）。
   改完保存时会顺手跑 tools/build-pkmn.py --talk，重新生成页面真正读取的
   static/pkmn/talk/<图鉴号>.json。40 字上限和「至少留几句」都跟着
   build-pkmn.py 里的校验走：这里超了会变红，真拦下来的还是脚本那一步。 */
let PK = null;

async function renderPkmn() {
  const meta = await apiGet('/api/pkmn');
  if (!meta.items.length) {
    return showPanel('<h2 class="sec">宝可梦台词</h2><p class="hint">没读到 <code>data/pkmn-pool.toml</code>，或者名单是空的。</p>');
  }
  const dex = (PK && meta.items.some((x) => x.dex === PK.dex)) ? PK.dex : meta.items[0].dex;
  const d = await apiGet('/api/pkmn/' + dex);
  PK = {
    meta, dex,
    // 名单里有、台词文件还没生成的（比如刚往 pkmn-pool.toml 里加了新的一只）也要能打开
    name: d.name || (meta.items.find((x) => x.dex === dex) || {}).name || String(dex),
    header: d.header,
    pools: d.pools || {}, page: d.page || {}, weather: d.weather || {},
    order: d.order || null,
    groups: meta.groups,
  };
  PK.loaded = JSON.stringify(pkmnPayload());
  paintPkmn();
}

/** 面板上的当前内容，拼成要发给服务端的形状（顺序按池子定义，空串丢掉） */
function pkmnPayload() {
  const strip = (o, keys) => {
    const out = {};
    for (const [k] of keys) {
      out[k] = (o[k] || []).map((s) => String(s).trim()).filter(Boolean);
    }
    return out;
  };
  return {
    name: PK.name, header: PK.header, order: PK.order,
    pools: strip(PK.pools, PK.groups.pools),
    page: strip(PK.page, PK.groups.page),
    weather: strip(PK.weather, PK.groups.weather),
  };
}

/** 台词表：侧栏放养区那套和始祖小鸟页那套共用。
    st 是状态对象（PK / TBT），groupKey 是它上面那一层（都是 'pools' 之外还可能有 page/weather） */
function talkTable(st, groupKey, title, hint, keys, optional) {
  const arr = st[groupKey];
  let h = `<h3 class="pk-h">${esc(title)}`;
  if (hint) h += ` <span class="pk-sub">${esc(hint)}</span>`;
  h += '</h3>';
  h += '<table class="grid"><thead><tr><th>说的话（一句一行，别用引号括号 emoji）</th>'
     + '<th style="width:56px">字数</th><th style="width:38px"></th></tr></thead><tbody>';
  (keys || []).forEach(([k, label, min]) => {
    const list = arr[k] || [];
    list.forEach((s, i) => {
      const n = [...String(s)].length;
      h += `<tr><td><input class="pk-in" data-g="${groupKey}" data-k="${esc(k)}" value="${esc(s)}"></td>`
         + `<td class="pk-n${n > 40 ? ' bad' : ''}">${n}</td>`
         + `<td style="text-align:center"><button class="danger" data-del="${groupKey}:${esc(k)}:${i}"><img class="ico" src="/editor-icons/fugue/cross.png" alt="" draggable="false"></button></td></tr>`;
    });
    const opt = !!(optional && optional.has && optional.has(k));
    const rule = min ? (opt ? `可空；写了至少 ${min} 句` : `至少留 ${min} 句`) : '';
    h += `<tr><td colspan="3" class="pk-add"><span class="pk-sub">${esc(label)} · ${esc(k)}`
       + `${rule ? '：' + rule : ''}</span> `
       + `<button data-add="${groupKey}:${esc(k)}"><img class="ico" src="/editor-icons/fugue/plus.png" alt="" draggable="false"> 加一条</button></td></tr>`;
  });
  h += '</tbody></table>';
  return h;
}

/** 「宝可梦台词」面板顶上的来源切换：侧栏放养区 / 始祖小鸟页 */
function talkSourceBar(cur) {
  return '<div style="margin:0 0 12px">'
    + `<button class="${cur === 'pkmn' ? 'primary' : ''}" id="srcPkmn">侧栏放养区</button> `
    + `<button class="${cur === 'tbtak' ? 'primary' : ''}" id="srcTbtak">始祖小鸟页</button></div>`;
}

/** 保存按钮旁边那句：生成脚本能不能跑（python 太老 / 没装都会说清楚） */
function pythonHint(meta) {
  return meta && meta.pythonOk
    ? '（保存后会自动重跑生成脚本）'
    : '⚠ ' + esc((meta && meta.pythonNote) || '没找到 python：保存后不会重新生成 JSON');
}

function bindTalkSourceBar() {
  const a = document.getElementById('srcPkmn');
  if (a) a.addEventListener('click', () => renderPkmn());
  const b = document.getElementById('srcTbtak');
  if (b) b.addEventListener('click', () => renderTbtak());
}

function paintPkmn() {
  const it = PK.meta.items.find((x) => x.dex === PK.dex) || {};
  let h = '<h2 class="sec">宝可梦台词</h2>';
  h += talkSourceBar('pkmn');
  h += `<div class="note">这里是侧栏「宝可梦放养区」里每只宝可梦说的话，一只一个文件
    （<code>data/pkmn-talk/${PK.dex}.toml</code>）。改完点最下面的<b>保存并生成</b> ——

function bindPkmn() {
  const collect = () => {
    const out = { pools: {}, page: {}, weather: {} };
    document.querySelectorAll('#panel input[data-g]').forEach((el) => {
      const g = el.dataset.g, k = el.dataset.k;
      if (!out[g][k]) out[g][k] = [];
      out[g][k].push(el.value);
    });
    PK.pools = out.pools; PK.page = out.page; PK.weather = out.weather;
  };
  document.querySelectorAll('#panel .pk-in').forEach((el) => el.addEventListener('input', () => {
    const td = el.closest('tr').querySelector('.pk-n');
    const n = [...el.value].length;
    td.textContent = n;
    td.classList.toggle('bad', n > 40);
  }));
  document.querySelectorAll('#panel [data-del]').forEach((b) => b.addEventListener('click', () => {
    collect();
    const [g, k, i] = b.dataset.del.split(':');
    PK[g][k].splice(+i, 1);
    paintPkmn();
  }));
  document.querySelectorAll('#panel [data-add]').forEach((b) => b.addEventListener('click', () => {
    collect();
    const [g, k] = b.dataset.add.split(':');
    (PK[g][k] = PK[g][k] || []).push('');
    paintPkmn();
    const rows = document.querySelectorAll(`#panel input[data-k="${CSS.escape(k)}"]`);
    const last = rows[rows.length - 1];
    if (last) last.focus();
  }));
  $('#pkSel').addEventListener('change', async (e) => {
    collect();
    if (JSON.stringify(pkmnPayload()) !== PK.loaded &&
        !confirm('这一只还有没保存的改动，换过去就丢了。要继续吗？')) {
      e.target.value = String(PK.dex);
      return;
    }
    PK.dex = Number(e.target.value);
    const d = await apiGet('/api/pkmn/' + PK.dex);
    PK.name = d.name || (PK.meta.items.find((x) => x.dex === PK.dex) || {}).name || String(PK.dex);
    PK.header = d.header;
    PK.order = d.order || null;
    PK.pools = d.pools || {}; PK.page = d.page || {}; PK.weather = d.weather || {};
    PK.loaded = JSON.stringify(pkmnPayload());
    paintPkmn();
  });
  $('#btnSavePkmn').addEventListener('click', async () => {
    collect();
    const payload = pkmnPayload();
    const btn = $('#btnSavePkmn');
    btn.disabled = true;
    btn.textContent = '正在生成…';
    try {
      const r = await apiPost('/api/pkmn/' + PK.dex, payload);
      const log = $('#pkLog');
      log.hidden = false;
      log.textContent = (r.ok ? '✓ 已保存，并重新生成了页面用的 JSON\n\n'
                              : '✗ 文件存下了，但生成时报错（页面上的台词还是旧的那份）\n\n') + (r.log || '');
      log.style.color = r.ok ? '#1e8e3e' : '#c5221f';
      toast(r.ok ? '台词已保存并生成' : '保存了，但生成失败 —— 看面板下面的报错', r.ok ? 'ok' : 'err');
      const d = await apiGet('/api/pkmn/' + PK.dex);
      PK.pools = d.pools || {}; PK.page = d.page || {}; PK.weather = d.weather || {};
      PK.loaded = JSON.stringify(pkmnPayload());
    } finally {
      btn.disabled = false;
      btn.textContent = '保存并生成';
    }
  });
  bindTalkSourceBar();
}

const TBT = {};

async function renderTbtak() {
  let meta;
  try {
    meta = await apiGet('/api/tbtak');
  } catch (e) {
    return showPanel('<h2 class="sec">宝可梦台词</h2><p class="hint">读不到始祖小鸟页的台词：' + esc(e.message) + '</p>');
  }

      + '<p class="hint">没读到 <code>data/tbtak-talk/*.toml</code>。</p>');
  }
  const id = (TBT.id && meta.items.some((x) => x.id === TBT.id)) ? TBT.id : meta.items[0].id;
  const d = await apiGet('/api/tbtak/' + encodeURIComponent(id));

function tbtPayload() {
  const out = {};
  for (const [k] of TBT.groups) out[k] = (TBT.pools[k] || []).map((s) => String(s).trim()).filter(Boolean);
  return { id: TBT.id, name: TBT.name, header: TBT.header, pools: out };

       '友情链接和小按钮的内容在各自的面板里。</div>';
  h += '<ul id="sideOrder">';
  items.forEach((k) => {
    h += `<li draggable="true" data-key="${esc(k)}"><span class="handle"><img class="ico" src="/editor-icons/fugue/arrow-move.png" alt="" draggable="false"></span><span class="name">${esc(label[k] || k)}</span><code>${esc(k)}</code></li>`;
  });
  h += '</ul>';
  h += '<p class="hint">没列进去的挂件（比如以后新加的）会自动排在最后。</p>';
  showPanel(h);

  const ul = $('#sideOrder');
  let drag = null;
  ul.addEventListener('dragstart', (e) => {
    const li = e.target.closest('li[data-key]');
    if (!li) { e.preventDefault(); return; }
    drag = li;
    li.classList.add('dragging');
    e.dataTransfer.effectAllowed = 'move';
    try { e.dataTransfer.setData('text/plain', li.dataset.key); } catch (err) { /* 忽略 */ }
  });
  ul.addEventListener('dragover', (e) => {
    if (!drag) return;
    const li = e.target.closest('li[data-key]');
    if (!li || li === drag) return;
    e.preventDefault();
    const r = li.getBoundingClientRect();
    const after = e.clientY > r.top + r.height / 2;
    li.parentNode.insertBefore(drag, after ? li.nextSibling : li);
  });
  ul.addEventListener('drop', (e) => { if (drag) e.preventDefault(); });
  ul.addEventListener('dragend', async () => {
    if (!drag) return;
    drag.classList.remove('dragging');
    drag = null;
    const order = [...ul.querySelectorAll('li[data-key]')].map((li) => li.dataset.key);
    try {
      await apiPost('/api/sidebar', { order });
      toast('侧栏顺序已保存', 'ok');
    } catch (err) { toast('保存失败：' + err.message, 'err'); }
  });
}

/* ---------- 图片：拖拽 / 选择 / 粘贴 ---------- */
function isDraft(text) {
  const m = text.match(/^---\r?\n([\s\S]*?)\r?\n---/);
  return !!(m && /^draft:\s*true\s*$/m.test(m[1]));
}

function insertText(text) {
  const ta = $('#editor');
  if (ta.selectionStart === undefined) { ta.value += text; }
  else {
    const s = ta.selectionStart, e = ta.selectionEnd;
    ta.value = ta.value.slice(0, s) + text + ta.value.slice(e);
    ta.selectionStart = ta.selectionEnd = s + text.length;
  }
  ta.focus();
  setDirty(true);
}

/** 替换编辑区里 [s,e) 这一段，顺便把选区设成 [ss,se) */
function replaceRange(s, e, text, ss, se) {
  const ta = $('#editor');
  ta.value = ta.value.slice(0, s) + text + ta.value.slice(e);
  ta.focus();
  if (ss !== undefined) ta.setSelectionRange(ss, se === undefined ? ss : se);
  setDirty(true);
  updateFmtButtons();
}

/* ---------- 选中文字套格式（加粗 / 倾斜 / 心声） ----------
   正文里必须写标签：这些页面的正文是整段原生 HTML，Markdown 的
   **粗体** / *斜体* 在 HTML 块里不会被解析，只会原样显示成星号。 */
const FMT = {
  bold: { open: '<strong>', close: '</strong>' },
  italic: { open: '<i>', close: '</i>' },
  voice: { open: '<span class="inner-voice">', close: '</span>' },
};

function fmtRange(key) {
  const { open, close } = FMT[key];
  const ta = $('#editor');
  const s = ta.selectionStart, e = ta.selectionEnd;
  const v = ta.value;
  const sel = v.slice(s, e);
  // ① 选中的就是整对标签：<strong>x</strong> → 拆掉
  if (sel.length > open.length + close.length
      && sel.slice(0, open.length) === open && sel.slice(-close.length) === close) {
    const inner = sel.slice(open.length, sel.length - close.length);
    replaceRange(s, e, inner, s, s + inner.length);
    return;
  }
  // ② 标签紧贴在选区外侧：<strong>|x|</strong> → 拆掉
  if (s >= open.length && e + close.length <= v.length
      && v.slice(s - open.length, s) === open && v.slice(e, e + close.length) === close) {
    replaceRange(s - open.length, e + close.length, sel, s - open.length, e - open.length);
    return;
  }
  // ③ 其它情况：套上去。没选中就插一对空标签，光标停在中间
  replaceRange(s, e, open + sel + close, s + open.length, s + open.length + sel.length);
}

/** 光标正处在这对标签里时，把工具栏按钮点亮 */
function updateFmtButtons() {
  const ta = $('#editor');
  if (!ta || ta.selectionStart === undefined) return;
  const s = ta.selectionStart, e = ta.selectionEnd, v = ta.value;
  for (const [key, sel] of [['bold', '#btnBold'], ['italic', '#btnItalic'], ['voice', '#btnVoice']]) {
    const { open, close } = FMT[key];
    const on = (s >= open.length && v.slice(s - open.length, s) === open
                && v.slice(e, e + close.length) === close)
            || (v.slice(s, s + open.length) === open
                && v.slice(Math.max(s, e - close.length), e) === close);
    const btn = $(sel);
    if (btn) btn.classList.toggle('on', on);
  }
}

for (const [id, key] of [['#btnBold', 'bold'], ['#btnItalic', 'italic'], ['#btnVoice', 'voice']]) {
  $(id).addEventListener('click', () => {

/* ---------- 超链接 ----------
   正文是原生 HTML，所以链接要写成 <a href="...">文字</a>。
   三个常见需求：
     · 选中文字 → 包成链接
     · 选中的已经是链接 → 拆掉（再点一次就是取消）
     · 没选文字但有网址 → 用网址当文字
   地址栏记最近用过的 12 条，站内互相引用时不用每次手打。 */
const RANGE_OPEN = '<a href="', RANGE_CLOSE = '</a>';
const RECENT_LINKS_KEY = 'editor.recentLinks';

function recentLinks() {
  try { return JSON.parse(localStorage.getItem(RECENT_LINKS_KEY) || '[]'); } catch (e) { return []; }
}
function rememberLink(url) {
  const list = [url].concat(recentLinks().filter((x) => x !== url)).slice(0, 12);
  try { localStorage.setItem(RECENT_LINKS_KEY, JSON.stringify(list)); } catch (e) {}
}

function linkRange() {
  const ta = $('#editor');
  const s = ta.selectionStart, e = ta.selectionEnd;
  const v = ta.value;
  const sel = v.slice(s, e);

  // ① 选中的整段就是个链接 → 拆掉
  if (/^<a\s+href="[^"]*">[\s\S]*<\/a>$/.test(sel)) {
    const inner = sel.replace(/^<a\s+href="[^"]*">/, '').replace(/<\/a>$/, '');
    replaceRange(s, e, inner, s, s + inner.length);
    toast('已取消链接', 'ok');
    return;
  }
  // ② 光标紧贴在链接外侧 → 拆掉
  const before = v.slice(0, s);
  const m = before.match(/<a\s+href="[^"]*">$/);
  if (m && v.slice(e, e + RANGE_CLOSE.length) === RANGE_CLOSE) {
    const openStart = s - m[0].length;
    replaceRange(openStart, e + RANGE_CLOSE.length, sel, openStart, openStart + sel.length);
    toast('已取消链接', 'ok');
    return;
  }

  // ③ 问地址。记着最近用过的，常见情况点一下就完事。
  const recent = recentLinks();
  let hint = '地址（可以写 https://… 或站内路径 /blog/xxx/）';
  if (recent.length) hint += '\n\n最近用过：\n' + recent.slice(0, 5).join('\n');
  let url = window.prompt(hint, recent[0] || 'https://');
  if (url === null) return;
  url = url.trim();
  if (!url) return;
  // 光写域名的话补上 https://（站内路径以 / 开头，保持原样）
  if (!/^(https?:|\/|#|mailto:|\.\.?\/)/i.test(url)) url = 'https://' + url;

  const text = sel || url;
  const html = RANGE_OPEN + url + '">' + text + RANGE_CLOSE;
  replaceRange(s, e, html, s + RANGE_OPEN.length + url.length + 2, s + RANGE_OPEN.length + url.length + 2 + text.length);
  rememberLink(url);
  toast('已加链接：' + url, 'ok');
}

/* 上传图片的完整流程（正文插图 / 拖拽 / 选择都走这里）：
     ① 问一次：标题、简介、要不要同步进画廊（可设分类和封面）
     ② 逐张上传 —— 服务端会缩尺寸，并在原图旁边出一张 webp 兄弟
     ③ 插入 <picture>（有 webp 就用，老浏览器回落原图）
     ④ 勾了同步就把它们登记进 data/gallery.toml，并补一张缩略图

   「同步到画廊」**不复制文件**，只是登记一条指向它的记录：画廊本来就支持引用
   static/images 下任意位置的图（面板里的「选已有图」就是这么干的），复制一份
   只会让仓库里多出一份一模一样的字节。 */
function stemOf(name) {
  return String(name || '').replace(/^.*\//, '').replace(/\.[^.]+$/, '');
}

async function uploadImages(files) {
  const imgs = [...files].filter((f) => /^image\//.test(f.type));
  if (!imgs.length) { if (files.length) toast('只能上传图片文件', 'err'); return; }

  const one = imgs.length === 1;
  let secs = [];
  try {
    const d = await apiGet('/api/list/gallery');
    secs = (d.sections || []).map((s) => ({ v: s.id, t: s.name || s.id }));
  } catch { /* 读不到画廊分类就不问这一项 */ }

  const fields = [];
  if (one) {
    fields.push({ key: 'title', label: '标题', value: stemOf(imgs[0].name), ph: '留空就用文件名',
                  hint: '画廊里显示的名字；同时当作正文里的 alt' });
    fields.push({ key: 'desc', label: '简介', value: '', ph: '可选',
                  hint: '画廊点开大图时显示的那行说明' });
  }
  fields.push({ key: 'sync', label: '同步到画廊', type: 'checkbox', value: false,
                hint: one ? '在 /gallery/ 里也登记一张（不复制文件）'
                          : '标题先按文件名登记，之后可在「画廊」面板改' });
  if (secs.length) {
    fields.push({ key: 'cat', label: '画廊分类', type: 'select', value: secs[0].v, options: secs });
  }
  fields.push({ key: 'cover', label: '设为该分类封面', type: 'checkbox', value: false });

  const ans = await modal({
    title: one ? '插入图片' : `插入 ${imgs.length} 张图片`,
    okText: '上传并插入',
    fields,
    bind: () => {
      const cb = document.getElementById('mf_sync');
      if (!cb) return;
      const sync = () => {
        for (const k of ['cat', 'cover']) {
          const el = document.getElementById('mf_' + k);
          if (!el) continue;
          el.disabled = !cb.checked;
          const row = el.closest('.field');
          if (row) row.style.opacity = cb.checked ? '' : '.45';
        }
      };
      cb.addEventListener('change', sync);
      sync();
    },
  });
  if (!ans) return;                       // 取消 = 什么都不做

  const w = imgWidthValue();
  toast(`正在上传 ${imgs.length} 张图片…`);
  let out = '';
  const done = [];
  let bytesBefore = 0, bytesAfter = 0;
  try {
    for (const f of imgs) {
      const data = await new Promise((res, rej) => {
        const r = new FileReader();
        r.onload = () => res(r.result);
        r.onerror = rej;
        r.readAsDataURL(f);
      });
      const r = await apiPost('/api/upload', { name: f.name, data });
      const title = (one && ans.title) ? String(ans.title) : stemOf(f.name);
      const desc = one ? String(ans.desc || '') : '';
      out += makePicture(r.url, r.webp && r.webp.url, title, w) + '\n';
      done.push({ r, title, desc, name: f.name, big: f.size > 3 * 1024 * 1024 });
      bytesBefore += r.origBytes || 0;
      bytesAfter += r.bytes || 0;
    }
    insertText(out);

    let synced = 0, syncErr = '';
    if (ans.sync && done.length) {
      try { synced = await syncToGallery(done, { cat: ans.cat, cover: !!ans.cover }); }
      catch (e) { syncErr = e.message; }
    }

    const wtxt = w ? `宽度 ${w}${/%$/.test(w) ? '' : 'px'}` : '原尺寸';
    const bits = [`已插入 ${done.length} 张（${wtxt}）`];
    if (bytesBefore > bytesAfter) bits.push(`尺寸压缩省 ${Math.round(100 * (1 - bytesAfter / bytesBefore))}%`);
    const withWebp = done.filter((x) => x.r.webp).length;
    if (withWebp) bits.push(`${withWebp} 张带 webp 兄弟`);
    if (ans.sync) bits.push(synced ? `已登记进画廊 ${synced} 张` : '画廊里已经都有，没重复登记');
    if (syncErr) bits.push('画廊登记失败：' + syncErr);
    const big = done.filter((x) => x.big).length;
    if (big) bits.push(`有 ${big} 张超过 3 MB —— 仓库和读者都在为它买单`);
    toast(bits.join('，'), (syncErr || big) ? 'err' : 'ok');
  } catch (e) { toast('上传失败: ' + e.message, 'err'); }
}

/** 把刚上传的图登记进 data/gallery.toml（不复制文件），并补缩略图 */
async function syncToGallery(done, opts) {
  const d = await apiGet('/api/list/gallery');
  const sections = (d.sections || []).map((x) => Object.assign({}, x));
  const items = (d.items || []).map((x) => Object.assign({}, x));
  const have = new Set(items.map((it) => String(it.file || '')));
  const now = new Date();
  const date = `${now.getFullYear()}-${String(now.getMonth() + 1).padStart(2, '0')}-${String(now.getDate()).padStart(2, '0')}`;
  let added = 0;
  for (const x of done) {
    const file = x.r.imagesRel || '';
    if (!file || have.has(file)) continue;
    items.push({
      title: x.title || stemOf(x.name),
      file,
      cat: opts.cat || (sections[0] && sections[0].id) || '',
      date,
      desc: x.desc || '',
      cover: !!opts.cover && added === 0,     // 一类一个封面就够，只在第一张上打勾
    });
    have.add(file);
    added++;
  }
  if (!added) return 0;
  await apiPost('/api/list/gallery', {
    sections: sections.map((s) => ({ id: s.id, name: s.name, desc: s.desc })),
    items,
  });
  // 缩略图：直接往画廊传的时候服务端会顺手出；正文插图落在 static/images/，这里补一次
  const rels = done.map((x) => x.r.imagesRel).filter(Boolean);
  if (rels.length) await apiPost('/api/gallery/thumbs', { files: rels }).catch(() => {});
  return added;
}

/* ---------- 图片宽度 ----------
   站点里的写法：整数用 width="300"，百分比只能用 style="width:100%"
   （HTML 的 width 属性不接受 "100%" 这种值，写了会被浏览器直接忽略，
   之前迁移过来的图里就有 width="500px" / width=30% 这种没生效的）。
   宽度存在 localStorage，插图时自动带上。 */
function imgWidthValue() {
  const v = $('#imgWidthSel').value;
  if (v === 'custom') return localStorage.getItem('editor.imgWidth.custom') || '';
  return v;
}

function makeImg(url, alt, w) {
  const attrs = [`src="${url}"`, `alt="${alt}"`];
  if (w) attrs.push(/%$/.test(w) ? `style="width:${w}"` : `width="${w}"`);
  attrs.push('loading="lazy"');
  return `<img ${attrs.join(' ')} />`;
}

/* 插图两种写法：
     · 有 webp 兄弟（上传时服务端顺手出的）→ <picture>：支持 webp 的浏览器
       （97%+）只下 webp，老浏览器回落 <img src> 指的原图
     · 没有 → 就跟以前一样裸 <img>
   外面套一层 <p>：和站里既有内容一致，也让「段首缩进」的例外规则认得出来
   （retro.css / collection-css.html 里都有 p:has(> picture:first-child)）。 */
function makePicture(url, webpUrl, alt, w) {
  const img = makeImg(url, alt, w);
  if (!webpUrl) return img;
  return `<p><picture><source type="image/webp" srcset="${webpUrl}" />${img}</picture></p>`;
}

/** 改一个 <img> 标签上的宽度：两种写法都先清掉，再按需要写回去 */
function setImgWidth(tag, w) {
  let style = '';
  let t = tag.replace(/\s+style\s*=\s*(?:"([^"]*)"|'([^']*)')/gi, (m, a, b) => {
    style = a !== undefined ? a : (b || '');
    return '';
  });
  t = t.replace(/\s+width\s*=\s*(?:"[^"]*"|'[^']*'|[^\s>]+)/gi, '');
  const props = style.split(';').map((s) => s.trim()).filter((s) => s && !/^width\s*:/i.test(s));
  if (w && /%$/.test(w)) props.push(`width:${w}`);
  const extra = [];
  if (props.length) extra.push(`style="${props.join('; ')}"`);
  if (w && !/%$/.test(w)) extra.push(`width="${w}"`);
  const selfClose = /\/>\s*$/.test(t);
  t = t.replace(/\s*\/?>\s*$/, '');
  return t + (extra.length ? ' ' + extra.join(' ') : '') + (selfClose ? ' />' : '>');
}

/** 把当前宽度应用到选中的 <img>（可以一次选好几个） */
function applyWidthToSelection() {
  const ta = $('#editor');
  const s = ta.selectionStart, e = ta.selectionEnd;
  if (s === e) { toast('先在编辑区里选中包含 <img> 的一段文字', 'err'); return; }
  const sel = ta.value.slice(s, e);
  if (!/<img\b/i.test(sel)) { toast('选中的这段里没有 <img>', 'err'); return; }
  const w = imgWidthValue();
  let n = 0;
  const out = sel.replace(/<img\b[^>]*>/gi, (tag) => { n++; return setImgWidth(tag, w); });
  replaceRange(s, e, out, s, s + out.length);
  toast(`改了 ${n} 张图的宽度 → ${w ? w + (/%$/.test(w) ? '' : 'px') : '原尺寸'}`, 'ok');
}

$('#imgWidthSel').addEventListener('change', () => {
  if ($('#imgWidthSel').value !== 'custom') { localStorage.setItem('editor.imgWidth', $('#imgWidthSel').value); return; }
  const v = (prompt('想要多宽？填数字（像素），或者带 % 的百分比，比如 300 / 60%', '300') || '').trim();
  if (!/^\d+%?$/.test(v)) {
    toast('没填对，宽度得是数字或百分比', 'err');
    $('#imgWidthSel').value = localStorage.getItem('editor.imgWidth') || '';
    return;
  }
  localStorage.setItem('editor.imgWidth.custom', v);
  localStorage.setItem('editor.imgWidth', 'custom');
  const sel = $('#imgWidthSel');
  let op = sel.querySelector('option[data-custom]');
  if (!op) {
    op = document.createElement('option');
    op.dataset.custom = '1';
    sel.insertBefore(op, sel.querySelector('option[value="custom"]'));
  }
  op.value = v;
  op.textContent = `自定义 ${v}`;
  sel.value = v;
});

$('#btnApplyWidth').addEventListener('click', applyWidthToSelection);

/* 极简二选一对话框。站上别处没有这种需求，就不引库了。 */
function askChoice(title, hint, options) {
  return new Promise((resolve) => {
    const wrap = document.createElement('div');
    wrap.style.cssText = 'position:fixed;inset:0;z-index:400;display:flex;align-items:center;justify-content:center;background:rgba(12,24,40,.35)';
    const box = document.createElement('div');
    box.style.cssText = 'min-width:320px;padding:14px 16px;background:#fff;border:1px solid var(--line);border-radius:6px;box-shadow:0 6px 24px rgba(0,0,0,.2)';
    const h = document.createElement('div');
    h.style.cssText = 'font-weight:bold;margin-bottom:4px';
    h.textContent = title;
    const p = document.createElement('p');
    p.className = 'hint';
    p.style.margin = '0 0 10px';
    p.textContent = hint || '';
    box.append(h, p);
    options.forEach((o) => {
      const b = document.createElement('button');
      b.textContent = o.label;
      b.style.cssText = 'display:block;width:100%;margin-bottom:6px;text-align:left';
      b.addEventListener('click', () => { wrap.remove(); resolve(o.key); });
      box.appendChild(b);
    });
    const cancel = document.createElement('button');
    cancel.textContent = '取消';
    cancel.addEventListener('click', () => { wrap.remove(); resolve(null); });
    box.appendChild(cancel);
    wrap.appendChild(box);
    wrap.addEventListener('click', (e) => { if (e.target === wrap) { wrap.remove(); resolve(null); } });
    document.body.appendChild(wrap);
  });
}

/* ---------- 通用弹窗 ---------- */
function modal({ title, fields, okText = '确定', bind }) {
  return new Promise((resolve) => {
    $('#mTitle').textContent = title;
    $('#mBody').innerHTML = fields.map((f) => {
      const id = 'mf_' + f.key;
      if (f.type === 'checkbox') {
        return `<div class="field"><label>${esc(f.label)}</label>
          <input type="checkbox" id="${id}" ${f.value ? 'checked' : ''}>
          <span class="cmt">${esc(f.hint || '')}</span></div>`;
      }
      if (f.type === 'select') {
        return `<div class="field"><label>${esc(f.label)}</label>
          <select id="${id}">${f.options.map((o) =>
            `<option value="${esc(o.v)}"${o.v === f.value ? ' selected' : ''}>${esc(o.t)}</option>`).join('')}</select></div>`;
      }
      return `<div class="field"><label>${esc(f.label)}</label>
        <input type="text" id="${id}" value="${esc(f.value ?? '')}" placeholder="${esc(f.ph || '')}">
        <span class="cmt">${esc(f.hint || '')}</span></div>`;
    }).join('');
    $('#mOk').textContent = okText;
    $('#modal').hidden = false;
    if (bind) { try { bind(); } catch (e) { console.warn(e); } }

    const done = (v) => { $('#modal').hidden = true; resolve(v); };
    $('#mCancel').onclick = () => done(null);
    $('#mOk').onclick = () => {
      const out = {};
      for (const f of fields) {
        const el = document.getElementById('mf_' + f.key);
        out[f.key] = f.type === 'checkbox' ? el.checked : el.value.trim();
      }
      done(out);
    };
    $('#modal').onkeydown = (e) => {
      if (e.key === 'Escape') done(null);
      if (e.key === 'Enter' && e.target.tagName === 'INPUT') $('#mOk').click();
    };
    const first = $('#mBody input[type=text]');
    if (first) { first.focus(); first.select(); }
  });
}

/* ---------- 新建页面 ---------- */
function defaultNameTitle(kind) {
  const now = new Date();
  if (kind === 'niki') {
    const y = now.getFullYear(), m = now.getMonth() + 1;
    return { name: `niki_${y}${String(m).padStart(2, '0')}`, title: `${y}年${m}月日记` };
  }
  if (kind === 'blog') return { name: 'new-post', title: '新文章' };
  if (kind === 'collection') return { name: 'new-piece', title: '新篇目' };
  return { name: 'new-page', title: '新页面' };
}

async function newPage() {
  const d0 = defaultNameTitle('niki');
  const res = await modal({
    title: '新建页面',
    okText: '创建',
    // 换类型时把文件名/标题的默认值也跟着换（不然选了「博客」还留着 niki_202609）
    bind() {
      const sel = $('#mf_kind');
      if (!sel) return;
      sel.addEventListener('change', () => {
        const d = defaultNameTitle(sel.value);
        $('#mf_name').value = d.name;
        $('#mf_title').value = d.title;
      });
    },
    fields: [
      { key: 'kind', type: 'select', label: '类型', value: 'niki', options: [
        { v: 'niki', t: '日记（挂到导航页，不进博客列表）' },
        { v: 'blog', t: '博客文章' },
        { v: 'collection', t: '文集（绿色主题那个页面，小说 / 随感 / 杂笔）' },
        { v: 'page', t: '独立单页' },
      ] },
      { key: 'name', type: 'text', label: '文件名', value: d0.name, hint: '英文/数字/下划线，不用写 .md' },
      { key: 'title', type: 'text', label: '标题', value: d0.title },
      { key: 'date', type: 'text', label: '日期', value: new Date().toISOString().slice(0, 10), hint: 'YYYY-MM-DD' },
      { key: 'asDraft', type: 'checkbox', label: '先存为草稿', value: true, hint: '写完在工具栏一键发布' },
    ],
  });
  if (!res) return;
  try {
    const r = await apiPost('/api/new', res);
    await bootstrap();
    document.body.classList.remove('panel');
    markActive(null);
    await openFile(r.p);
    let msg = '已创建 ' + r.p + (res.asDraft ? '（草稿）' : '');
    if (res.kind === 'niki') msg += '，日历会自动收录';
    toast(msg, 'ok');
  } catch (e) { toast('创建失败: ' + e.message, 'err'); }
}

/* ---------- 文集：分册 + 文章归属 + 标签 ---------- */
/* 分册表写 data/collection_books.toml；文章的归属写在各自的 front matter
   （book / essay / weight / r18 / collection_tags）。保存时两边一起写。 */
async function renderCollection() {
  const d = await apiGet('/api/collection');
  renderCollectionWith(d.books.map((x) => Object.assign({}, x)), d.articles.map((x) => Object.assign({}, x)));
}

function renderCollectionWith(books, articles) {
  let h = '<h2 class="sec">文集</h2>';
  h += `<div class="note">
    上部是<b>分册表</b>（<code>data/collection_books.toml</code>），下部是<b>每篇的归属</b>
    （写进文章 front matter 的 <code>book</code> / <code>essay</code> / <code>weight</code> /
    <code>r18</code> / <code>collection_tags</code>）。改完点<b>保存</b>，两边一起写。
    <br>· 一册里还没有章节时，目录页会跳过它（不显示空框）。
    <br>· 勾了「随感」就不进册，目录页单独一组。
    <br>· <b>weight</b> 是册内章节顺序，小的在前；留空就按日期。
    <br>· <b>R18</b>：勾在册上 = 整册标红；勾在文章上 = 单篇标红。目录页顶部会出提示条。
    <br>· 标签是独立的一套，term 页在 <code>/collection_tags/</code>，不会混进主站的 /tags/。
  </div>`;

  h += '<h3 style="font-size:13px;color:#44586e">分册</h3>';
  h += '<table class="grid"><thead><tr><th style="width:90px">id</th><th>书名</th><th style="width:104px">状态</th>'
     + '<th style="width:46px">R18</th><th style="width:66px">排序</th><th>简介</th><th style="width:36px"></th></tr></thead><tbody id="tbBooks">';
  books.forEach((b, i) => {
    h += `<tr>
      <td><input data-bf="id" data-i="${i}" value="${esc(b.id || '')}" style="width:80px"></td>
      <td><input data-bf="title" data-i="${i}" value="${esc(b.title || '')}"></td>
      <td><input data-bf="status" data-i="${i}" value="${esc(b.status || '')}" list="collStatus" style="width:96px"></td>
      <td style="text-align:center"><input type="checkbox" data-bf="r18" data-i="${i}"${b.r18 ? ' checked' : ''}></td>
      <td><input data-bf="order" data-i="${i}" value="${esc(b.order === undefined ? '' : String(b.order))}" style="width:56px"></td>
      <td><input data-bf="desc" data-i="${i}" value="${esc(b.desc || '')}"></td>
      <td style="text-align:center"><button class="danger" data-bdel="${i}"><img class="ico" src="/editor-icons/fugue/cross.png" alt="" draggable="false"></button></td></tr>`;
  });
  h += '</tbody></table>';
  h += '<datalist id="collStatus"><option value="连载中"></option><option value="已完结"></option><option value="停止更新"></option></datalist>';
  h += '<button id="btnAddBook"><img class="ico" src="/editor-icons/fugue/plus.png" alt="" draggable="false"> 加一册</button>';

  h += '<h3 style="font-size:13px;color:#44586e;margin-top:22px">文章归属</h3>';
  if (!articles.length) {
    h += '<p class="hint">文集里还没有文章。先用「<img class="ico" src="/editor-icons/fugue/plus.png" alt="" draggable="false">新建页面」建一篇，类型选「文集」。</p>';
  } else {
    h += '<table class="grid"><thead><tr><th>文章</th><th style="width:180px">属于哪一册</th>'
       + '<th style="width:56px">随感</th><th style="width:46px">R18</th><th style="width:70px">weight</th>'
       + '<th style="width:190px">标签（逗号分隔）</th></tr></thead><tbody id="tbArts">';
    articles.forEach((a, i) => {
      let opts = `<option value=""${a.book ? '' : ' selected'}>（未归类）</option>`;
      for (const b of books) {
        opts += `<option value="${esc(b.id || '')}"${a.book === b.id ? ' selected' : ''}>${esc(b.title || b.id || '（没书名）')}</option>`;
      }
      h += `<tr>
        <td><b>${esc(a.title)}</b>${a.draft ? ' <span style="color:#b45309">[草稿]</span>' : ''}
            <br><span style="color:#7b8794;font-size:11px">${esc(a.file)}</span></td>
        <td><select data-af="book" data-i="${i}">${opts}</select></td>
        <td style="text-align:center"><input type="checkbox" data-af="essay" data-i="${i}"${a.essay ? ' checked' : ''}></td>
        <td style="text-align:center"><input type="checkbox" data-af="r18" data-i="${i}"${a.r18 ? ' checked' : ''}></td>
        <td><input data-af="weight" data-i="${i}" value="${esc(a.weight)}" style="width:56px"></td>
        <td><input data-af="tags" data-i="${i}" value="${esc((a.tags || []).join(', '))}"></td></tr>`;
    });
    h += '</tbody></table>';
  }
  h += '<div style="margin-top:14px"><button class="primary" id="btnSaveCollection">保存</button></div>';
  showPanel(h);

  const collectBooks = () => {
    document.querySelectorAll('#tbBooks [data-bf]').forEach((el) => {
      const i = +el.dataset.i, f = el.dataset.bf;
      books[i][f] = el.type === 'checkbox' ? el.checked : el.value;
    });
    return books;
  };
  const collectArticles = () => {
    document.querySelectorAll('#tbArts [data-af]').forEach((el) => {
      const i = +el.dataset.i, f = el.dataset.af;
      const v = el.type === 'checkbox' ? el.checked : el.value;
      if (f === 'tags') articles[i].tags = String(v).split(/[,，]/).map((s) => s.trim()).filter(Boolean);
      else articles[i][f] = v;
    });
    return articles;
  };

  document.querySelectorAll('#tbBooks [data-bdel]').forEach((btn) => btn.addEventListener('click', () => {
    collectBooks(); books.splice(+btn.dataset.bdel, 1); renderCollectionWith(books, articles);
  }));
  const addBtn = $('#btnAddBook');
  if (addBtn) addBtn.addEventListener('click', () => {
    collectBooks();
    books.push({ id: '', title: '', status: '连载中', r18: false, order: (books.length + 1) * 10, desc: '' });
    renderCollectionWith(books, articles);
  });
  const saveBtn = $('#btnSaveCollection');
  if (saveBtn) saveBtn.addEventListener('click', async () => {
    try {
      await apiPost('/api/collection/books', { books: collectBooks() });
      const r = await apiPost('/api/collection/articles', { articles: collectArticles() });
      const n = (r && r.rescued ? r.rescued.length : 0);
      toast(n ? `文集已保存（${n} 篇正文里漏出的字段已收回 front matter）` : '文集已保存', 'ok');
      await renderCollection();
    } catch (e) { toast('保存失败: ' + e.message, 'err'); }
  });
}

/* ---------- 启动 ---------- */
let BOOTED = false;
const PANELS = ['settings', 'collection', 'links', 'buttons', 'scripts', 'nav', 'pkmn', 'diancie', 'board'];

/** 恢复上次用的图片宽度、给顶栏的新建按钮接线 */
function initToolbar() {
  // macOS 上快捷键是 ⌘ 不是 Ctrl，按钮提示跟着换（代码里两种都认）
  const isMac = /Mac|iPhone|iPad|iPod/.test(navigator.platform || navigator.userAgent || '');
  if (isMac) {
    const mod = '⌘';
    $('#btnSave').title = mod + 'S';
    $('#btnBold').title = '加粗（' + mod + 'B）';
    $('#btnItalic').title = '倾斜（' + mod + 'I）';
  }

  const saved = localStorage.getItem('editor.imgWidth') || '';
  const sel = $('#imgWidthSel');
  if (saved && saved !== 'custom' && /^\d+%$/.test(saved)) {
    const op = document.createElement('option');
    op.dataset.custom = '1';
    op.value = saved;
    op.textContent = `自定义 ${saved}`;
    sel.insertBefore(op, sel.querySelector('option[value="custom"]'));
  }
  if (saved && [...sel.options].some((o) => o.value === saved)) sel.value = saved;
  $('#btnNewTop').addEventListener('click', () => newPage());
}

async function bootstrap() {
  const d = await apiGet('/api/bootstrap');
  TREE = d.tree;
  PREVIEW_URL = d.previewUrl;
  LIVE_URL = d.liveUrl || '';
  renderTree();
  if (CUR) {
    const r = document.querySelector(`.row[data-file="${CSS.escape(CUR)}"]`);
    markActive(r);        // 顺手展开它所在的那一组（见 unfoldGroupOf）
  }
  // 首次打开时按地址栏的 #锚点 直达：
  //   #settings / #links / #buttons / #scripts / #nav   打开工具面板
  //   #preview                                          进预览模式
  //   #f=content/niki/niki_202602.md&preview             打开某个文件并预览它
  if (!BOOTED) {
    BOOTED = true;
    const raw = decodeURIComponent(location.hash.replace(/^#/, ''));
    if (raw.startsWith('f=')) {
      const hp = new URLSearchParams(raw);
      const file = hp.get('f');
      const row = file && document.querySelector(`.row[data-file="${CSS.escape(file)}"]`);
      if (row) row.click();
      if (hp.has('preview')) setTimeout(() => { if (!document.body.classList.contains('preview')) $('#btnPreview').click(); }, 500);
    } else if (PANELS.includes(raw)) {
      const row = document.querySelector(`.row[data-panel="${raw}"]`);
      if (row) row.click();
    } else if (raw === 'preview') {
      $('#btnPreview').click();
    }
  }
}
/* 页面自身的载入时间：用来判断磁盘上的 ui.html 是不是比这个页面新 */
const PAGE_LOADED_AT = Date.now();

function fmtClock(ms) {
  const d = new Date(ms);
  const p = (n) => String(n).padStart(2, '0');
  return `${d.getMonth() + 1}-${p(d.getDate())} ${p(d.getHours())}:${p(d.getMinutes())}`;
}

/* 编辑器自己有没有新版本可用。

   背景（站长反馈「pull 下来编辑器也不会更新新功能」）：
     · ui.html  每次请求现读 -> 刷新页面就能拿到新的
     · server.mjs 是**进程启动时加载的** -> 不重启就永远是旧代码
   所以这里同时看两件事，分别给不同的按钮：
     磁盘上的 server.mjs 比进程新 -> 需要「重启编辑器」
     磁盘上的 ui.html 比本页面新   -> 只需要「刷新页面」 */
function showStaleBar(kind) {
  const bar = $('#staleBar');
  if (!bar) return;
  const txt = $('#staleText');
  const btn = $('#btnStaleAct');
  if (kind === 'server') {
    txt.textContent = '编辑器后端已更新（拉到了新代码）—— 现在跑的还是旧的，点右边重启一下就生效。';
    btn.textContent = '重启编辑器';
    btn.dataset.act = 'restart';
  } else {
    txt.textContent = '编辑器界面已更新 —— 刷新一下页面就能用上新功能。';
    btn.textContent = '刷新页面';
    btn.dataset.act = 'reload';
  }
  bar.hidden = false;
}

async function checkEditorVersion() {
  let v;
  try { v = await apiGet('/api/version'); } catch { return; }
  if (!v || !v.startedAt) return;
  // 容 2 秒的误差（同一次 pull 里两个文件的时间戳会很接近）
  if (v.serverFileAt && v.serverFileAt > v.startedAt + 2000) return showStaleBar('server');
  if (v.uiFileAt && v.uiFileAt > PAGE_LOADED_AT + 2000) return showStaleBar('ui');
}

$('#btnStaleClose').addEventListener('click', () => { $('#staleBar').hidden = true; });

$('#btnStaleAct').addEventListener('click', async () => {
  const btn = $('#btnStaleAct');
  if (btn.dataset.act !== 'restart') { location.reload(); return; }
  const txt = $('#staleText');
  btn.disabled = true;
  txt.textContent = '正在重启编辑器…（start.cmd / start.command 会把它重新拉起来）';
  try { await apiPost('/api/restart', {}); } catch (e) { /* 进程要退了，请求可能直接断，正常 */ }
  // 轮询到它重新起来为止，然后刷新页面（这样拿到的 ui.html 也是新的）
  let tries = 0;
  const tick = async () => {
    tries += 1;
    try {
      await apiGet('/api/version');
      location.reload();
      return;
    } catch (e) { /* 还没起来 */ }
    if (tries > 40) {
      txt.textContent = '等不到编辑器重新启动 —— 请关掉这个窗口，重新运行 .editor\\start.cmd（macOS/Linux 是 start.command）。';
      btn.disabled = false;
      return;
    }
    setTimeout(tick, 500);
  };
  setTimeout(tick, 700);
});

/* 从别的窗口 pull 完回来时也检查一次 */
window.addEventListener('focus', () => {
  if ($('#staleBar') && $('#staleBar').hidden) checkEditorVersion();
});

initToolbar();
bootstrap().catch((e) => toast('初始化失败: ' + e.message, 'err'));
checkEditorVersion();

/* 开机先跟线上对一次账：
   · 本机干净、也没欠着没推的提交 → 自动把线上的改动拉下来（换电脑编辑就不用管了）
   · 有本地提交没推上去 → 提示一句（多半是上次推送失败）
   · 有没提交的改动 → 不动，交给「发布」 */
async function checkRemote() {
  let g;
  try { g = await apiGet('/api/git'); } catch { return; }
  if (g.behind === null || g.behind === undefined) return;
  if (g.behind > 0 && !g.status.length && !g.ahead) { await syncPull(true); return; }
  if (g.ahead > 0) {
    toast(`本地有 ${g.ahead} 个提交还没推上去（上次推送大概失败了）—— 点「发布」重推`, 'err');
  } else if (g.behind > 0) {
    toast(`线上有 ${g.behind} 个新提交 —— 点「拉取线上」同步`, 'err');
  }
}
setTimeout(checkRemote, 1200);
</script>
