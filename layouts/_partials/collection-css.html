{{/* ==========================================================================
     文集的版式 —— 绿色主题

     为什么放在短代码里、而不是直接写在页面正文或 retro.css：
       · 写在正文里不行：Hugo 的 markdown 遇到空行就结束 HTML 块，
         <style> 中间留空行会让后半段 CSS 变成可见的 <pre>（Tbtak 那页踩过）
       · 放在 retro.css 里要处处加 :not(.theme-collection)，反而更容易漏
     短代码的输出不经过 markdown，而且只有调用它的页面加载这段样式。

     选择器为什么一律带 #collection-scope 前缀：
     全站点阵字体那条规则是 `html.pxfont body * { font-size: … !important }`，
     通配符 + !important，只有 ID 选择器才压得住（Tbtak 那页同理）。
     ========================================================================== */}}
<style>
/* ---------- 1. 整页换成绿色主题 ---------- */
body.theme-collection {
  background-color: #eaf3e6 !important;
  background-image: repeating-linear-gradient(
    0deg, rgba(122,168,116,.10) 0 1px, transparent 1px 12px),
    repeating-linear-gradient(90deg, rgba(122,168,116,.10) 0 1px, transparent 1px 12px) !important;
}

/* 版心：白底改成带一点绿的白。
   ⚠️ 版心底纹原本是 static/images/bg-tile.png（8×8 的蓝色网格图）叠在白色上 ——
   只改 background-color 是压不住图片的（一开始就漏了这点，左侧空档还是蓝的）。
   这里把那张图换掉，用同尺寸（8×8：底色 + 1px 网格线）的绿色渐变重画一遍，
   偏移量沿用原来的 -4px -4px，否则版心内侧第一列会正好压在网格线上。 */
body.theme-collection #page {
  background-color: #f2f8ef !important;
  background-image:
    repeating-linear-gradient(90deg,  #c2dcba 0 1px, transparent 1px 8px),
    repeating-linear-gradient(0deg,   #c2dcba 0 1px, transparent 1px 8px) !important;
  background-repeat: repeat, repeat !important;
  background-position: -4px -4px, -4px -4px !important;
  border-color: #b6d3ae !important;
  box-shadow: 4px 4px 0 #cfe3c9 !important;
}

/* 框：标题条换成绿色渐变，边框换绿 */
body.theme-collection .box,
body.theme-collection .widget {
  border-color: #b6d3ae !important;
}

body.theme-collection .box-title,
body.theme-collection .widget-title {
  color: #23491f !important;
  background: linear-gradient(#dcebd6, #bcd8b3) !important;
  border-bottom-color: #a8cba0 !important;
  text-shadow: 1px 1px 0 #ffffff !important;
}

body.theme-collection .widget-title { background: linear-gradient(#e2efdd, #c6ddbe) !important; }

/* 挂件正文底、正文小标题这些原来也是蓝的，一起换绿 */
body.theme-collection .widget-body { background: #f6fbf4 !important; }

body.theme-collection .entry-content h1,
body.theme-collection .entry-content h2,
body.theme-collection .entry-content summary { color: #23491f !important; }

body.theme-collection .entry-content h3 { color: #2f6b33 !important; }
body.theme-collection .entry-content h4 { color: #4c664a !important; }

body.theme-collection .entry-content details {
  background: #f6fbf4 !important;
  border-color: #9dc294 !important;
  border-left-color: #2f6b33 !important;
}

body.theme-collection .entry-content details[open] summary { border-bottom-color: #c2dcba !important; }

/* 链接、标签、按钮换成绿系 */
body.theme-collection a { color: #2f6b33 !important; }
body.theme-collection a:hover { color: #1f4d24 !important; }
body.theme-collection .tag-item { color: #2f6b33 !important; border-color: #b6d3ae !important; }
body.theme-collection .action-btn { color: #23491f !important; border-color: #9dc294 !important; background: #eaf3e6 !important; }
body.theme-collection .action-btn:hover { background: #d7e9d0 !important; }

/* ---------- 1b. 页头 / 导航栏 / 公告条 / 页脚也换绿 ----------
   这一块一开始漏了：只改了版心、框和链接，结果页头和导航还是蓝的，
   整页看着不像绿色主题。下面按原来的分层结构（高光带 + 两套斜纹 + 底色渐变）
   原样重画成绿系，只是把颜色换掉，版式一个字没动。 */
body.theme-collection #header {
  background-color: #2f6b3a !important;
  background-image:
    linear-gradient(180deg,
      rgba(255,255,255,.30) 0,
      rgba(255,255,255,.09) 34px,
      rgba(255,255,255,0)   35px,
      rgba(0,0,0,.14)       112px,
      rgba(0,0,0,.32)       118px),
    repeating-linear-gradient(90deg,
      rgba(255,255,255,.07) 0 2px,
      rgba(255,255,255,0)   2px 29px),
    repeating-linear-gradient(115deg,
      rgba(255,255,255,.11) 0 5px,
      rgba(255,255,255,0)   5px 13px),
    linear-gradient(180deg, #6aa86e 0, #2f6b3a 55%, #1c4526 100%) !important;
  border-bottom-color: #ff9900 !important;
}

body.theme-collection .site-name {
  text-shadow: 2px 2px 0 #16351d, -1px -1px 0 #a9d3a4, 0 0 10px rgba(255,255,255,.45) !important;
}

body.theme-collection .site-slogan { color: #dff0da !important; }

body.theme-collection #navbar {
  background: #1f4d29 !important;
  border-top-color: #8cc287 !important;
  border-bottom-color: #0f2c16 !important;
}

body.theme-collection #navbar .nav li a {
  color: #dcefd8 !important;
  border-right-color: #3d7f4a !important;
  border-left-color: #0f2c16 !important;
}

body.theme-collection #navbar .nav li a:hover { background: #3d7f4a !important; color: #ffffff !important; }

/* 当前页那栏保持那个橙色高亮 —— 它是全站的强调色，和绿底对比更清楚 */
body.theme-collection #navbar .nav li.active a {
  background: #ff9900 !important;
  color: #ffffff !important;
  border-right-color: #b36b00 !important;
  border-left-color: #ffcc66 !important;
}

/* 公告条：淡黄底和红标签是「公告」的语义色，只把边线和文字调成配绿的暖色 */
body.theme-collection #notice {
  background: #f6f7dd !important;
  border-bottom-color: #b9a24a !important;
  color: #b23b2e !important;
}

body.theme-collection #footer {
  background: #eef6ec !important;
  border-top-color: #7fae7a !important;
}

/* ---------- 2. 版式：这一页读起来更宽 ---------- */
/* 原来正文 656 / 侧栏 300。
   文集只留两个挂件，所以侧栏压到 190、正文加宽到 790 ——
   ⚠️ 两者之和必须 ≤ #main 的内宽 984（= 版心 1000 − padding 8×2）。
   一开始写的 830+160=990 超了 6px，CSS 就把右浮动的侧栏整个挤到正文下面；
   160 又太窄、把侧栏里的播放器挤到换行，所以取 190 + 790 = 980，留 4px 余量。

   ⚠️ 这两条宽度只在「两栏并列」时才成立，所以必须限定在桌面断点内。
   retro.css 用 @media (max-width: 1004px) 把 #content / #sidebar 改成
   float:none; width:auto 的单栏堆叠，但这里的 !important 优先级更高，
   不限定断点就会把宽度顶回 790 / 190 —— 手机上正文仍按 790px 排
   （比视口宽一倍），整页横向溢出：标题、导航、正文、页脚右边全被截掉，
   侧栏又只剩 190px。断点与 retro.css 取同一处，补集就是 min-width:1005px。 */
@media (min-width: 1005px) {
  body.theme-collection #content { width: 790px !important; }
  body.theme-collection #sidebar { width: 190px !important; }
}

/* 侧栏窄了，时钟和播放器跟着收一点，别撑破 */
body.theme-collection #sidebar .retro-clock { font-size: 20px !important; }

/* 正文行高取**整数 px**（这里是基础字号的两倍 = 24px）。
   站里的硬规矩是「字号 × DPR = 12 的整数倍」（见 retro.css 的 pxfont 那一段），
   字号和 letter-spacing 都受这条约束。行高虽然没写进规矩，但非整数行高会把
   基线推到半个设备像素上、让整行字发灰 —— 原来写的 1.85（12px → 22.2px）就是
   这种情况；而 calc(--px * 1.9) 算出来 22.8px 也不是整数，别被它骗了。
   干脆写 2 倍：24px，整数，且阅读上更松快（这个 section 是给人读小说的）。 */
body.theme-collection .entry-content { line-height: 2 !important; }
body.theme-collection .entry-content p { margin-bottom: 0.8em !important; }

/* ---------- 3. 文末：写作时间 / 作者简介 / 点评 ---------- */
body.theme-collection .entry-foot {
  margin-top: 26px;
  padding-top: 10px;
  border-top: 1px dashed #b6d3ae;
}

body.theme-collection .entry-foot-meta {
  color: #5b7358;
  text-align: right;
}

body.theme-collection .foot-label { color: #7d9579; }
body.theme-collection .foot-value { color: #23491f; letter-spacing: 0; }

/* 文末那张作者卡做成一个独立的 box（和「始祖小鸟」底部那几块同一个排法），
   里面横排：头像在左、文字在右 */
body.theme-collection .box-blizzer .box-body { padding: 12px 14px; }

body.theme-collection .blizzer-card {
  display: flex;
  gap: 14px;
  align-items: flex-start;
}

body.theme-collection .blizzer-avatar {
  flex: 0 0 auto;
  width: 76px;
  height: 76px;
  border: 1px solid #a8cba0;
  background: #ffffff;
  image-rendering: pixelated;
}

body.theme-collection .blizzer-text { min-width: 0; }

body.theme-collection .blizzer-name {
  margin: 2px 0 6px;
  color: #23491f;
  font-size: var(--px-lg, 15px) !important;
}

body.theme-collection .blizzer-desc {
  margin: 0;
  color: #4c664a;
  line-height: 1.8 !important;
}

/* 点评那一块 */
body.theme-collection .box-review .comments-tip { color: #5b7358; }

/* ---------- 4. 左下角水印 ---------- */
/* 固定定位、不吃鼠标事件、低透明度 —— 只做装饰，不挡阅读。
   宽度用 vmin 跟着窗口走，小屏也不会盖住正文。 */
.collection-watermark {
  position: fixed;
  left: 0;
  bottom: 0;
  z-index: 5;
  pointer-events: none;
  line-height: 0;
  opacity: .34;
}

.collection-watermark img {
  width: clamp(90px, 15vmin, 190px);
  height: auto;
  display: block;
}

/* 窗口很窄时（手机）再淡一点，别和正文抢注意力 */
@media (max-width: 820px) {
  .collection-watermark { opacity: .22; }
  .collection-watermark img { width: clamp(64px, 22vmin, 110px); }
}

/* ---------- 5. 正文排版：粘贴稿直接成型 ---------- */
/* 目标：从别处复制来的稿子，粘进来就是成品，不用手工分段、也不用打空两格。
   分段那半边在 layouts/_partials/collection-body.html（把「一段一行」的稿子
   按换行拆成独立 <p>），这里只管两件 CSS 的事：

   ① 首行缩进两格。用 text-indent，而不是让作者手打「　　」——
      粘贴稿里手打的空两格会被 collection-body 去掉（否则缩成四格）。
   ② 长串自动换行。overflow-wrap:anywhere 兜住没有空格的超长串
      （URL、连写的拉丁文、连续数字）；中文本来就能逐字断行。

   ⚠️ 图片段要豁免缩进：Hugo 默认把独占一行的图片包成 <p><img></p>，
      连它一起缩进的话图片会整体右移两格。:has() 现在的浏览器都支持；
      万一不支持，最坏也只是图片右移两格，不影响阅读。 */
body.theme-collection .entry-content p {
  text-indent: 2em !important;
  overflow-wrap: anywhere !important;
  word-break: break-word;
}

body.theme-collection .entry-content p:has(> img:only-child) { text-indent: 0 !important; }

/* 原生整块 HTML（<center> 包的图注之类）也一起自动换行 */
body.theme-collection .entry-content { overflow-wrap: anywhere; }

/* ---------- 6. 文集目录页 ---------- */
body.theme-collection .collection-list {
  margin: 14px 0 0;
  padding: 0;
  list-style: none;
}

body.theme-collection .collection-item {
  padding: 7px 0;
  border-bottom: 1px dotted #cfe3c9;
}

body.theme-collection .ci-date {
  display: inline-block;
  width: 82px;
  color: #7d9579;
}

body.theme-collection .ci-title { font-size: var(--px-lg, 15px) !important; }

body.theme-collection .ci-desc {
  display: block;
  margin: 2px 0 0 82px;
  color: #5b7358;
  font-size: var(--px-sm, 11px) !important;
}

body.theme-collection .collection-empty { color: #7d9579; }

/* ---------- 7. 分册：一册一个框 ---------- */
/* 每一册就是一个 <details class="box">，标题条借用站里现成的 .box-title 外观，
   所以看起来和「作者简介」那些框是一套；只是标题条本身可点。 */
body.theme-collection .book-box { margin-bottom: 8px; }

body.theme-collection .book-head {
  cursor: pointer;
  list-style: none;              /* 去掉 <summary> 自带的三角 */
  display: flex;
  align-items: center;
  gap: 6px;
  user-select: none;
}

body.theme-collection .book-head::-webkit-details-marker { display: none; }

/* 自己画一个小三角：关着朝右、展开转成朝下 */
body.theme-collection .book-caret {
  flex: 0 0 auto;
  width: 0;
  height: 0;
  border-left: 5px solid #2f6b3a;
  border-top: 4px solid transparent;
  border-bottom: 4px solid transparent;
  transition: transform .12s linear;
}

body.theme-collection details[open] > .book-head .book-caret { transform: rotate(90deg); }

body.theme-collection .book-count {
  margin-left: auto;             /* 章数推到最右 */
  flex: 0 0 auto;
  color: #5b7358;
  font-size: var(--px-sm, 11px) !important;
}

body.theme-collection .book-desc { margin: 0 0 8px; color: #5b7358; }
body.theme-collection .book-body { padding-top: 10px; }
body.theme-collection .book-body .collection-list { margin-top: 0; }

/* 随感 / 未归类 两个框换个标题条配色，好和「书」区分开 */
body.theme-collection .essay-box > .book-head { background: linear-gradient(#e8f3dc, #cde4bd) !important; }
body.theme-collection .loose-box > .book-head { background: linear-gradient(#eef1e6, #dde3d2) !important; }

/* ---------- 8. 徽标：状态 / R18 / 随感 ---------- */
body.theme-collection .badge {
  display: inline-block;
  margin-left: 6px;
  padding: 0 5px;
  border: 1px solid #9dc294;
  background: #eef6e9;
  color: #3c6b3a;
  font-size: var(--px-sm, 11px) !important;
  line-height: 1.7;
  vertical-align: middle;
  white-space: nowrap;
}

body.theme-collection .badge-r18 {
  border-color: #c0392b;
  background: #c0392b;
  color: #ffffff !important;
  letter-spacing: 1px;
}

body.theme-collection .badge-essay { border-color: #8fb46a; background: #e9f4d9; color: #4a6b2a !important; }

/* ---------- 9. R18 提示条（目录页顶部 / 文章页标题下）---------- */
body.theme-collection .r18-bar {
  margin: 10px 0 12px;
  padding: 7px 10px;
  border: 1px solid #e0b0aa;
  border-left: 4px solid #c0392b;
  background: #fdf3f2;
  color: #8e2f24;
}

body.theme-collection .r18-bar-inline { margin: 8px 0 14px; }

body.theme-collection .r18-tag {
  display: inline-block;
  margin-right: 6px;
  padding: 0 4px;
  background: #c0392b;
  color: #ffffff !important;
  font-size: var(--px-sm, 11px) !important;
  letter-spacing: 1px;
}

/* ---------- 10. 文章标题下那一行：书名 + 徽标 ---------- */
body.theme-collection .entry-bookline { margin: 2px 0 10px; color: #5b7358; }
body.theme-collection .entry-bookline .book-link { font-size: var(--px-lg, 15px) !important; }
</style>
