# ============================================================
#  宝可梦放养区 —— 收藏名单
#  ------------------------------------------------------------
#  侧边栏那个「宝可梦放养区」挂件里会出现的宝可梦，就是下面这份名单。
#  每次打开网页随机抽一只；同一个标签页里翻页不会换（存在 sessionStorage）。
#
#  ★ 改完这份名单必须重新跑生成脚本：
#        python tools/build-pkmn.py
#    它会下载素材、把行走图和脸图合成一张精灵表，再重新生成名单索引。
#    删掉一只只是不再抽到它（已经下载的素材会留在 static/pkmn/ 里）。
#
#    只想改台词、不想重新下载素材：
#        python tools/build-pkmn.py --talk
#
#  台词在 data/pkmn-talk/<图鉴号>.toml，一只一个文件。
#
#  dex = 全国图鉴编号   name = 显示出来的中文名   en = 英文名（只是备注）
# ============================================================

