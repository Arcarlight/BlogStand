# ============================================================
#  Hugo 站点配置 —— 虹星的星虹巢
# ============================================================

# 【必改】部署地址
#   仓库名是 YOURNAME.github.io  ->  https://YOURNAME.github.io/
#   仓库名是别的（如 home）      ->  https://YOURNAME.github.io/home/
baseURL = "https://arcarlight.github.io/BlogStand/"

locale = "zh-cn"
defaultContentLanguage = "zh-cn"
title = "虹星的星虹巢｜ほしのほしにじそう"
enableRobotsTXT = true
canonifyURLs = true

# 让 Hugo 从 git 提交记录里取每个页面的「最后更新日期」（.Lastmod）。
# 侧栏和首页的「更新日志」就是按这个排的 —— 不开的话 .Lastmod 会退化成
# 发布日期，往老日记里补一天也看不出来。
# 注意两点：
#   1) 需要完整的 git 历史：GitHub Actions 那边已经是 fetch-depth: 0；
#      本地用 git clone 下来的仓库也正常有。
#   2) 只认「已提交」的改动 —— 刚写完还没 commit 的页面，日期不会变。
enableGitInfo = true

# 站点时区。旧站的时间戳是 UTC（例：sokuzai_cattest 的 2026-02-14T19:42Z），
# 按 UTC 显示会比你当时实际发帖的本地时间早 8 小时，所以这里固定成 +8，
# 页面上的「发布于」就是你当年看到的本地时间。
timeZone = "Asia/Shanghai"

# ------------------------------------------------------------
#  站点参数
# ------------------------------------------------------------
[params]

  # ---- 站长身份 ----
  authorName   = "虹星"
  authorHandle = "にじぼし"
  email        = "arcarlightjp@163.com"
  # 侧边栏「关于站长」的头像。由 Hoshi-Flygon.jpg 缩成 192x192
  # （侧栏实际显示 96px，192 是 2 倍，供视网膜屏）
  avatar       = "/images/avatar.jpg"

  # 首页 Banner 上的标语
  slogan = "欢迎来到虹星用来堆放日常的博客！"

  # Banner 下方滚动公告
  notice = "★ 欢迎来到星虹巢 ★ 公开日记、作品集与素材持续更新中 ★ 友情链接长期招募 ★"

  # 侧边栏「关于站长」的自我介绍
  aboutDesc = "画画、作曲、写文、学习语言之类有超级多兴趣，最喜欢创作"

  # ---- 页脚 ----
  footerText = "Best viewed in 1024×768 with Internet Explorer 8 or Firefox 3.6"
  icp        = ""
  startDate  = "2026-02-05"

  # ---- 侧边栏挂件开关 ----
  busuanzi      = true
  showClock     = true
  showHitokoto  = true
  cursorSparkle = true

  # 2010 年中文站最典型的写法就是 Tahoma 打头（当年的 Windows 界面字体），
  # 中文回落到微软雅黑。
  # 宋体没有提到前面：正文用它只会走轮廓渲染、发灰发虚（宋体的点阵只在
  # 12~17 设备像素生效，150% 缩放下 12px 是 18 设备像素，正好错过）。
  # 想要像素宋体请用下面的 pixelSongSmall，那才是能生效的做法。
  fontStack = 'Tahoma,"Microsoft YaHei","微软雅黑",Verdana,SimSun,"宋体",sans-serif'

  # 阅读速度（字/分钟）—— 用来估算「阅读约 X 分钟」。
  # 中文阅读速度一般按 300~500 字/分钟估，这里取 400。
  # 注意：不能用 Hugo 自带的 .WordCount/.ReadingTime，它按空白分词，
  # 中文会被严重低估（实测差 15~183 倍），所以字数改由
  # layouts/_partials/stats.html 按字符数算。
  readingSpeed = 400

  # ---- 「点阵宋体」小字开关 ----
  # 宋体内嵌的点阵只存在于「12~17 设备像素」这一段，换算成 CSS 像素取决于
  # 屏幕缩放（实测：100% -> 12~17px，125% -> 10~13px，150% -> 8~11px，
  # 200% -> 6~8px）。也就是说 150% 缩放下只有 8~11px 的宋体是纯点阵、
  # 一个灰边都没有；12px 会变成 18 设备像素，正好错过，就发虚了。
  # 打开后：侧栏 / meta / 页脚 / 标签这些次级文字换成 11px 宋体（锐利），
  # 正文仍然是无衬线 13px —— 11px 宋体物理尺寸只有 6pt 左右，读长文太累。
  pixelSongSmall = false

  # ---- 像素字体模式（VonwaonBitmap 12px）----
  # 打开后全站换成点阵字体。这份字体是「轮廓即像素方块」的矢量字体，
  # unitsPerEm=1200、每个设计像素正好 100 单位，所以只要满足
  #     字号(CSS px) × devicePixelRatio = 12 的整数倍
  # 方块就能对齐像素网格。页面里的 JS 会按当前 DPR 自动算字号
  # （实测：100% -> 12px，150% -> 16px，200% -> 18px）。
  # 注意两条硬规则：
  #   1. 不能加粗。实测加粗后灰边从 39% 涨到 52%，点阵全毁，所以代码里把
  #      font-weight 统一压成 normal，标题改用更大的字号来区分层级。
  #   2. 字号不能随便写。改了字号就必须保证 字号 x DPR 仍是 12 的整数倍。
  pixelFont = true

  # 用哪一份点阵字体：
  #   "vonwaon"  = VonwaonBitmap 12px（公有领域，无版权顾虑，94 KB）
  #   "simsun12" = 从系统宋体 12px 内嵌点阵提取的 SimSun12-Pixel（58 KB）。
  #                字形就是 Windows 上经典的 12px 宋体点阵，观感最"原汁"；
  #                字体本身的 OS/2 fsType = 8（Editable），允许嵌入。
  pixelFontFile = "simsun12"

  # 日文假名用 MS Gothic 的点阵（从 msgothic.ttc 的 12ppem 点阵提取，4 KB）。
  # 用 CSS unicode-range 按字符路由：平假名 / 片假名 / 半角片假名走 MS Gothic，
  # 汉字和标点继续走上面那份宋体。不需要给 HTML 加 lang 标记。
  # 关掉即全部使用中文那份字体（宋体本身也含假名点阵，只是字形是中文风格）。
  pixelFontJa = true

  # ---- emoji 用点阵字体（Mona12Emoji，55 KB）----
  # 不开的话 Windows 会用 Segoe UI Emoji 渲染 emoji：彩色、带抗锯齿、
  # 尺寸和正文也对不上，是全站唯一不是点阵的地方。
  # 开：emoji 换成 Mona Font 的单色点阵 emoji（SIL OFL-1.1）。它同样是
  # 12px 栅格（unitsPerEm 1200、1 设计像素 = 100 单位），跟着 --px 走就是锐的。
  # 关掉即恢复成系统 emoji 字体。
  emojiFont = true

  # ---- 更新日志（侧栏挂件 + 首页列表）----
  # 内容 = 自动（按 git 提交日期取最近更新的页面）+ 手动（data/updates.toml，
  # 在编辑器左侧的「更新日志」面板里加）。
  # 侧栏那份什么都收（含日记）；首页那份不收日记 —— 日记一天一改，太频繁。
  updateLog        = true
  updateLogCount   = 8      # 侧栏「更新日志」显示几条
  updateLogHome    = 10     # 首页「更新日志」显示几条
  updateLogNewDays = 7      # 多少天内算「新」，挂上那个红色 NEW 小牌子

  # ---- 留言板（utterances）----
  # 留言存在仓库的 Issue 里，所以仓库得先装 utterances App：
  # https://github.com/apps/utterances → Install → Only select repositories → 选本站仓库
  comments        = true
  utterancesRepo  = "Arcarlight/BlogStand"

  # 页面 → Issue 的对应方式（utterances 的 issue-term）。只有这五个是「关键字」：
  #   pathname   按页面路径   → 每篇文章各自一块留言板（当前用的）
  #   url        按完整网址
  #   title      按 <title>
  #   og:title   按 og:title
  #   数字       直接指定某条 Issue 的编号，全站共用那一条
  # 填其他内容会被当成「Issue 标题的字面量」，也就是全站共用一条 Issue
  # （想做一个总留言板就填固定标题，比如 "留言板"）。
  #
  # ⚠️ 用 pathname / url 的话，Issue 标题里带着路径。以后要是换了域名、
  #    或者把站从 /BlogStand/ 子目录搬到根目录，标题就对不上了 ——
  #    留言不会丢（还在仓库 Issue 里），但页面上会显示成 0 条，
  #    得去 GitHub 把对应 Issue 改个名才能接上。
  utterancesIssue = "pathname"

