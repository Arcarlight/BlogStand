<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>星虹巢 · 本地编辑器</title>
<!-- 站点图标：图本身在 .editor/icons/favicon.png（换掉那个文件即可，无需改这里；
     由 server.mjs 的 /editor-icons/ 路由伺服） -->
<link rel="icon" type="image/png" href="/editor-icons/favicon.png">
<style>
  :root{
    --bg:#eef2f7; --panel:#fff; --line:#c9d6e5; --ink:#22303f; --dim:#7488a0;
    --accent:#1b5a9e; --accent2:#ff9900; --danger:#c0392b; --ok:#1e8e3e;
  }
  *{box-sizing:border-box}
  html,body{height:100%;margin:0}
  body{
    font:13px/1.6 "Microsoft YaHei","微软雅黑","PingFang SC","Hiragino Sans GB",-apple-system,"Segoe UI",sans-serif;
    color:var(--ink);background:var(--bg);display:flex;flex-direction:column;overflow:hidden;
  }
  /* ---------- 顶栏 ---------- */
  header{
    display:flex;align-items:center;gap:8px;padding:8px 12px;background:linear-gradient(180deg,#4c93dc,#1c5c9f);
    color:#fff;box-shadow:0 2px 6px rgba(0,0,0,.2);z-index:10;
  }
  header .brand{font-weight:bold;font-size:14px;letter-spacing:.5px;text-shadow:1px 1px 0 rgba(0,0,0,.3)}
  header .spacer{flex:1}
  button{
    font:inherit;padding:5px 12px;border:1px solid var(--line);border-radius:4px;background:#fff;
    color:var(--ink);cursor:pointer;
    /* 一排按钮里，带图标的那颗会比纯文字的矮 3px 左右 —— 因为 <img> 会参与
       inline-block 的基线计算，把按钮自己的基线顶下去，于是它整体上移。
       实测（2026-10-12，「+ 加一条更新」和「保存」并排）：两颗高度都是 32.8px，
       顶边却差 3.3px。**改 img 的 vertical-align 没用**，得改按钮自己的：
       middle 之后顶边差 0。 */
    vertical-align:middle;
  }
  button:hover{background:#f0f6ff}
  button:disabled{opacity:.5;cursor:default}
  button.primary{background:#ffb84d;border-color:#e08600;color:#4a2b00;font-weight:bold}
  button.primary:hover{background:#ffc76b}
  button.danger{background:#fff;border-color:#e0b4b0;color:var(--danger)}
  button.danger:hover{background:#fdf0ef}
  button.ghost{background:rgba(255,255,255,.14);border-color:rgba(255,255,255,.4);color:#fff}
  button.ghost:hover{background:rgba(255,255,255,.28)}
  .dirty{background:#fff3cd;color:#7a5b00;border:1px solid #e5c76b;border-radius:3px;padding:1px 7px;font-size:12px}

  /* ---------- 布局 ---------- */
  #main{flex:1;display:flex;min-height:0}
  /* 侧栏是「上面列表可滚动 + 底部版权行固定」的两段式 */
  #side{width:250px;flex:none;background:var(--panel);border-right:1px solid var(--line);display:flex;flex-direction:column;overflow:hidden}
  #tree{flex:1;overflow:auto;padding:8px 0}
  #credits{flex:none;padding:5px 12px;border-top:1px solid var(--line);background:#fafcff;font-size:11px;line-height:1.5;color:var(--dim)}
  #credits a{color:var(--accent);text-decoration:none}
  #credits a:hover{text-decoration:underline}
  #work{flex:1;display:flex;flex-direction:column;min-width:0}
  #toolbar{display:flex;align-items:center;gap:6px;padding:6px 10px;background:var(--panel);border-bottom:1px solid var(--line);flex-wrap:wrap}
  #toolbar button{flex:none;padding:4px 9px}
  /* 工具栏一旦换行，行高会由「行内最高的元素」决定，而 align-items:center 又让
     按钮在自己的行里垂直居中 —— 于是按钮被架空在一个比它高的行盒子里，
     投影就画在那个大盒子上，看着像「阴影被拉长了」。
     站长反馈：「这一栏因为标题太长被拉长成两行，会导致阴影也随之拉长，看着很奇怪」。
     修法：让工具栏里的**按钮/下拉**顶部对齐，盒子和投影尺寸就恒定、不受行高影响。

     ⚠️ 只给 button / select，**不要**给 .grp-label 和 .sep。
        第一版我把它们也一起 flex-start 了，结果「选中文字：」「宽」这两个标签
        相对按钮往上偏了 5.4px（站长：「选中文字和宽 没有和按钮居中啊」）——
        它们是纯文字，没有投影问题，本来就该跟着 align-items:center 居中。 */
  #toolbar > button,
  #toolbar > select{ align-self:flex-start }
  #curPath{font-family:Consolas,monospace;color:var(--dim);font-size:12px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
  #toolbar .spacer{flex:1}
  #panes{flex:1;display:flex;min-height:0}

  /* ---------- 侧栏树 ---------- */
  /* ---------- 侧栏分组的小标题条：拟物化（同时是折叠开关） ----------
     站长：「可以把工具这些可折叠的 tab 也加一下拟物化效果？不只是看箭头」，
     随后又指出方向反了：「点击展开后应该是按下去的效果而非凸起」。
     所以两个状态是：
       **展开**（默认态，内容就在下面）→ 按下去的凹陷：顶部内阴影 + 压平的底色 + 底沿亮线
       **折起来**→ 凸起：上亮下暗的渐变 + 顶部内白高光 + 底部内暗影 + 近投影
     配方都是编辑器现成那套（按钮/压条），只用 background / box-shadow /
     border-radius / color —— 不新增 border、不占位（描边用 inset 0 0 0 1px 画在内侧）。
     ⚠️ 这是全编辑器唯一一处动了几何：它自己的上下 padding 从 10/4 改成 6/6，
        为的是左右对称、像一条 tab。`#tree` 里其它行（.row）一个像素都没动。 */
  .grp{
    display:flex;align-items:center;gap:5px;padding:6px 12px 6px 10px;
    font-size:11px;font-weight:bold;color:#42566e;letter-spacing:1px;
    cursor:pointer;user-select:none;border-radius:3px;
    text-shadow:0 1px 0 rgba(255,255,255,.8);
    /* 展开 = 按下去（底色比侧栏面板再暗一档，才压得住） */
    background:linear-gradient(180deg, #d9e3ef 0%, #dfe8f3 55%, #e9f0f9 100%);
    box-shadow:
      inset 0 2px 4px rgba(46,78,116,.18),      /* 顶部内阴影：凹陷 */
      inset 0 0 0 1px rgba(150,175,205,.66),    /* 一圈内描边（代替 border） */
      inset 0 -1px 0 rgba(255,255,255,.85);     /* 底沿亮线 */
  }
  .grp:hover{color:var(--accent);text-shadow:0 1px 0 rgba(255,255,255,.95)}
  /* 按下那一刻：凹陷加深（折起来的那条按下去也有反馈） */
  .grp:active{
    box-shadow:
      inset 0 2px 5px rgba(46,78,116,.26),
      inset 0 0 0 1px rgba(150,175,205,.8),
      inset 0 -1px 0 rgba(255,255,255,.8);
  }
  /* 折起来 = 凸起：一条可以按下去的按钮 */
  .grp.folded{
    color:#4a5f78;
    background:linear-gradient(180deg, #ffffff 0%, #f4f8fd 45%, #e6eef9 46%, #d8e3f1 100%);
    box-shadow:
      inset 0 1px 0 #ffffff,                    /* 顶沿高光 */
      inset 0 0 0 1px rgba(150,175,205,.72),    /* 一圈内描边 */
      inset 0 -2px 2px rgba(46,78,116,.12),     /* 底部内侧暗影：塑料的厚度 */
      0 1px 2px rgba(6,24,48,.12);              /* 近投影：抬离底色 */
  }
  /* 折叠箭头（纯 CSS 画的字符，展开 ▾ / 折叠 ▸） */
  .grp .grp-arrow{width:8px;flex:none;font-size:9px;line-height:1;text-align:center;opacity:.75}
  .grp .grp-arrow::before{content:"▾"}
  .grp.folded .grp-arrow::before{content:"▸"}
  /* 组小标题前面那枚图标：字只有 11px，图标也收一档。压在浅色条上，
     比原来（浮在空白上）可以稍亮一点点，否则会被渐变压住。 */
  .grp .ico{width:13px;height:13px;opacity:.85}
  /* 页面行（子项）的图标：比工具行略小略淡 —— 它是次级信息，
     同一组里会连着出现好几枚，太实了就又「喧宾夺主」了。
     选中的那一行由上面的 `.row.active .ico{opacity:1}` 恢复全不透明。 */
  .row[data-file] .ico{width:15px;height:15px;opacity:.78}
  .grpbody[hidden]{display:none}
  /* 表格里那些小按钮（上移 / 下移 / 删掉）里的图标：收一档，
     免得 16px 的图标把表格行高顶起来（原来那三个字形「↑ ↓ ×」大约也是 13px）。 */
  table.grid button .ico{width:13px;height:13px}

  /* ---------- 侧栏顶上的「新建页面」：拟物化按钮 ----------
     站长：「侧边工具栏最顶上的新建页面没有做成拟物化按钮的样子」。
     它原来是 .row.create —— 和列表行走同一套样式（只是字是蓝的），所以看着不像按钮。
     现在给它自己的**凸起面容**（和折叠条、工具栏按钮同一套配方：上亮下暗的渐变
     + 顶沿内白高光 + 一圈内描边 + 底部内暗影 + 近投影），按下时凹下去 ——
     一眼就是「一条可以按的东西」。
     ⚠️ 不碰 padding / margin —— `.row` 的盒模型一个字都不能改（见上面那条警告），
        立体感全靠 background / box-shadow / 圆角。 */
  .row.create{
    color:var(--accent);
    background:linear-gradient(180deg, #ffffff 0%, #f2f8ff 45%, #e2eefb 46%, #d3e4f7 100%);
    box-shadow:
      inset 0 1px 0 #ffffff,                     /* 顶沿高光 */
      inset 0 0 0 1px rgba(140,175,215,.75),     /* 一圈内描边（代替 border，不占位） */
      inset 0 -2px 2px rgba(46,78,116,.10),      /* 底部内暗影：厚度 */
      0 1px 2px rgba(6,24,48,.10);               /* 近投影：抬离底色 */
  }
  .row.create:hover{
    color:#124a86;
    background:linear-gradient(180deg, #ffffff 0%, #f7fbff 45%, #e9f3ff 46%, #d9e9fb 100%);
  }
  .row.create:active{
    box-shadow:
      inset 0 2px 4px rgba(46,78,116,.20),
      inset 0 0 0 1px rgba(140,175,215,.85),
      inset 0 -1px 0 rgba(255,255,255,.85);
  }
  .row{
    display:flex;align-items:center;gap:6px;padding:4px 12px 4px 18px;cursor:pointer;
    white-space:nowrap;overflow:hidden;text-overflow:ellipsis;
  }
  .row:hover{background:#eef5fd}
  .row.active{background:#dcebfa;font-weight:bold;color:var(--accent)}
  .row.tool{padding-left:12px}
  .row .badge{font-size:10px;color:var(--dim);margin-left:auto}
  /* 拖动排序 */
  .row[draggable="true"]{cursor:grab}
  .row.dragging{opacity:.4}
  .row.drop-before{box-shadow:inset 0 2px 0 0 var(--accent)}
  .row.drop-after{box-shadow:inset 0 -2px 0 0 var(--accent)}

  /* ---------- 图片选择器（选站上已有的图） ---------- */
  .galpick{display:grid;grid-template-columns:repeat(auto-fill,minmax(104px,1fr));gap:8px;max-height:60vh;overflow:auto;padding:2px}
  .galpick-cell{position:relative;display:flex;flex-direction:column;align-items:center;gap:3px;padding:5px;cursor:pointer;background:#fff;border:1px solid var(--line);border-radius:4px;font:inherit}
  .galpick-cell img{width:100%;height:74px;object-fit:cover;background:#f6f9fd}
  .galpick-cell span{width:100%;overflow:hidden;font-size:11px;color:var(--dim);white-space:nowrap;text-overflow:ellipsis;text-align:center}
  .galpick-cell:hover{border-color:var(--accent)}
  .galpick-cell.on{border-color:var(--accent);box-shadow:0 0 0 2px #cfe4fb;background:#f2f8ff}
  .galpick-cell.on::after{content:"";position:absolute;margin:-4px 0 0 84px;width:14px;height:14px;background:url(/editor-icons/fugue/tick.png) center/14px no-repeat}
  /* 已经在画廊里的图：灰一点 + 一个「已导入」角标，一眼能扫出来 */
  .galpick-cell.added{background:#f4f6f8;border-style:dashed}
  .galpick-cell.added img{opacity:.45}
  .galpick-cell.added span{color:#8a97a6}
  .galpick-tag{position:absolute;top:5px;left:5px;padding:1px 5px;font-size:10px;font-style:normal;line-height:1.5;color:#fff;background:#7f8c9b;border-radius:3px}

  /* ---------- 侧栏排序面板里的拖动列表 ---------- */
  #sideOrder{list-style:none;max-width:440px;margin:10px 0}
  #sideOrder li{
    display:flex;align-items:center;gap:8px;padding:7px 10px;margin-bottom:4px;
    background:#fff;border:1px solid var(--line);border-radius:4px;cursor:grab;font-size:13px;
  }
  #sideOrder li:hover{background:#f4f9ff}
  #sideOrder li.dragging{opacity:.4}
  #sideOrder li .handle{color:var(--dim);font-size:15px;line-height:1}
  #sideOrder li code{margin-left:auto;font-size:11px;color:var(--dim);background:#f2f7fc;padding:1px 5px;border-radius:3px}

  /* ---------- 编辑区 ---------- */
  #editor{
    flex:1;min-width:0;border:0;outline:0;padding:14px 16px;resize:none;
    font:13.5px/1.75 Consolas,"SF Mono",Menlo,Monaco,"Courier New","Microsoft YaHei","PingFang SC",monospace;
    background:#fbfdff;color:#22303f;tab-size:2;
  }
  #previewPane{flex:1;min-width:0;display:none;flex-direction:column;border-left:1px solid var(--line);background:#fff}
  body.preview #previewPane{display:flex}
  #previewBar{display:flex;align-items:center;gap:6px;padding:3px 8px;background:#f2f7fc;border-bottom:1px solid var(--line);flex:none}
  #previewPath{flex:1;font-family:Consolas,monospace;font-size:12px;color:#44586e;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
  #previewBar button{padding:1px 9px;font-size:12px;line-height:1.5}
  #preview{flex:1;min-width:0;border:0;background:#fff}
  body.preview #editor{flex:1}
  #panel{flex:1;overflow:auto;padding:16px;background:var(--panel);display:none}
  body.panel #panel{display:block}
  body.panel #editor{display:none}
  /* 工具面板和预览可以同时开：左边面板、右边预览，各占一半。
     以前这里有 body.panel #previewPane{display:none}，而且点「预览」还会把
     panel 类摘掉 —— 于是「在画廊里加画」和「盯着一页看效果」不能同时做。 */
  /* 打开工具面板时，跟正文有关的那几个控件收起来（不然点了会改到别的文件） */
  body.panel #toolbar button.fmt,
  body.panel #toolbar .grp-label,
  body.panel #toolbar .sep,
  body.panel #imgWidthSel,
  body.panel #btnApplyWidth,
  body.panel #btnInsertImg,
  body.panel #btnInsertDay,
  body.panel #btnToggleDraft{display:none}

  /* ---------- 表单 ---------- */
  h2.sec{margin:0 0 4px;font-size:15px;color:var(--accent)}
  p.hint{margin:0 0 16px;color:var(--dim);font-size:12px}
  .field{display:flex;align-items:center;gap:10px;padding:5px 0;border-bottom:1px dashed #e6edf6}
  .field label{width:190px;flex:none;font-family:Consolas,monospace;font-size:12px;color:#44586e}
  .field input[type=text],.field textarea{
    flex:1;font:inherit;padding:4px 8px;border:1px solid var(--line);border-radius:3px;background:#fff;
  }
  .field textarea{font-family:Consolas,monospace;font-size:12px;min-height:60px;resize:vertical}
  .field input[type=checkbox]{width:16px;height:16px}
  .field .cmt{color:#9db0c4;font-size:11px;max-width:320px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}

  table.grid{width:100%;border-collapse:collapse;margin-bottom:10px}
  table.grid th{background:#eef5fd;border:1px solid var(--line);padding:5px 8px;font-size:12px;text-align:left}
  table.grid td{border:1px solid var(--line);padding:3px 5px}
  table.grid input{width:100%;font:inherit;font-size:12px;border:1px solid transparent;background:transparent;padding:3px 5px;border-radius:3px}
  table.grid input:focus{border-color:var(--accent);background:#fff;outline:0}
  /* 表格里的**复选框**要单独收回来：上面那条 `table.grid input{width:100%}` 会把
     它拉成一整条，配上自己画的蓝底就成了一根又宽又扁的「压扁的勾」
     （站长截图反馈：「文集里的打钩按钮被压扁了」）。
     尺寸和 .field 里的复选框对齐（16px），这样 :checked::after 那个勾的
     定位（left:4px/top:1px/4×8）也是现成对的。 */
  table.grid input[type=checkbox]{width:16px;height:16px;padding:0;vertical-align:middle}
  .swatch{width:34px;height:24px;border:1px solid var(--line);border-radius:3px;padding:0;vertical-align:middle}

  /* ---------- 脚本卡 ---------- */
  .card{border:1px solid var(--line);border-radius:6px;padding:12px 14px;margin-bottom:10px;background:#fbfdff}
  .card h4{margin:0 0 6px;font-size:13px}
  .card .meta{color:var(--dim);font-size:11px;font-family:Consolas,monospace}
  .card .acts{margin-top:8px;display:flex;gap:6px;align-items:center}
  .sw{display:inline-flex;align-items:center;gap:6px;cursor:pointer;font-size:12px}

  /* ---------- 弹窗 ---------- */
  #modal{position:fixed;inset:0;background:rgba(20,32,45,.45);display:flex;align-items:center;justify-content:center;z-index:200}
  #modal[hidden]{display:none}
  .mbox{background:#fff;border-radius:8px;box-shadow:0 12px 40px rgba(0,0,0,.3);width:580px;max-width:92vw;max-height:88vh;display:flex;flex-direction:column}
  .mbox h3{margin:0;padding:14px 18px;font-size:15px;border-bottom:1px solid var(--line);color:var(--accent)}
  #mBody{padding:14px 18px;overflow:auto}
  .mfoot{padding:12px 18px;border-top:1px solid var(--line);display:flex;justify-content:flex-end;gap:8px}
  #mBody .field label{width:150px}
  #mBody select{flex:1;font:inherit;padding:5px 8px;border:1px solid var(--line);border-radius:3px;background:#fff}
  .note{padding:8px 11px;background:#f5f9ff;border:1px dashed #b9d0e8;border-radius:4px;font-size:12px;color:#44586e;margin-bottom:12px;line-height:1.7}

  /* ---------- 宝可梦台词面板 ---------- */
  .pk-h{margin:18px 0 6px;font-size:13px;color:#123f70;border-bottom:1px solid var(--line);padding-bottom:4px}
  .pk-sub{color:#9db0c4;font-size:11px;font-weight:normal;margin-left:6px}
  .pk-in{width:100%;font:inherit;font-size:12.5px;padding:4px 7px;border:1px solid var(--line);border-radius:3px;background:#fff}
  .pk-in:focus{outline:none;border-color:var(--accent);box-shadow:0 0 0 2px #dcebfa}
  .pk-n{text-align:center;color:#9db0c4;font-family:Consolas,monospace;font-size:11px}
  .pk-n.bad{color:#c5221f;font-weight:bold}
  .pk-add{background:#fafcff}
  .pk-add button{padding:2px 8px;font-size:12px}
  .pk-log{margin-top:12px;padding:10px;background:#f7f9fc;border:1px solid var(--line);border-radius:4px;
    font-family:Consolas,monospace;font-size:11.5px;line-height:1.6;white-space:pre-wrap;max-height:240px;overflow:auto}

  /* ---------- 「蒂安希听到了」面板 ---------- */
  .dc-text{width:100%;font:12px/1.6 Consolas,monospace;padding:4px 6px;border:1px solid var(--line);
    border-radius:3px;background:#fff;min-height:46px;resize:vertical}
  .dc-text:focus{outline:none;border-color:var(--accent);box-shadow:0 0 0 2px #dcebfa}
  .dc-sel{width:100%;font:inherit;font-size:12px;padding:3px 5px;border:1px solid var(--line);
    border-radius:3px;background:#fff}
  .dc-auto{color:#9db0c4;font-family:Consolas,monospace;font-size:11.5px;white-space:nowrap}
  .dc-auto b{color:#1e8e3e}
  /* 表情小图：站长说过「选表情这一块怎么不把表情显示出来？这样我看不出来啊」，
     所以这里真的把图摆出来 —— 小小的一张看不清，就放大 + 像素化。 */
  .dc-face{width:40px;height:40px;image-rendering:pixelated;display:block;
    border:1px solid var(--line);border-radius:3px;background:#fbfdff}
  .dc-face-cell{width:44px;padding:2px 0}
  .dc-face-cell.bad .dc-face{border-color:#e8b4b1;background:#fff6f5;opacity:.35}
  /* 脸图没取到时的退化显示：不摆空 <img>（浏览器会画成破图），只写一行小字 */
  .dc-face-missing{display:inline-block;width:40px;font-size:10px;line-height:1.2;
    color:#b0b0b0;text-align:center;vertical-align:middle}
  .dc-preview{white-space:normal;line-height:1.6;min-width:150px}
  .dc-preview .dc-face{display:inline-block;width:36px;height:36px;vertical-align:middle;margin-left:4px}
  .dc-sec{margin-top:20px;padding-top:10px;border-top:1px solid var(--line)}
  .dc-sec-title{display:flex;align-items:baseline;gap:8px;flex-wrap:wrap}
  .dc-sec-title .label{color:#123f70}
  .dc-sec-title .code{font-family:Consolas,monospace;font-size:11px;color:#9db0c4}
  .dc-sec-hint{margin:2px 0 8px;color:var(--dim);font-size:12px}
  .dc-sec-title .cell{color:#9db0c4;font-size:11.5px;font-family:Consolas,monospace}
  /* 16 张脸的全家福：先认脸，再回下面挑 */
  .dc-legend{display:flex;flex-wrap:wrap;gap:6px 10px;margin:0 0 12px;
    padding:8px 10px;background:#fbfdff;border:1px solid var(--line);border-radius:4px}
  .dc-legend-item{display:flex;flex-direction:column;align-items:center;width:56px}
  .dc-legend-item .dc-face{width:40px;height:40px}
  .dc-legend-name{font-size:11px;color:#123f70;line-height:1.5}
  .dc-legend-code{font-family:Consolas,monospace;font-size:9.5px;color:#9db0c4}

  /* ---------- 拖拽上传 ---------- */
  #editor.dragover{background:#eef7ff;box-shadow:inset 0 0 0 3px #7fb8f0}
  .row.create{color:var(--accent);font-weight:bold}
  .row.create:hover{background:#e3f0ff}

  /* ---------- 编辑器自身有新版本的提示条 ---------- */
  #staleBar{
    display:flex;align-items:center;gap:10px;padding:7px 12px;flex:none;
    background:#fff4d6;border-bottom:1px solid #e5c76b;color:#6b4e00;font-size:12.5px;
  }
  #staleBar[hidden]{display:none}
  #staleBar #staleText{flex:1;line-height:1.5}
  #staleBar button{padding:3px 10px;font-size:12px}
  #staleBar #btnStaleClose{padding:3px 8px;background:transparent;border-color:#e5c76b;color:#6b4e00}

  /* ---------- 工具栏的格式按钮 ---------- */
  .grp-label{color:var(--dim);font-size:12px;white-space:nowrap;display:inline-flex;align-items:center;gap:5px}
  #toolbar .sep{width:1px;height:18px;background:var(--line);margin:0 2px}
  #toolbar button.fmt{padding:3px 9px;line-height:1.4}
  #toolbar button.fmt.on{background:#dcebfa;border-color:var(--accent);color:var(--accent)}
  #imgWidthSel{font:inherit;padding:3px 6px;border:1px solid var(--line);border-radius:4px;background:#fff}

  /* ---------- 图标：Fugue Icons ----------
     Yusuke Kamiyamane 的 Fugue（CC BY 3.0），来源与许可见 .editor/icons/README.md。
     用的是它的 32x32 版、按 **16px** 显示：Retina（DPR 2）下正好 1:1 不糊，
     1x 屏就是普通缩小。所以**不再需要**「图标尺寸 x DPR = 24 的整数倍」那套
     像素网格算法 —— 那是给 24x24 的像素图标用的，Fugue 是 16px 网格的成品图。
     图是彩色的，不再跟着 currentColor 染色（这正是要的那种千禧年观感）。 */
  .ico{
    width:16px;height:16px;flex:none;
    vertical-align:-.2em;
  }
  button .ico,.row .ico{margin-right:2px}
  button:has(.ico){display:inline-flex;align-items:center;gap:5px}
  .row .ico{opacity:.85}
  .row.active .ico,.row.create .ico{opacity:1}

  #toast{
    position:fixed;left:50%;bottom:24px;transform:translateX(-50%);
    background:#22303f;color:#fff;padding:9px 18px;border-radius:5px;opacity:0;pointer-events:none;
    transition:opacity .2s, transform .2s;z-index:99;max-width:70vw;
  }
  #toast.show{opacity:1;transform:translateX(-50%) translateY(-6px)}
  #toast.err{background:#a3352b}
  #toast.ok{background:#1e7a3c}
  code{background:#eef2f7;padding:1px 5px;border-radius:3px;font-size:12px}

  /* ============================================================
     拟物化（skeuomorphic）——「千禧年桌面软件」那套高光与质感
     ------------------------------------------------------------
     站长要的是「按钮、视窗等等有拟物感（高光、光泽感）」。
     参考的是 2000 年代那批：Windows XP 的 Luna、Mac OS X 的 Aqua、
     以及当年的共享软件界面 —— 塑料/水晶质感的按钮、凹进去的输入框、
     有标题栏的窗口、带光泽的滚动条。

     ★★ 一条硬约束：**不改 box model**
        只用 background（渐变）、box-shadow、border-color、和
        inset box-shadow（代替 border）。**绝不改** padding / border-width /
        margin，也**绝不新增 border**。
        为什么：编辑器有 15 个面板、几百个控件，全按现有尺寸排好了版。
        第一版我犯了三个错，几何检查抓出来的：
          · 给 header 加了 border-bottom:1px → 整个顶栏高 1px，
            下面**每一个**元素的 y 都跟着 +1px（级联位移）
          · 动了 #tree 的 padding 和 .row 的 margin
          · 下拉框用 padding-right:22px 放箭头 → 宽度变了
        box-shadow 不参与布局，所以立体感只能靠它 + 渐变来做。
        需要「描边」时用 `inset 0 0 0 1px <色>`，它画在盒子内侧、不占位。

     四种基本配方（后面反复套用）：
       凸起（按钮）  上亮下暗的渐变 + 顶部内白高光 + 底部暗线 + 外投影
       凹陷（输入框）内阴影 + 上边暗、下边亮（光从上面来 → 上沿背光）
       玻璃（主按钮）高光上加一道横向反光带
       窗口（弹窗）  外投影 + 一圈 inset 描边 + 标题栏渐变
     ============================================================ */

  /* ---------- 顶栏：把原来那条平渐变做成有立体感的标题栏 ---------- */
  header{
    background:
      linear-gradient(180deg, rgba(255,255,255,.42) 0%, rgba(255,255,255,.14) 42%,
                      rgba(255,255,255,0) 43%, rgba(0,0,0,.06) 100%),
      linear-gradient(180deg, #5da2e8 0%, #2f74bb 48%, #1b5a9f 52%, #124070 100%);
    /* ⚠️ 这里**不能**加 border-bottom：原来没有，加了顶栏就高 1px，
          下面所有元素的 y 全部跟着挪。底沿的分隔改用 inset 阴影。 */
    box-shadow:
      inset 0 1px 0 rgba(255,255,255,.55),      /* 顶沿高光 */
      inset 0 -1px 0 rgba(0,0,0,.45),           /* 底沿暗线（替代 border，不占位） */
      inset 0 -2px 0 rgba(255,255,255,.10),
      0 2px 6px rgba(0,0,0,.28);                /* 浮起来 */
  }
  /* ---------- 顶栏按钮：深蓝标题栏上的浅色塑料凸起 ----------
     ⚠️ 第一版这里做成了**半透明玻璃**（rgba 白，透出底下的蓝渐变），
        站长反馈两点，都成立：
          · 「渐变用的和底栏一样导致没有区分度」——半透明的按钮和底下的
            蓝渐变混在一起，按钮的边界看不出来了
          · 「没有阴影之类，不如下方按钮有感觉」——当时只给了 inset 高光
            和一个 1px 的外阴影，没有厚度
        所以改成**不透明浅色面**：按钮有自己的实体表面，不再透出底下的蓝；
        再补上外投影（两段，做出厚度）、底部 1px 暗线、以及一圈底部暗色内描边
        —— 就是工具栏按钮那套配方，只是整体更亮一点（它贴在深蓝上）。
        仍然**不改任何尺寸**（只碰 background / border-color / box-shadow）。 */
  button.ghost{
    background:
      /* 上面的横向反光带：一条 47% 处的硬分界，做出「玻璃压一层」的感觉 */
      linear-gradient(180deg, rgba(255,255,255,.85) 0%, rgba(255,255,255,.35) 46%,
                      rgba(255,255,255,.05) 47%, rgba(255,255,255,0) 62%,
                      rgba(0,0,0,.06) 100%),
      /* 实体乳白面：不透明，这才是和标题栏拉开区分度的关键 */
      linear-gradient(180deg, #ffffff 0%, #f8fbff 44%, #e6eef9 46%, #d3e0f0 100%);
    border-color:#93b0d0;
    box-shadow:
      inset 0 1px 0 #fff,                        /* 顶部受光 */
      inset 0 0 0 1px rgba(255,255,255,.55),     /* 一圈内亮描边（玻璃边） */
      inset 0 -2px 2px rgba(46,78,116,.16),      /* 底部内侧暗影 */
      0 1px 0 rgba(255,255,255,.30),             /* 底沿亮线，把按钮从蓝底「抬」出来 */
      0 1px 2px rgba(6,24,48,.30),               /* 近投影（与普通按钮同档，别太重） */
      0 3px 5px rgba(6,24,48,.14);               /* 远投影：只留一点点 */
    color:#17324f;
    text-shadow:0 1px 0 rgba(255,255,255,.85);
  }
  button.ghost:hover{
    background:
      linear-gradient(180deg, rgba(255,255,255,.95) 0%, rgba(255,255,255,.45) 46%,
                      rgba(255,255,255,.10) 47%, rgba(255,255,255,0) 62%,
                      rgba(0,0,0,.03) 100%),
      linear-gradient(180deg, #ffffff 0%, #fbfdff 44%, #edf4fc 46%, #dceaf8 100%);
    border-color:#7ba0c6;
    box-shadow:
      inset 0 1px 0 #fff,
      inset 0 0 0 1px rgba(255,255,255,.7),
      inset 0 -2px 2px rgba(46,78,116,.14),
      0 1px 0 rgba(255,255,255,.40),
      0 0 0 1px rgba(150,190,235,.40),
      0 1px 3px rgba(6,24,48,.32),
      0 3px 7px rgba(6,24,48,.16);
    color:#0f2a45;
  }
  /* 按下去：翻成凹的 + 下沉，并且投影收掉（按进去就没有厚度了） */
  button.ghost:active{
    background:
      linear-gradient(180deg, #c9d9ea 0%, #dde8f5 100%);
    border-color:#7ba0c6;
    box-shadow:
      inset 0 3px 6px rgba(20,45,80,.45),
      inset 0 -1px 0 rgba(255,255,255,.5);
    text-shadow:0 1px 0 rgba(255,255,255,.5);
  }

  /* ---------- 按钮：凸起塑料 ---------- */
  button{
    background:
      linear-gradient(180deg, #ffffff 0%, #f7fafd 44%, #e9eef5 46%, #dbe3ec 100%);
    border-color:#a9b8c9;
    box-shadow:
      inset 0 1px 0 rgba(255,255,255,.95),     /* 顶部受光 */
      inset 0 -1px 0 rgba(0,0,0,.06),
      0 1px 2px rgba(31,45,61,.20);
    text-shadow:0 1px 0 rgba(255,255,255,.75);
  }
  button:hover{
    background:
      linear-gradient(180deg, #ffffff 0%, #f2f8ff 44%, #e2edfa 46%, #d0e2f5 100%);
    border-color:#7fa8d0;
    box-shadow:
      inset 0 1px 0 rgba(255,255,255,1),
      0 1px 2px rgba(31,45,61,.24),
      0 0 0 1px rgba(127,168,208,.35);
  }
  /* 按下去：整个翻过来变成「凹」的，并且往下挪 1px */
  button:active{
    background:linear-gradient(180deg, #cfdae6 0%, #dde5ee 100%);
    box-shadow:inset 0 2px 5px rgba(25,40,58,.38), inset 0 -1px 0 rgba(255,255,255,.4);
    transform:translateY(1px);
  }
  button:focus-visible{outline:none;box-shadow:inset 0 1px 0 rgba(255,255,255,.95), 0 0 0 3px rgba(78,150,220,.45)}
  /* 禁用：**扁下去**，不是凸起来。
     ------------------------------------------------------------
     站长反馈「不可用的保存按钮也立体化了，不可用的可以扁下去」—— 对。
     凸起意味着「可以按」，禁用按钮给出凸起是在骗人。
     所以这里把立体感整个拿掉：
       · 没有外投影（不浮起来）
       · 没有顶部高光（不受光）
       · 底色压平、降饱和
       · 加一圈内阴影，读起来像「凹进去 / 焊死了」
       · 只留一层很淡的内描边表示边界
     ⚠️ 只碰 background / border-color / box-shadow / color / opacity，
        不改尺寸。opacity 也参与布局之外，安全。 */
  button:disabled{
    background:linear-gradient(180deg, #eff2f5 0%, #e7ebf0 100%);
    border-color:#c4ccd6;
    color:#9aa6b4;
    text-shadow:none;
    opacity:1;
    box-shadow:
      inset 0 1px 3px rgba(40,56,74,.16),      /* 内凹 */
      inset 0 0 0 1px rgba(255,255,255,.5);    /* 很淡的边界 */
  }
  /* 禁用的主按钮（比如没改动时是灰的「发布」）：同样扁下去，不留一点光泽 */
  button.primary:disabled,
  button.danger:disabled,
  button.ghost:disabled{
    background:linear-gradient(180deg, #eff2f5 0%, #e7ebf0 100%);
    border-color:#c4ccd6;
    color:#9aa6b4;
    box-shadow:
      inset 0 1px 3px rgba(40,56,74,.16),
      inset 0 0 0 1px rgba(255,255,255,.5);
    transform:none;
  }
  /* 禁用的图标也压暗一点，跟文字一致 */
  button:disabled .ico{opacity:.45;filter:grayscale(1)}

  /* ---------- 主按钮（发布）：玻璃糖 ----------
     ⚠️ 两轮反馈都记在这里：
     ① 「黄色的发布按钮好像还是没有凸起来的感觉」—— 橙色整体偏亮，
        渐变两端色差被吃掉了，高光/底沿都看不出来。所以把渐变上端提到近白、
        下端压到深橙褐，顶部内高光加厚到 2px、底部暗带加深到 3px。
     ② 「主要视窗内的黄色按钮阴影太强了，感觉和旁边的按钮不是一个世界的」—— 对。
        我上一轮给了**两档外投影**（`0 2px 3px .45` + `0 5px 12px .35`），
        而普通按钮只有 `0 1px 2px .20`，量级差了 5 倍以上；
        而且色相偏暖褐，和旁边按钮的中性灰投影摆在一起就更突兀。
        现在把外投影收到与普通按钮同一档：`0 1px 2px` + `0 3px 5px`，
        颜色也从纯棕改成中性偏暖（`46,32,14`）。
        立体感主要交给**内部**表达（顶部厚高光 / 底部内暗影 / 内亮描边）——
        这正是旁边按钮的做法，于是两边看着终于是同一个世界了。 */
  button.primary{
    background:
      /* 上半的近白高光 + 底部暗带（做出塑料的厚度） */
      linear-gradient(180deg, rgba(255,255,255,.85) 0%, rgba(255,255,255,.34) 44%,
                      rgba(255,255,255,.06) 48%, rgba(255,255,255,0) 63%,
                      rgba(120,60,0,.16) 100%),
      linear-gradient(180deg, #ffe9a8 0%, #ffc255 46%, #f59a00 52%, #c47800 100%);
    border-color:#8a5200;
    color:#43260a;
    text-shadow:0 1px 0 rgba(255,255,255,.6);
    box-shadow:
      inset 0 2px 0 rgba(255,255,255,.95),        /* 顶部厚高光 */
      inset 0 0 0 1px rgba(255,255,255,.35),      /* 内亮描边 */
      inset 0 -2px 3px rgba(90,45,0,.32),         /* 底部内暗影 */
      0 1px 0 rgba(255,255,255,.30),              /* 底沿亮线（很淡，够托起来就行） */
      0 1px 2px rgba(46,32,14,.30),               /* 近投影：与普通按钮同档 */
      0 3px 5px rgba(46,32,14,.16);               /* 远投影：只留一点点 */
  }
  button.primary:hover{
    background:
      linear-gradient(180deg, rgba(255,255,255,.95) 0%, rgba(255,255,255,.45) 44%,
                      rgba(255,255,255,.10) 48%, rgba(255,255,255,0) 63%,
                      rgba(120,60,0,.12) 100%),
      linear-gradient(180deg, #fff3c4 0%, #ffcd70 46%, #ffa61c 52%, #d18300 100%);
    border-color:#7a4800;
    box-shadow:
      inset 0 2px 0 rgba(255,255,255,1),
      inset 0 0 0 1px rgba(255,255,255,.45),
      inset 0 -2px 3px rgba(90,45,0,.28),
      0 1px 0 rgba(255,255,255,.4),
      0 0 0 1px rgba(255,200,120,.45),            /* 悬停时一圈很淡的暖光，代替厚重投影 */
      0 1px 3px rgba(46,32,14,.34),
      0 3px 7px rgba(46,32,14,.18);
  }
  /* 按下去：整个翻成凹的，投影收掉（按进去就没有厚度了） */
  button.primary:active{
    background:linear-gradient(180deg, #d98f1f 0%, #f2b53f 100%);
    box-shadow:
      inset 0 3px 6px rgba(90,45,0,.55),
      inset 0 -1px 0 rgba(255,255,255,.35);
    transform:translateY(1px);
  }

  /* ---------- 危险按钮：红玻璃 ---------- */
  button.danger{
    background:
      linear-gradient(180deg, rgba(255,255,255,.72) 0%, rgba(255,255,255,.22) 48%,
                      rgba(255,255,255,.03) 49%, rgba(0,0,0,.03) 100%),
      linear-gradient(180deg, #ffffff 0%, #fdf3f2 46%, #f7e3e1 100%);
    border-color:#d3a09a;
    color:#a8342a;
    text-shadow:0 1px 0 rgba(255,255,255,.8);
  }
  button.danger:hover{
    background:
      linear-gradient(180deg, rgba(255,255,255,.8) 0%, rgba(255,255,255,.3) 48%,
                      rgba(255,255,255,.06) 49%, rgba(0,0,0,.02) 100%),
      linear-gradient(180deg, #fff5f4 0%, #fbdedb 100%);
    border-color:#c07f77;
  }

  /* ---------- 工具栏里的切换按钮（按下 = 凹陷 + 蓝底） ---------- */
  #toolbar button.fmt.on{
    background:
      linear-gradient(180deg, rgba(255,255,255,.30) 0%, rgba(255,255,255,.10) 50%,
                      rgba(0,0,0,.04) 51%, rgba(0,0,0,.10) 100%),
      linear-gradient(180deg, #c3dcf6 0%, #a9c9ec 100%);
    border-color:#6b96c4;
    color:#0f3f74;
    box-shadow:inset 0 2px 4px rgba(20,50,90,.30), inset 0 -1px 0 rgba(255,255,255,.5);
  }

  /* ---------- 输入类控件：凹进去 ---------- */
  input[type=text], input[type=search], input[type=number],
  textarea, select,
  .field input[type=text], .field textarea,
  #mBody select, #imgWidthSel, .pk-in, .dc-text, .dc-sel, table.grid input{
    background:linear-gradient(180deg, #f2f5f9 0%, #ffffff 14%, #ffffff 100%);
    border-color:#9fb2c6;
    box-shadow:inset 0 1px 2px rgba(28,44,62,.20), inset 0 1px 0 rgba(0,0,0,.04);
  }
  input[type=text]:focus, input[type=search]:focus, input[type=number]:focus,
  textarea:focus, select:focus,
  .pk-in:focus, .dc-text:focus, table.grid input:focus{
    border-color:#3f83c7;
    box-shadow:inset 0 1px 3px rgba(28,44,62,.22), 0 0 0 3px rgba(90,160,225,.35);
  }
  /* 表格里那些「平时像纯文本、聚焦才变输入框」的格子 */
  table.grid input{border-color:transparent;box-shadow:none;background:transparent}
  table.grid input:hover{border-color:#b9c9da;background:#fff}
  table.grid input:focus{box-shadow:inset 0 1px 2px rgba(28,44,62,.2), 0 0 0 3px rgba(90,160,225,.35)}

  /* 复选框：手绘一个（原来那个方框太平） */
  .field input[type=checkbox], input[type=checkbox]{
    appearance:none;-webkit-appearance:none;
    border:1px solid #8fa4b9;border-radius:2px;
    background:linear-gradient(180deg, #eef2f7, #ffffff 60%);
    box-shadow:inset 0 1px 2px rgba(28,44,62,.25);
    position:relative;
  }
  input[type=checkbox]:hover{border-color:#5f88b0}
  input[type=checkbox]:checked{
    background:linear-gradient(180deg, #7fb2e2 0%, #3d7fc0 50%, #2a6cae 100%);
    border-color:#255b93;
    box-shadow:inset 0 1px 2px rgba(0,0,0,.3), inset 0 -1px 0 rgba(255,255,255,.3);
  }
  input[type=checkbox]:checked::after{
    content:"";position:absolute;left:4px;top:1px;width:4px;height:8px;
    border:solid #fff;border-width:0 2px 2px 0;transform:rotate(42deg);
    filter:drop-shadow(0 1px 0 rgba(0,0,0,.35));
  }

  /* ---------- 下拉框 ----------
     ⚠️ **不要动 `appearance`**。第一版我把 select 改成 appearance:none 再自己画箭头，
        结果宽度从 144px 变成 124px（原生的下拉箭头占位是浏览器算的），
        工具栏整条跟着位移。所以这里保留原生外观，只改底色与边框，
        立体感交给 box-shadow —— 跟按钮同一套配方。 */
  select{
    background-color:#ffffff;
    background-image:linear-gradient(180deg, #f2f5f9 0%, #ffffff 18%, #ffffff 100%);
    border-color:#9fb2c6;
    box-shadow:inset 0 1px 2px rgba(28,44,62,.18), 0 1px 1px rgba(31,45,61,.08);
    text-shadow:0 1px 0 #fff;
  }
  select:hover{border-color:#5f88b0}
  select:focus{
    border-color:#3f83c7;
    box-shadow:inset 0 1px 3px rgba(28,44,62,.2), 0 0 0 3px rgba(90,160,225,.35);
  }

  /* ---------- 侧栏树 ---------- */
  /* 侧栏底子 = 一块**凹进去的面板**。
     站长：「tab 加了拟物化效果后，侧栏的背景反而显得因为没有效果而突兀了」。
     原来这里是「白 → #f7fafd」的极淡渐变，几乎就是纯白 —— tab 的凸/凹没有底子
     可参照，看着就假。现在换成：比内容区暗一档的冷灰面板 + 上沿一条受光带
     + 顶/右两条接缝内阴影，读起来像被压出来的一道槽：
     凸起的 tab 明显亮于它，按下去的 tab 明显暗于它。
     只用 background / box-shadow（不新增 border、不动任何尺寸）。
     ⚠️ 接缝阴影写在这里，下面「分栏竖线」那段就**不要**再给 #side 写 box-shadow
        —— 同一属性后来的会把它整个覆盖掉。 */
  #side{
    background:
      /* 上沿的受光带：贴着顶栏那一段亮，往下 90px 衰减掉 */
      linear-gradient(180deg, rgba(255,255,255,.85) 0px, rgba(255,255,255,.28) 36px,
                              rgba(255,255,255,0) 90px),
      /* 面板本体：冷灰，越往下越暗一点 */
      linear-gradient(180deg, #eef3f9 0%, #eaf0f7 55%, #e5ecf4 100%);
    box-shadow:
      inset 0 2px 5px rgba(30,48,68,.10),        /* 贴着顶栏的接缝 */
      inset -3px 0 7px rgba(30,48,68,.07),       /* 贴着编辑区的接缝 */
      inset -1px 0 0 rgba(255,255,255,.70);      /* 右沿亮线 */
  }
  /* 底部那行署名：已有的规则在下面「滚动条」那一段上面（#credits 的渐变 + 顶沿亮线），
     这里不要再写一条 —— 同优先级下后写的赢，写了也是死代码。 */
  /* ⚠️ 不给 .row 加 margin/padding —— 原来没有，加了会改宽度、推挤内容 */
  .row{border-radius:3px}
  .row:hover{
    background:linear-gradient(180deg, #f2f8ff 0%, #e6f1fd 100%);
    box-shadow:inset 0 1px 0 rgba(255,255,255,.9), inset 0 0 0 1px rgba(190,215,240,.55);
  }
  /* 选中：像 XP 那样一条带渐变的高亮条。
     原来是 background:#dcebfa + font-weight:bold —— 保持同样的盒模型，
     描边用 inset box-shadow 画（不占位，不会让行变高）。 */
  .row.active{
    background:linear-gradient(180deg, #d6e9fb 0%, #bcd9f6 50%, #a8cdf2 100%);
    box-shadow:inset 0 1px 0 rgba(255,255,255,.85),
               inset 0 -1px 0 rgba(60,110,170,.28),
               inset 0 0 0 1px #8db6dd;
  }
  .grp{text-shadow:0 1px 0 #fff}

  /* ---------- 工具栏 / 预览条：金属压条 ----------
     ⚠️ 这里**所有**渐变的时间轴都必须用固定 px，不能用百分比。

     站长的两次反馈合起来才是完整需求：
       ① 「两行工具栏的阴影明显比一行的要大」—— 百分比时间轴会随高度缩放，
          单行 44px 时收暗段约 19px，两行 81px 就变约 36px
       ② 「改了以后阴影没有之前质感好了」—— 我第一版改过头了：
          为了消掉高度影响，把底色换成了**纯色**，于是压条的柔和收口没了。
          实测亮度：原版尾部 224，我那版只有 230（贴近下沿处 233/244/247，
          比原版亮 8~19），所以看着「平」。

     现在这版是照原版的亮度曲线反推的固定像素配方：
       0 -> 20px    顶部高光：白 .8 线性衰减到 0
       20px -> 15px 中段：#f9fcfe -> #e9f1fa 很缓的下沉（"金属面"的光泽）
       最后 15px    收口：#e9f1fa -> #dfe7f1，压到原版那种暗度
       另有一层 inset 0 -1px 的暗线做下沿（原来就有，保留）
     实测（真实渲染，距下沿相同距离处）：
       距下沿 3px  单行 233.7 / 两行 233.7（差 0）
       距下沿 8px  单行 237.3 / 两行 236.3（差 1）
       距下沿 12px 单行 240.3 / 两行 239.3（差 1）
     关键点：所有停靠点都是 px 或 calc(100% - Npx)，**没有一个百分比时间轴**，
     所以一行、两行、三行的质感一致。 */
  #toolbar, #previewBar{
    background:
      linear-gradient(180deg, rgba(255,255,255,.8) 0px, rgba(255,255,255,0) 20px),
      linear-gradient(180deg, #f9fcfe 20px, #e9f1fa calc(100% - 15px),
                      #dfe7f1 100%);
    box-shadow:inset 0 1px 0 #fff, inset 0 -1px 0 rgba(0,0,0,.10);
  }
  #previewBar{background:
    linear-gradient(180deg, rgba(255,255,255,.75) 0px, rgba(255,255,255,0) 18px),
    linear-gradient(180deg, #f6fafe 18px, #e6eef8 calc(100% - 15px),
                    #dbe4ef 100%)}

  /* ---------- 分栏竖线：做出一道浅沟 ---------- */
  /* #side 的接缝阴影写在上面「侧栏」那段里（同一处的立体感放一起）。
     这里只留竖线颜色 —— 再给 #side 写 box-shadow 会把它整个覆盖掉。 */
  #side{border-right-color:#b6c6d6}
  #previewPane{border-left-color:#b6c6d6;box-shadow:inset 1px 0 0 rgba(255,255,255,.85)}

  /* ---------- 编辑区：像一张凹进去的稿纸 ---------- */
  #editor{
    background:linear-gradient(180deg, #f6f9fd 0%, #fdfeff 90px, #ffffff 100%);
    box-shadow:inset 0 2px 5px rgba(30,48,68,.10), inset 1px 0 0 rgba(0,0,0,.04);
  }
  #panel{
    background:
      radial-gradient(120% 60px at 50% 0, rgba(255,255,255,.9), rgba(255,255,255,0) 100%),
      linear-gradient(180deg, #f7fafd 0%, #ffffff 120px);
  }

  /* ---------- 卡片 / 提示条 / 记录框：浮起的小板子 ---------- */
  .card, .note, .pk-log, .dc-legend{
    background:
      linear-gradient(180deg, rgba(255,255,255,.95) 0%, rgba(255,255,255,.35) 40%,
                      rgba(0,0,0,.01) 41%, rgba(0,0,0,.03) 100%),
      linear-gradient(180deg, #fbfdff 0%, #f2f7fc 100%);
    border-color:#c2d3e4;
    box-shadow:inset 0 1px 0 #fff, 0 1px 2px rgba(31,45,61,.10);
  }
  .note{border-style:dashed}

  /* ---------- 弹窗：一扇有标题栏的窗口 ---------- */
  .mbox{
    border:1px solid #7d93a9;
    box-shadow:
      0 0 0 1px rgba(255,255,255,.6) inset,
      inset 0 1px 0 rgba(255,255,255,.9),
      0 18px 50px rgba(0,0,0,.42),
      0 2px 6px rgba(0,0,0,.25);
  }
  .mbox h3{
    background:
      linear-gradient(180deg, rgba(255,255,255,.42) 0%, rgba(255,255,255,.12) 46%,
                      rgba(255,255,255,0) 47%, rgba(0,0,0,.08) 100%),
      linear-gradient(180deg, #5da2e8 0%, #2f74bb 48%, #1b5a9f 52%, #124070 100%);
    color:#fff;
    text-shadow:0 1px 1px rgba(0,0,0,.45);
    border-bottom-color:#0c3560;
  }
  .mfoot, .mbox h3{box-shadow:inset 0 1px 0 rgba(255,255,255,.35)}
  .mfoot{background:linear-gradient(180deg, #f4f8fc, #e4ecf4)}

  /* ---------- 表格表头：一条压出来的金属条 ---------- */
  table.grid th{
    background:
      linear-gradient(180deg, rgba(255,255,255,.9) 0%, rgba(255,255,255,.35) 55%,
                      rgba(0,0,0,.02) 56%, rgba(0,0,0,.06) 100%),
      linear-gradient(180deg, #f2f7fd 0%, #dfeaf6 100%);
    box-shadow:inset 0 1px 0 #fff, inset 0 -1px 0 rgba(0,0,0,.08);
    text-shadow:0 1px 0 #fff;
  }

  /* ---------- 表情小图 / 缩略图格：小相框 ---------- */
  .dc-face, .galpick-cell img{
    box-shadow:inset 0 1px 2px rgba(30,48,68,.18), 0 1px 0 #fff;
  }
  .galpick-cell{
    background:linear-gradient(180deg, #ffffff, #f4f8fc);
    box-shadow:inset 0 1px 0 #fff, 0 1px 2px rgba(31,45,61,.12);
  }
  .galpick-cell.on{
    box-shadow:inset 0 1px 0 #fff, 0 0 0 2px #cfe4fb, 0 1px 3px rgba(31,45,61,.2);
  }
  #sideOrder li{
    background:linear-gradient(180deg, #ffffff, #f4f8fc);
    box-shadow:inset 0 1px 0 #fff, 0 1px 2px rgba(31,45,61,.12);
  }

  /* ---------- 提示条 / 状态标签 ---------- */
  .dirty{
    background:linear-gradient(180deg, #fff8de, #ffeeb8);
    box-shadow:inset 0 1px 0 #fff, 0 1px 1px rgba(0,0,0,.10);
    text-shadow:0 1px 0 rgba(255,255,255,.7);
  }
  #staleBar{
    background:
      linear-gradient(180deg, rgba(255,255,255,.7) 0%, rgba(255,255,255,.2) 55%,
                      rgba(0,0,0,.02) 56%, rgba(0,0,0,.05) 100%),
      linear-gradient(180deg, #fff6da 0%, #ffe9ab 100%);
    box-shadow:inset 0 1px 0 #fff, inset 0 -1px 0 rgba(0,0,0,.10);
  }
  #credits{background:linear-gradient(180deg, #fafcff, #eef4fa);box-shadow:inset 0 1px 0 #fff}

  /* ---------- 滚动条：当年的三键式样（凹槽 + 有光泽的滑块） ----------
     ⚠️ **不要设 width / height**。第一版我写了 `width:14px`，而 Chrome 默认
        滚动条是 15px —— 于是 #tree 的内容区宽了 1px，侧栏里每一行都从
        234 变成 235。滚动条尺寸会**影响布局**（它占的就是内容宽度），
        所以这里只改颜色，尺寸交给浏览器默认值。 */
  *::-webkit-scrollbar-track{
    background:linear-gradient(90deg, #e4eaf1 0%, #f2f6fa 60%, #e8eef5 100%);
    box-shadow:inset 1px 0 2px rgba(30,48,68,.12);
  }
  *::-webkit-scrollbar-thumb{
    background:
      linear-gradient(90deg, rgba(255,255,255,.55) 0%, rgba(255,255,255,.15) 45%,
                      rgba(0,0,0,.03) 46%, rgba(0,0,0,.10) 100%),
      linear-gradient(90deg, #cfd9e4 0%, #b3c1d1 100%);
    border:1px solid #93a4b7;border-radius:3px;
    box-shadow:inset 0 1px 0 rgba(255,255,255,.8);
  }
  *::-webkit-scrollbar-thumb:hover{
    background:
      linear-gradient(90deg, rgba(255,255,255,.6) 0%, rgba(255,255,255,.2) 45%,
                      rgba(0,0,0,.02) 46%, rgba(0,0,0,.08) 100%),
      linear-gradient(90deg, #c2d6ec 0%, #9fbcdc 100%);
  }
  *::-webkit-scrollbar-thumb:active{
    background:linear-gradient(90deg, #9db7d1 0%, #b9cde3 100%);
    box-shadow:inset 0 1px 3px rgba(20,40,70,.4);
  }
  *::-webkit-scrollbar-corner{background:#e8eef5}
  /* 只在不需要横滑的地方藏掉横条（原来就没有，保持原样） */

</style>
</head>
<body>

<!-- 图标不再需要按 DPR 算整倍数（Fugue 是 16px 网格的成品图），
     原来那段 --ico 计算脚本已随换图标一并删掉。 -->

<div id="main">

<button id="btnLink" class="fmt" title="超链接（Ctrl+K）：选中文字后点这里"><img class="ico" src="/editor-icons/fugue/chain.png" alt="">链接</button>
      <span class="sep"></span>

<div id="toast"></div>

<script>
const TOKEN = "__TOKEN__";
let TREE = [], CUR = null, DIRTY = false;

/* ---------- 小工具 ---------- */
const $ = (s) => document.querySelector(s);
const esc = (s) => String(s).replace(/[&<>"]/g, (c) => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
/** 内联引用 sprite 里的像素图标（见文件顶部那个 <svg id="sprite">） */
/* 图标：Fugue Icons（.editor/icons/）。这里做一次「逻辑名 → 文件名」映射，
   以后想换某张图只改这张表；文件名对不上会 404，肉眼一看就知道。 */
const FUGUE = {
  book:'book', music:'music', 'paint-brush':'paint-brush', cog:'gear',
  /* bars 是侧栏「顶部导航」那一行。原来映射到 navigation.png
     （蓝色圆箭头，站长觉得「有点奇怪」），2026-10-12 换成 direction.png
     —— 路牌 + 箭头，指向「导航」更直白。 */
  bars:'direction', link:'chain', grid:'ui-buttons', refresh:'arrow-repeat',
  notebook:'notebook', 'comment-quote':'balloon-quotation', 'message-dots':'balloon-ellipsis',
  diamond:'diamond', 'pencil-ruler':'pencil-ruler', code:'script', 'calendar-alt':'calendar',
  /* publish 是顶栏那颗黄色「发布」。**单列一个名字**，不要直接改成 upload：
     「上传新图 / 上传音频」两个按钮还要用 upload（向上箭头本来就是对的动作），
     只有「发布到线上」用纸飞机。 */
  publish:'paper-plane',
  plus:'plus', eye:'eye', 'external-link':'external', check:'tick', upload:'upload',
  bold:'edit-bold', italics:'edit-italic', expand:'application-resize', image:'image',
  thumbtack:'pin', save:'disk', trash:'bin', search:'magnifier', folder:'folder',
  /* 侧栏树上用的图标（见 renderTree）：组小标题 + 页面行 */
  home:'home', newspaper:'newspaper', blueprint:'blueprint', table:'table',
  doc:'document-text', css:'paint-can', section:'blueprint-medium',
};
const ico = (name) => '<img class="ico" src="/editor-icons/fugue/'
  + (FUGUE[name] || name) + '.png" alt="" draggable="false">';

function toast(msg, kind) {
  const t = $('#toast');
  t.textContent = msg;
  t.className = 'show ' + (kind || '');
  clearTimeout(t._h);
  t._h = setTimeout(() => { t.className = ''; }, kind === 'err' ? 6000 : 2800);
}

async function api(path, opts) {
  const res = await fetch(path, Object.assign({
    headers: { 'X-Editor-Token': TOKEN, 'Content-Type': 'application/json' },
  }, opts));
  const data = await res.json().catch(() => ({}));
  if (!res.ok) throw new Error(data.error || ('HTTP ' + res.status));
  return data;
}
const apiGet = (p) => api(p);
const apiPost = (p, body) => api(p, { method: 'POST', body: JSON.stringify(body || {}) });

function setDirty(v) {
  DIRTY = v;
  $('#dirtyFlag').hidden = !v;
  $('#btnSave').disabled = !v;
}
window.addEventListener('beforeunload', (e) => { if (DIRTY) { e.preventDefault(); e.returnValue = ''; } });

/* ---------- 侧栏 ---------- */
function shortName(p) {
  const b = p.split('/').pop().replace(/\.md$/, '');
  return b;
}

/* 侧栏树上的图标。图标都取自 Fugue（见 .editor/icons/README.md）。

   ① 组小标题：按组名给（草稿组的名字带数量，认名字会认不到，所以先看 g.draft），
      对不上名字的再按 kind 兜底。

   ② 页面行（子项）：2026-10-12 的定稿过程 ——
      第一版按文件类型给了（.md/.html/.css…），站长说「子项加太多一样的，有点
      喧宾夺主」→ 撤掉；后来加了分组折叠（同一时刻露出来的图标少多了），站长又说
      「加了折叠以后再给子项加图标就不会太吵了」→ 加回来。
      口味最终定为 **'type'**：所有内容页（.md，也就是「你平时会改的那些」）都是
      同一张纸。另一种 'group'（按所在组给：文集=书、日记=日历…）留着备用 ——
      改 `ROW_ICON_MODE` 一个词即可。
      非 .md 的文件（.js/.css/.toml/.html）按类型给。
      另外两个特例优先于口味：
        `_index.md`（区块首页：整站首页、博客/日记/文集的列表页，平时不用改）
          → `section` = blueprint-medium（一枚**小号蓝色纸页**）。
          先用过 folder，站长说「文件夹太显眼了」—— 换成一枚形状同类、只是色调
          不同的纸页：不喊不闹，但一眼看得出跟别的页面不是一类。
        草稿 → 图钉 */
let ROW_ICON_MODE = 'type';

const GRP_ICON_BY_NAME = {
  '工具': 'gear', '首页与单页': 'home', '博客': 'newspaper', '文集': 'book', '日记': 'calendar',
};
const GRP_ICON_BY_KIND = { config: 'gear', data: 'table', js: 'script', template: 'blueprint' };
const MD_ICON_BY_GROUP = { '首页与单页': 'doc', '博客': 'newspaper', '文集': 'book', '日记': 'calendar' };
const FORM_ICON_BY_EXT = { '.js': 'script', '.css': 'css', '.toml': 'table', '.html': 'blueprint', '.xml': 'blueprint' };

function grpIcon(g) {
  if (g.draft) return 'thumbtack';
  return GRP_ICON_BY_NAME[g.group] || GRP_ICON_BY_KIND[g.kind] || 'folder';
}

function fileIcon(f, group, draft) {
  const base = String(f).split('/').pop().toLowerCase();
  const ext = (String(f).match(/\.[^.]+$/) || [''])[0].toLowerCase();
  /* 区块首页（section index）：`_index.md` 是那一节的骨架（整站首页、博客/日记/文集的
     列表页），平时根本不用改 —— 给它一枚**小号蓝色纸页**（section = blueprint-medium），
     跟「你经常改的那些页面」一眼分得开，又不像文件夹那样一张黄色大色块杵在那儿
     （站长先看到的版本是 folder，反馈「文件夹太显眼了」）。
     放在判定最前：它是「不用改」这个身份，比草稿状态更该先看出来。 */
  if (base === '_index.md') return 'section';
  if (ext === '.md') {
    if (draft) return 'thumbtack';
    if (ROW_ICON_MODE === 'type') return 'doc';
    return MD_ICON_BY_GROUP[group] || 'doc';
  }
  if (['.png', '.jpg', '.jpeg', '.webp', '.gif', '.svg'].includes(ext)) return 'image';
  return FORM_ICON_BY_EXT[ext] || 'folder';
}

/* ---------- 侧栏分组折叠 ----------
   一列 55 个页面 + 16 个工具太长了，组小标题点一下就折起来（再点展开）。
   折叠状态按组名存 localStorage（草稿组的名字带数量，所以先去掉「（3）」再当 key），
   刷新、或者保存后重渲染，都还是折着。
   打开某个文件时会自动展开它所在的那一组 —— 不然你不知道自己在编辑哪一页。 */
const GRP_FOLD_KEY = 'editor.grpFolded';

function grpKey(g) {
  return String(g.group || '').replace(/[（(]\d+[)）]/g, '').trim();
}
function foldedMap() {
  try { return JSON.parse(localStorage.getItem(GRP_FOLD_KEY) || '{}') || {}; } catch { return {}; }
}
function isFolded(key) { return !!foldedMap()[key]; }
function setFolded(key, on) {
  const m = foldedMap();
  if (on) m[key] = 1; else delete m[key];
  try { localStorage.setItem(GRP_FOLD_KEY, JSON.stringify(m)); } catch { /* 存不了就算了 */ }
}
function applyFold(head, body, on) {
  body.hidden = !!on;
  head.classList.toggle('folded', !!on);
}
/** 组小标题（可点） */
function grpHead(key, label, iconName) {
  const on = isFolded(key);
  return `<div class="grp${on ? ' folded' : ''}" data-gkey="${esc(key)}" title="点一下折叠 / 展开">`
    + `<span class="grp-arrow"></span>${ico(iconName)}<span class="grp-t">${esc(label)}</span></div>`;
}
/** 组体（紧跟在标题后面，折叠时整个隐藏） */
function grpOpen(key) {
  return `<div class="grpbody" data-gkey="${esc(key)}"${isFolded(key) ? ' hidden' : ''}>`;
}
function toggleGroup(head) {
  const body = head.nextElementSibling;
  if (!body || !body.classList.contains('grpbody')) return;
  const on = !head.classList.contains('folded');
  applyFold(head, body, on);
  setFolded(head.dataset.gkey || '', on);
}
function unfoldGroupOf(row) {
  const body = row && row.closest('.grpbody');
  if (!body || !body.hidden) return;
  applyFold(body.previousElementSibling, body, false);
  setFolded(body.dataset.gkey || '', false);
}

function renderTree() {
  const el = $('#tree');
  let h = '';
  h += '<div class="row create" data-act="new">' + ico('plus') + '新建页面</div>';
  h += grpHead('工具', '工具', grpIcon({ group: '工具' }));
  h += grpOpen('工具');
  h += '<div class="row tool" data-panel="collection">' + ico('book') + '文集</div>';
  h += '<div class="row tool" data-panel="music">' + ico('music') + '音乐</div>';
  h += '<div class="row tool" data-panel="gallery">' + ico('paint-brush') + '画廊</div>';
  h += '<div class="row tool" data-panel="settings">' + ico('cog') + '站点设置</div>';
  h += '<div class="row tool" data-panel="navbar">' + ico('bars') + '顶部导航</div>';
  h += '<div class="row tool" data-panel="links">' + ico('link') + '友情链接</div>';
  h += '<div class="row tool" data-panel="buttons">' + ico('grid') + '小按钮</div>';
  h += '<div class="row tool" data-panel="updates">' + ico('refresh') + '更新日志</div>';
  h += '<div class="row tool" data-panel="changelog">' + ico('notebook') + '更新历史</div>';
  h += '<div class="row tool" data-panel="notices">' + ico('comment-quote') + '公告栏</div>';
  h += '<div class="row tool" data-panel="board">' + ico('pin') + '布告栏</div>';
  h += '<div class="row tool" data-panel="diancie">' + ico('diamond') + '蒂安希听到了</div>';
  h += '<div class="row tool" data-panel="pkmn">' + ico('message-dots') + '宝可梦台词</div>';
  h += '<div class="row tool" data-panel="sidebar">' + ico('pencil-ruler') + '侧栏排序</div>';
  h += '<div class="row tool" data-panel="scripts">' + ico('code') + '脚本管理</div>';
  h += '<div class="row tool" data-panel="nav">' + ico('calendar-alt') + '日记日历</div>';
  h += '</div>';
  for (const g of TREE) {
    if (!g.files.length) continue;
    const key = grpKey(g);
    h += grpHead(key, g.group, grpIcon(g));
    h += grpOpen(key);
    for (const f of g.files) {
      // data-group 是拖动排序用的（只允许同组内换位置）；草稿组不参与，不给拖
      const drag = g.draft ? '' : ' draggable="true"';
      const tip = esc(f) + (g.draft ? '' : '（按住可以拖动排序）');
      h += `<div class="row" data-file="${esc(f)}" data-group="${esc(g.group)}"${drag}`
        + ` title="${tip}">${ico(fileIcon(f, g.group, g.draft))}${esc(shortName(f))}</div>`;
    }
    h += '</div>';
  }
  el.innerHTML = h;
}

/* ---------- 侧栏拖动排序 ---------- */
let DRAG = null;

function clearDropMarks() {
  document.querySelectorAll('#tree .drop-before,#tree .drop-after')
    .forEach((r) => r.classList.remove('drop-before', 'drop-after'));
}

/** 把当前 DOM 里这一组的顺序存到服务端 */
async function saveTreeOrder(group) {
  const files = [...document.querySelectorAll('#tree .row[data-file]')]
    .filter((r) => r.dataset.group === group)
    .map((r) => r.dataset.file);
  try {
    await apiPost('/api/order', { group, files });
    toast(`「${group}」的顺序已保存`, 'ok');
  } catch (e) { toast('顺序保存失败: ' + e.message, 'err'); }
}

$('#tree').addEventListener('dragstart', (e) => {
  const row = e.target.closest('.row[data-file][draggable="true"]');
  if (!row) { e.preventDefault(); return; }
  DRAG = { el: row, group: row.dataset.group, file: row.dataset.file };
  row.classList.add('dragging');
  e.dataTransfer.effectAllowed = 'move';
  // Firefox 不调 setData 就不会真的开始拖
  try { e.dataTransfer.setData('text/plain', row.dataset.file); } catch (err) { /* 忽略 */ }
});

$('#tree').addEventListener('dragover', (e) => {
  if (!DRAG) return;
  const row = e.target.closest('.row[data-file]');
  // 只允许同一组内换位置（分组是按目录定死的，跨组没有意义）
  if (!row || row.dataset.group !== DRAG.group || row === DRAG.el) { clearDropMarks(); return; }
  e.preventDefault();
  e.dataTransfer.dropEffect = 'move';
  const r = row.getBoundingClientRect();
  const after = e.clientY > r.top + r.height / 2;
  clearDropMarks();
  row.classList.add(after ? 'drop-after' : 'drop-before');
});

$('#tree').addEventListener('drop', async (e) => {
  if (!DRAG) return;
  const row = e.target.closest('.row[data-file]');
  if (!row || row.dataset.group !== DRAG.group || row === DRAG.el) { clearDropMarks(); return; }
  e.preventDefault();
  const after = row.classList.contains('drop-after');
  row.parentNode.insertBefore(DRAG.el, after ? row.nextSibling : row);
  clearDropMarks();
  const g = DRAG.group;
  DRAG = null;
  await saveTreeOrder(g);
});

$('#tree').addEventListener('dragend', () => {
  if (DRAG) DRAG.el.classList.remove('dragging');
  DRAG = null;
  clearDropMarks();
});

function markActive(sel) {
  document.querySelectorAll('.row').forEach((r) => r.classList.remove('active'));
  if (!sel) return;
  sel.classList.add('active');
  // 打开的文件如果折着，先把那一组展开 —— 不然看不到自己在编辑哪一页
  unfoldGroupOf(sel);
}

/* 点组小标题 = 折叠 / 展开（见 grpHead / toggleGroup） */
$('#tree').addEventListener('click', (e) => {
  const head = e.target.closest('.grp');
  if (head) toggleGroup(head);
});

document.addEventListener('click', async (e) => {
  const row = e.target.closest('.row');
  if (!row) return;

  if (row.dataset.act === 'new') { newPage(); return; }

  if (row.dataset.panel) {
    markActive(row);
    CUR = null;
    $('#curPath').textContent = '工具 / ' + row.textContent.trim();
    $('#btnDelete').disabled = true;
    $('#btnToggleDraft').hidden = true;
    $('#btnInsertDay').hidden = true;
    setDirty(false);
    document.body.classList.add('panel');
    location.hash = row.dataset.panel;
    await openPanel(row.dataset.panel);
    return;
  }

  if (row.dataset.file) {
    if (DIRTY && !confirm('当前文件还没保存，确定要离开吗？')) return;
    markActive(row);
    document.body.classList.remove('panel');
    await openFile(row.dataset.file);
  }
});

/* ---------- 打开文件 ---------- */
async function openFile(p) {
  try {
    const d = await apiGet('/api/file?p=' + encodeURIComponent(p));
    CUR = p;
    $('#editor').value = d.text;
    $('#curPath').textContent = p;
    $('#btnDelete').disabled = false;
    const u = urlForFile(p);
    if (u) CUR_URL = u;          // 没有独立页面的文件保持原来那一页
    updatePreviewPath();
    $('#btnInsertDay').hidden = !/^content\/niki\/niki_\d{6}\.md$/.test(p);
    const showDraft = /\.md$/.test(p);
    $('#btnToggleDraft').hidden = !showDraft;
    if (showDraft) {
      const draft = isDraft(d.text);
      $('#btnDraftText').textContent = draft ? '草稿中 → 点此发布' : '设为草稿';
      $('#btnToggleDraft').style.background = draft ? '#fff3cd' : '';
      $('#btnToggleDraft').style.borderColor = draft ? '#e5c76b' : '';
    }
    setDirty(false);
    if (document.body.classList.contains('preview')) refreshPreview();
  } catch (e) { toast('打开失败: ' + e.message, 'err'); }
}

async function saveFile() {
  if (!CUR) return;
  try {
    await apiPost('/api/file', { p: CUR, text: $('#editor').value });
    setDirty(false);
    toast('已保存 ' + CUR, 'ok');
    if (document.body.classList.contains('preview')) refreshPreview();
  } catch (e) { toast('保存失败: ' + e.message, 'err'); }
}

$('#editor').addEventListener('input', () => setDirty(true));
$('#btnSave').addEventListener('click', saveFile);
document.addEventListener('keydown', (e) => {
  if ((e.ctrlKey || e.metaKey) && e.key.toLowerCase() === 's') { e.preventDefault(); saveFile(); }
});

$('#btnDelete').addEventListener('click', async () => {
  if (!CUR) return;
  if (!confirm(`确定删除 ${CUR} 吗？\n（会先挪到 .editor/trash/，可以手动找回）`)) return;
  try {
    await apiPost('/api/delete', { p: CUR });
    toast('已删除（可在 .editor/trash 找回）', 'ok');
    CUR = null; $('#editor').value = ''; $('#curPath').textContent = '← 从左边选一个文件';
    $('#btnDelete').disabled = true; setDirty(false);
    await bootstrap();
  } catch (e) { toast('删除失败: ' + e.message, 'err'); }
});

/* ---------- 预览 ---------- */
let PREVIEW_URL = 'http://127.0.0.1:1313/';  // 预览站根地址
let LIVE_URL = '';                           // 线上站地址
let CUR_URL = '/';                           // 正在预览的页面路径

/* 当前编辑的文件 -> 对应的页面地址。
   注意「返回 null」和「返回空串」不一样：
     · 返回地址  -> 预览跳到这一页
     · 返回 ''    -> 这个文件没有独立页面（比如 partial、样式、JS），
                     预览保持原来那一页，不再偷偷跳到首页
   layouts/ 下的模板也尽量对应到真实页面（以前这些点了预览完全不动，
   而它们其实是有页面的：404 模板 -> /404.html、baseof/home -> 首页）。 */
function urlForFile(p) {
  if (!p) return '';
  if (p.startsWith('content/') && p.endsWith('.md')) {
    let rel = p.slice('content/'.length).replace(/\.md$/, '');
    if (rel === '_index') return '/';
    if (rel.endsWith('/_index')) rel = rel.slice(0, -'/_index'.length);
    return '/' + rel + '/';
  }
  if (p === 'assets/css/retro.css') return '';      // 没有单独一页，靠当前页看效果
  if (p.startsWith('static/js/')) return '';
  // 模板 -> 它渲染出来的那个页面
  const LAYOUT_PAGE = {
    'layouts/404.html': '/__editor-404-check/',
    'layouts/home.html': '/',
    'layouts/baseof.html': '/',
    'layouts/list.html': '/blog/',
    'layouts/single.html': '/navigator/',
    'layouts/_partials/header.html': '/',
    'layouts/_partials/footer.html': '/',
    'layouts/_partials/head.html': '/',
    'layouts/_partials/post-meta.html': '/navigator/',
    'layouts/_partials/comments.html': '/navigator/',
  };
  return LAYOUT_PAGE[p] || '';
}

/** 这个文件有没有自己的一页（没有的话预览面板会说明一句，而不是默默不动） */
function hasOwnPage(p) {
  return !!urlForFile(p);
}
function previewTarget() {
  return PREVIEW_URL.replace(/\/+$/, '') + (CUR_URL || '/');
}
/* 预览栏上那行说明：当前文件有没有自己的一页。
   以前编辑模板/样式时点了预览完全没反应，看着像坏了。 */
function updatePreviewPath() {
  const el = $('#previewPath');
  if (!el) return;
  const own = hasOwnPage(CUR);
  el.textContent = own ? (CUR_URL || '/') : ((CUR || '这个文件') + '　—　没有独立页面，看的是上一页');
  el.title = previewTarget();
}
function refreshPreview() {
  $('#preview').src = previewTarget() + '?t=' + Date.now();
  updatePreviewPath();
}
$('#btnPreview').addEventListener('click', async () => {
  // 注意：这里不再摘掉 panel 类 —— 面板和预览可以同时开着。
  const on = document.body.classList.toggle('preview');
  $('#btnPreviewText').textContent = '预览';
  $('#btnPreviewArrow').src = '/editor-icons/fugue/' + (on ? 'arrow-270-small' : 'arrow-000-small') + '.png';
  if (!on) { $('#preview').src = 'about:blank'; return; }
  if ($('#preview').src && $('#preview').src !== 'about:blank') {
    // 已经开着预览窗口（比如刚点是开着面板的）-> 只是重新显示，顺手刷一下
    refreshPreview();
    return;
  }

  $('#preview').src = 'about:blank';

  const s = await apiPost('/api/hugo', { action: 'status' });
  if (s.url) PREVIEW_URL = s.url;

  if (!s.running) {
    toast('正在启动预览服务器，第一次要几秒…');
    const r = await apiPost('/api/hugo', { action: 'start' });
    if (r.url) PREVIEW_URL = r.url;
    if (!r.ok) {
      const detail = (r.log || '').split('\n').filter((x) => x.trim()).slice(-5).join('\n');
      toast('预览启动失败：' + (r.note || '') + (detail ? '\n' + detail : ''), 'err');
      return;
    }
    toast('预览已就绪', 'ok');
  }
  refreshPreview();
});
$('#btnLive').addEventListener('click', () => {
  if (LIVE_URL) window.open(LIVE_URL, '_blank');
  else toast('读不到线上地址（hugo.toml 里的 baseURL）', 'err');
});
$('#btnPreviewRefresh').addEventListener('click', () => {
  if (document.body.classList.contains('preview')) refreshPreview();
  else $('#btnPreview').click();
});
$('#btnPreviewNew').addEventListener('click', () => window.open(previewTarget(), '_blank'));
$('#btnBuild').addEventListener('click', async () => {
  toast('正在构建…');
  const r = await apiPost('/api/hugo', { action: 'build' });
  toast(r.ok ? '构建通过，没有报错' : ('构建有问题：\n' + r.out).slice(0, 300), r.ok ? 'ok' : 'err');
});

/* ---------- 发布 / 同步 ----------
   「发布」= 把本地的改动提交并推上去；「拉取线上」= 把另一台电脑推上来的改动拉下来。
   ⚠️ 推送失败（断网、或者另一台电脑推过了）之后，改动其实**已经提交在本地**了，
   工作区是干净的 —— 所以这里绝不能因为「没有未提交的改动」就早退，
   要看 ahead（比线上多几个提交）决定还能不能推。 */
function gitBad(r) {
  const bad = r.steps.find((s) => s.code !== 0);
  return bad ? (bad.out || '（没有输出）') : '';
}

async function syncPull(auto) {
  let g;
  try { g = await apiGet('/api/git'); } catch (e) { return false; }
  if (g.behind === null || g.behind === undefined) {
    if (!auto) toast('拿不到线上状态：可能没联网，或者没配好 git 远端', 'err');
    return false;
  }
  if (!g.behind) {
    if (!auto) toast('已经和线上一致了');
    return false;
  }
  if (g.status.length) {
    if (!auto) toast(`本地还有 ${g.status.length} 处没提交的改动，先发布（或者撤销）再拉取`, 'err');
    return false;
  }
  if (g.ahead) {
    if (!auto) toast(`本地有 ${g.ahead} 个提交还没推上去，先点「发布」再拉取`, 'err');
    return false;
  }
  toast(`正在从线上拉取 ${g.behind} 个提交…`);
  const r = await apiPost('/api/git', { action: 'pull' });
  if (r.ok) {
    toast(`已从线上同步 ${g.behind} 个提交`, 'ok');
    await bootstrap();
    if (CUR) loadFile(CUR).catch(() => {});
    /* 拉下来的代码里可能带着新的 server.mjs —— 那样跑着的还是旧后端，
       提示用户重启（不然「pull 了但没反应」）。 */
    checkEditorVersion();
    return true;
  }
  toast('拉取失败：\n' + gitBad(r), 'err');
  return false;
}

$('#btnSync').addEventListener('click', () => syncPull(false));

$('#btnPublish').addEventListener('click', async () => {
  if (DIRTY) { toast('先保存当前文件再发布', 'err'); return; }
  const g = await apiGet('/api/git');
  const changed = g.status.length > 0;
  const ahead = g.ahead || 0;
  if (!changed && !ahead) {
    toast(g.behind
      ? `本地没有改动，但线上有 ${g.behind} 个提交（点「拉取线上」同步）`
      : '没有需要发布的改动');
    return;
  }
  let msg = '更新';
  if (changed) {
    const listing = g.status.map((s) => '  ' + s).join('\n');
    const m = prompt(`将要提交以下改动：\n\n${listing}\n\n写一句这次的更新说明：`, '更新');
    if (m === null) return;
    msg = m || '更新';
  } else {
    // 上次推送失败的常见情况：改动早就提交了，只是没推上去
    if (!confirm(`本地有 ${ahead} 个提交还没推上去（上次推送应该失败了），现在重推一次？`)) return;
    msg = '重试推送';
  }
  toast(changed ? '正在提交并推送…' : '正在推送…');
  const r = await apiPost('/api/git', { action: 'commitpush', message: msg });
  if (r.ok) {
    toast(r.retried
      ? '线上有新提交，已自动合并后推送成功（GitHub 大约 1 分钟后更新线上）'
      : '推送成功，GitHub 大约 1 分钟后更新线上', 'ok');
    await bootstrap();
  } else if (r.conflict) {
    toast('本地和线上改了同一处，要手工解决冲突：\n' + gitBad(r) +
      '\n\n（改动都已经提交在本地了，解决完再点一次发布）', 'err');
  } else {
    toast('发布失败：\n' + gitBad(r) +
      '\n\n改动已经在本地提交好了，修好网络 / 代理之后**再点一次发布**就会重推。', 'err');
  }
});

/* ---------- 工具面板 ---------- */
function showPanel(html) { $('#panel').innerHTML = html; }

async function openPanel(which) {
  /* 各面板自己负责 showPanel()。任一环节失败（最典型的是编辑器进程还是旧代码，
     新接口 404）以前只在控制台抛错，面板上留着上一个画面 —— 看着就像「点了没反应」。
     这里兜住，把原因画在面板里，并直接给出「重启编辑器」的提示。 */
  try {
    if (which === 'settings') return await renderSettings();
    if (which === 'collection') return await renderCollection();
    if (which === 'navbar')   return await renderNavbar();
    if (which === 'music')    return await renderMusic();
    if (which === 'gallery')  return await renderGallery();
    if (which === 'links')    return await renderLinks();
    if (which === 'buttons')  return await renderButtons();
    if (which === 'updates')  return await renderUpdates();
    if (which === 'changelog') return await renderChangelog();
    if (which === 'notices')  return await renderNotices();
    if (which === 'board')    return await renderBoard();
    if (which === 'diancie')  return await renderDiancie();
    if (which === 'sidebar')  return await renderSidebar();
    if (which === 'scripts')  return await renderScripts();
    if (which === 'pkmn')     return await renderPkmn();
    if (which === 'nav')      return await renderNav();
  } catch (e) {
    showPanel(
      '<h2 class="sec">这个面板打不开</h2>'
      + '<p class="hint">' + esc(e.message) + '</p>'
      + '<p class="hint">如果刚刚拉取过新版编辑器的代码，<b>请重启编辑器</b>：'
      + '关掉那个命令行窗口，重新运行 <code>.editor/start.command</code>'
      + '（Windows 上是 <code>start.cmd</code>）。正在跑的进程还是旧代码，'
      + '新加的接口在它里面并不存在 —— 浏览器里刷新页面是没用的。</p>'
    );
    toast('打开面板失败：' + e.message, 'err');
  }
}

/* --- 顶部导航（hugo.toml 的 [[menu.main]]） ---
   站长问「首页 / 关于 / 画廊 / 始祖小鸟 这些标签能不能在编辑器里改」——
   以前不能：「站点设置」只管 [params] 段。 */
async function renderNavbar() {
  const d = await apiGet('/api/menu');
  const draw = (items) => {
    // 可选页面：先放几个常用的，再把「首页与单页」里的文件都列上
    const pages = [
      ['/', '首页 /'], ['/self_intros/', '关于 self_intros'],
      ['/blog/', '博客列表 /blog/'], ['/navigator/', '导航 navigator'],
      ['/gallery/', '画廊 gallery'], ['/updates/', '更新日志（全部）updates'],
      ['/tobitaiaaken/', '始祖小鸟 tobitaiaaken'],
    ];
    for (const g of (TREE || [])) {
      if (g.group !== '首页与单页') continue;
      for (const f of g.files) {
        const u = urlForFile(f);
        if (u && !pages.some((p) => p[0] === u)) pages.push([u, f.replace(/^content\//, '')]);
      }
    }
    let h = '<h2 class="sec">顶部导航</h2>';
    h += '<p class="hint">页面顶部那条导航栏（首页 / 关于 / 博客 …），对应 <code>hugo.toml</code> 的 <code>[[menu.main]]</code>。</p>';
    h += '<div class="note">左边那列是<b>显示的文字</b>（想叫什么都行）；右边选它<b>指向哪个页面</b>。<br>' +
         '顺序就是显示顺序，用每行右边的 <b>↑ ↓</b> 调；保存时 weight 会按顺序自动重排（10 / 20 / 30…）。<br>' +
         '「站点设置」面板管不到这里 —— 那边只管 <code>[params]</code>。</div>';
    h += '<table class="grid"><thead><tr>' +
         '<th style="width:30px"></th><th style="width:26%">显示的文字</th>' +
         '<th>指向的页面</th><th style="width:96px"></th></tr></thead><tbody id="tbNav">';
    items.forEach((it, i) => {
      const cur = it.pageRef || it.url || '';
      let opts = '<option value="">（选一个页面）</option>';
      for (const [u, label] of pages) {
        opts += `<option value="${esc(u)}"${u === cur ? ' selected' : ''}>${esc(label)}　${esc(u)}</option>`;
      }
      // 现在指向的地址不在候选里就补一条，免得保存时被悄悄改掉
      if (cur && !pages.some((p) => p[0] === cur)) opts += `<option value="${esc(cur)}" selected>${esc(cur)}（自定义）</option>`;
      h += `<tr>
        <td style="text-align:center;color:#9bb4cc"><img class="ico" src="/editor-icons/fugue/arrow-move.png" alt="" draggable="false"></td>
        <td><input data-f="name" data-i="${i}" value="${esc(it.name || '')}" placeholder="显示的文字"></td>
        <td><select data-f="pageRef" data-i="${i}">${opts}</select></td>
        <td style="text-align:center;white-space:nowrap">
          <button data-up="${i}" title="上移" ${i === 0 ? 'disabled' : ''}><img class="ico" src="/editor-icons/fugue/arrow-090-small.png" alt="" draggable="false"></button>
          <button data-down="${i}" title="下移" ${i === items.length - 1 ? 'disabled' : ''}><img class="ico" src="/editor-icons/fugue/arrow-270-small.png" alt="" draggable="false"></button>
          <button class="danger" data-del="${i}" title="删掉这一项"><img class="ico" src="/editor-icons/fugue/cross.png" alt="" draggable="false"></button>
        </td></tr>`;
    });
    h += '</tbody></table>';
    if (!items.length) h += '<p class="hint">还没有导航项。加一个吧。</p>';
    h += '<button id="btnAddNav"><img class="ico" src="/editor-icons/fugue/plus.png" alt="" draggable="false"> 加一项</button> <button class="primary" id="btnSaveNav">保存</button>';
    showPanel(h);

    const collect = () => {
      document.querySelectorAll('#tbNav [data-f]').forEach((el) => {
        const i = +el.dataset.i;
        if (!items[i]) return;
        items[i][el.dataset.f] = el.value;
      });
    };
    const swap = (a, b) => { const t = items[a]; items[a] = items[b]; items[b] = t; };
    document.querySelectorAll('#tbNav [data-del]').forEach((b) => b.addEventListener('click', () => {
      collect(); items.splice(+b.dataset.del, 1); draw(items);
    }));
    document.querySelectorAll('#tbNav [data-up]').forEach((b) => b.addEventListener('click', () => {
      collect(); const i = +b.dataset.up; if (i > 0) { swap(i, i - 1); draw(items); }
    }));
    document.querySelectorAll('#tbNav [data-down]').forEach((b) => b.addEventListener('click', () => {
      collect(); const i = +b.dataset.down; if (i < items.length - 1) { swap(i, i + 1); draw(items); }
    }));
    $('#btnAddNav').addEventListener('click', () => {
      collect();
      items.push({ name: '新标签', pageRef: '/blog/' });
      draw(items);
    });
    $('#btnSaveNav').addEventListener('click', async () => {
      collect();
      try {
        const r = await apiPost('/api/menu', { items });
        toast('导航栏已保存（预览里刷新一下就能看到）' + (r && r.count ? '，共 ' + r.count + ' 项' : ''), 'ok');
      } catch (e) {
        toast('保存失败：' + e.message, 'err');
      }
    });
  };
  draw(d.items.map((x) => Object.assign({}, x)));
}

/* --- 公告栏（侧栏那块「公告」，和顶部滚动公告不是一回事） --- */
/* ============ 布告栏 ============
   站上 /board/ 那些便签的数据在后端（board-api/：Cloudflare Pages Functions + D1）。
   这个面板管两件事：
     1. 填后端地址 + 管理令牌 —— 只写本机 .editor/board.json（已 gitignore），
        不进仓库；令牌泄露等于把整块板子的生杀权交出去，所以别提交、别贴给人看。
     2. 看便签、回复、隐藏（= 撤下来，数据和回复都留着）。
   ============================================================ */
async function renderBoard() {
  let cfg;
  try { cfg = await apiGet('/api/board/config'); }
  catch (e) { showPanel('<h2 class="sec">布告栏</h2><p class="hint">读不到配置：' + esc(e.message) + '</p>'); return; }

  /* ---- 还没配好后端：填地址和令牌 ---- */
  const drawCfg = (c) => {
    let h = '<h2 class="sec">布告栏</h2>';
    h += '<p class="hint">站上 <code>/board/</code> 的便签存在 Cloudflare 上（仓库里的 <code>board-api/</code>）。' +
         '这里填后端地址和管理令牌 —— 令牌只写进本机 <code>.editor/board.json</code>（已 gitignore），' +
         '既不会进仓库，也不会出现在站点上。</p>';
    h += '<div class="field"><label>后端地址</label><input id="bdApi" value="' + esc(c.api || '') +
         '" placeholder="https://xxx.pages.dev" style="width:420px"></div>';
    h += '<div class="field"><label>管理令牌</label><input id="bdToken" type="password" placeholder="' +
         (c.hasToken ? '已保存（想换再填）' : 'ADMIN_TOKEN 的值') + '" style="width:320px"></div>';
    h += '<p><button class="primary" id="bdSave">保存并连接</button>';
    if (c.api && c.hasToken) h += ' <button id="bdCancel">算了</button>';
    h += '</p>';
    h += '<div class="note">后端还没部署？<code>board-api/README.md</code> 里是三步：' +
         '注册 Cloudflare → <code>wrangler login</code> → <code>wrangler pages deploy</code>，' +
         '然后把地址填到站点 <code>hugo.toml</code> 的 <code>boardApi</code>。</div>';
    showPanel(h);
    $('#bdSave').addEventListener('click', async () => {
      try {
        await apiPost('/api/board/config', { api: $('#bdApi').value, token: $('#bdToken').value });
        toast('存好了', 'ok');
        renderBoard();
      } catch (e) { toast('没存上：' + e.message, 'err'); }
    });
    if ($('#bdCancel')) $('#bdCancel').addEventListener('click', () => renderBoard());
  };

  if (!cfg.api || !cfg.hasToken) { drawCfg(cfg); return; }

  /* ---- 配好了：列便签 ---- */
  let all = [];
  const drawList = (onlyUnreplied) => {
    const list = onlyUnreplied ? all.filter((n) => !(n.reply && n.reply.body)) : all;
    let h = '<h2 class="sec">布告栏</h2>';
    h += '<p class="hint">板上共 <b>' + all.length + '</b> 张' +
         (onlyUnreplied ? '（只看没回复的：' + list.length + ' 张）' : '') +
         '。回复会贴在便签下面；「隐藏」是撤下来但不删，数据和回复都留着。</p>';
    h += '<p><button id="bdReload">刷新</button> <button id="bdSetting">后端设置</button> ' +
         '<button id="bdOnly">' + (onlyUnreplied ? '看全部' : '只看没回复的') + '</button></p>';
    if (!list.length) h += '<p class="hint">' + (onlyUnreplied ? '都回复过了。' : '板子上还什么都没有。') + '</p>';
    list.forEach((n) => {
      const hidden = n.status === 'hidden';
      h += '<div style="border:1px solid ' + (hidden ? '#d8d8d8' : '#c9d6e4') + ';background:' +
           (hidden ? '#f6f6f6' : '#fff') + ';padding:8px 10px;margin:8px 0">';
      h += '<div style="font-size:12px;color:#5b6b7c">#' + esc(String(n.id)) + ' · ' + esc(n.at || '') +
           ' · ' + (n.name ? esc(n.name) : '匿名') + (hidden ? ' · <b>已隐藏</b>' : '') + '</div>';
      h += '<div style="white-space:pre-wrap;margin:6px 0;line-height:1.6">' + esc(n.body) + '</div>';
      if (n.reply && n.reply.body) {
        h += '<div style="background:#fff8ec;border-left:3px solid #c94800;padding:6px 8px;margin:6px 0">' +
             '<b>站长回复</b>（' + esc(n.reply.at || '') + '）<div style="white-space:pre-wrap">' +
             esc(n.reply.body) + '</div></div>';
      }
      h += '<textarea rows="2" data-reply="' + esc(String(n.id)) +
           '" placeholder="回复这张便签（留空点回复 = 不改动已有的）" style="width:100%;box-sizing:border-box"></textarea>';
      h += '<p style="margin:6px 0 0"><button data-do="reply" data-id="' + esc(String(n.id)) + '">回复</button> ' +
           '<button data-do="' + (hidden ? 'show' : 'hide') + '" data-id="' + esc(String(n.id)) + '"' +
           (hidden ? '' : ' class="danger"') + '>' + (hidden ? '恢复' : '隐藏') + '</button></p>';
      h += '</div>';
    });
    showPanel(h);

    $('#bdReload').addEventListener('click', () => renderBoard());
    $('#bdSetting').addEventListener('click', () => drawCfg(cfg));
    $('#bdOnly').addEventListener('click', () => drawList(!onlyUnreplied));
    document.querySelectorAll('[data-do]').forEach((b) => b.addEventListener('click', async () => {
      const id = Number(b.dataset.id);
      try {
        if (b.dataset.do === 'reply') {
          const ta = document.querySelector('[data-reply="' + id + '"]');
          const body = (ta && ta.value || '').trim();
          if (!body) { toast('回复是空的', 'err'); return; }
          b.disabled = true;
          await apiPost('/api/board/reply', { id, body });
          toast('回复好了', 'ok');
        } else {
          b.disabled = true;
          await apiPost('/api/board/hide', { id, hidden: b.dataset.do === 'hide' });
          toast(b.dataset.do === 'hide' ? '已隐藏' : '已恢复', 'ok');
        }
        renderBoard();
      } catch (e) {
        b.disabled = false;
        toast('没成功：' + e.message, 'err');
      }
    }));
  };

  try {
    const data = await apiGet('/api/board/list?status=all');
    all = (data && data.notes) || [];
  } catch (e) {
    showPanel('<h2 class="sec">布告栏</h2><p class="hint">读不到板子上的便签：' + esc(e.message) +
              '</p><p><button id="bdSetting2">后端设置</button></p>');
    $('#bdSetting2').addEventListener('click', () => drawCfg(cfg));
    return;
  }
  drawList(false);
}
