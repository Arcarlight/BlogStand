# ============================================================
#  音乐播放器 —— 侧栏最上面那条窄条挂件
#
#  怎么用：
#    1. 把音频文件丢进 static/music/  （mp3 / ogg / m4a 都行）
#    2. 在下面 [[tracks]] 里加一条，file 只写文件名（不带目录）
#
#  也可以用外链：file 直接写完整的 https:// 地址就行
#
#  字段：
#    file   = "iforest.mp3"            必填 —— 文件名，或完整外链
#    title  = "iforest"                选填 —— 显示的名字；不写就用文件名
#    artist = "来源未知"                选填 —— 作者 / 出处
#
#  说明：
#    · 曲目按这里写的顺序播放；「随机」按钮只是打乱播放顺序，不改这个列表
#    · 文件不会上传到任何第三方，就是本站自己的静态资源
#    · 一首都没填时播放器会自动藏起来，不会在侧栏留个空壳
# ============================================================

# 音频放哪个目录（相对 static/）。想换成 music/old/ 这种子目录就改这里。
assetDir = "music/"

# 侧栏标题条上显示的字
title = "音乐"

# ------------------------------------------------------------
# 下面是模板，把 # 去掉填上就行：

# [[tracks]]
#   file = "iforest.mp3"
#   title = "iforest"
#   artist = "来源未知"

# [[tracks]]
#   file = "sample.mp3"
#   title = "曲名"
#   artist = "作者"
