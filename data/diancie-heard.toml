# ============================================================
#  「蒂安希听到了」—— 文集侧边栏那个挂件的内容
#  ------------------------------------------------------------
#  蒂安希站在矿洞里，隔一会儿就抬头听一下，然后把小碎钻告诉它的
#  话转述出来。这里写的就是它要转述的那些话。
#
#  ★ 改完直接保存就行 —— 不用重新跑任何脚本（这份文件是给页面直接读的）。
#    在编辑器左侧「蒂安希听到了」面板里改最省事。
#
#  每一段的字段：
#    text = "…"     必填 —— 要转述的那句话（一段话，可以长一点）
#    emotion = "…"  选填 —— 用哪张脸。留空/不写就**按文本自动判断**
#                           （写了「哭」就用哭脸、写了「开心」就用笑脸，见下）
#
#  可以填的表情（就是素材里真实有的那些）：
#    Normal 平静 / Happy 开心 / Joyous 雀跃 / Inspired 受到启发 /
#    Determined 坚定 / Angry 生气 / Sad 难过 / Crying 哭 /
#    Teary-Eyed 含泪 / Worried 担心 / Sigh 叹气 / Shouting 大声 /
#    Surprised 吃惊 / Stunned 愣住 / Dizzy 晕 / Pain 疼
#
#  自动判断靠关键词表，在编辑器那个面板里能试（输入一句话看判成什么表情）。
#  想改关键词表就改 .editor/server.mjs 里的 DIANCIE_EMOTION_WORDS。
# ============================================================

[[items]]
  text = "洞窟深处的水滴声很有规律。滴答、滴答，像是石头在数着时间。"
  emotion = "Normal"

[[items]]
  text = "小碎钻们说，今天有一块晶簇长得特别好看，像一小片倒过来的天空。"
  emotion = "Happy"

[[items]]
  text = "它们从裂缝里听回来的消息，有时候只是风声，但它们讲得很认真。"
  emotion = ""

[[items]]
  text = "我听见了很远的回声。不知道是谁，也不知道在哪里，但它还在响。"
  emotion = ""

[[items]]
  text = "有一枚小碎钻在角落待了很久。它说它在等一块石头长出来。"
  emotion = "Worried"

[[items]]
  text = "地下比地上安静得多。安静到能听见自己在想什么。"
  emotion = "Normal"

[[items]]
  text = "它们告诉我，最近有人从上面下来过。留下的脚印很浅，像是怕吵醒什么。"
  emotion = "Surprised"

[[items]]
  text = "我把今天听到的都记下来了。等我攒够了，就讲给你听。"
  emotion = "Joyous"

[[items]]
  text = "有一处矿脉断了。小碎钻们围着看了一整个下午，谁也没说话。"
  emotion = "Sad"

[[items]]
  text = "它们说，光从上面漏下来的样子，和宝石里面的光很像。"
  emotion = "Inspired"
