name: 构建并部署 Hugo 站点到 GitHub Pages

on:
  push:
    branches: ["main"]
  workflow_dispatch:

# 允许 Actions 向 Pages 发布内容
permissions:
  contents: read
  pages: write
  id-token: write

# 同一时间只跑一个部署任务，但不要取消正在进行的发布
concurrency:
  group: "pages"
  cancel-in-progress: false

defaults:
  run:
    shell: bash

jobs:
  build:
    runs-on: ubuntu-latest
    env:
      # 注意：请与本地 hugo version 保持一致
      HUGO_VERSION: 0.166.0
    steps:
      - name: 安装 Hugo (extended)
        run: |
          wget -q -O "${{ runner.temp }}/hugo.deb" \
            "https://github.com/gohugoio/hugo/releases/download/v${HUGO_VERSION}/hugo_extended_${HUGO_VERSION}_linux-amd64.deb"
          sudo dpkg -i "${{ runner.temp }}/hugo.deb"

      - name: 检出仓库
        uses: actions/checkout@v4
        with:
          submodules: recursive
          fetch-depth: 0

      - name: 配置 Pages
        id: pages
        uses: actions/configure-pages@v5
        with:
          # 首次运行时自动把仓库的 Pages 打开并设为 GitHub Actions 发布
          enablement: true

      - name: 用 Hugo 构建
        env:
          HUGO_CACHEDIR: ${{ runner.temp }}/hugo_cache
          HUGO_ENVIRONMENT: production
        run: |
          hugo \
            --gc \
            --minify \
            --baseURL "${{ steps.pages.outputs.base_url }}/"

      - name: 上传构建产物
        uses: actions/upload-pages-artifact@v3
        with:
          path: ./public

  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: 发布到 GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
