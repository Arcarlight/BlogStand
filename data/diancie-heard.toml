# ============================================================
#  「蒂安希听到了」—— 文集侧边栏那个挂件的内容
#  ------------------------------------------------------------
#  蒂安希站在水晶洞里，隔一会儿就抬头听一下，然后把话讲出来。
#
#  它讲的话分**三类**，每次随机挑一类、再从那一类里随机挑一条：
#
#    [[heard]]    小碎钻们**听到的事情**  —— 站长写的，当树洞用
#    [[said]]     小碎钻们**说的话**      —— 和宝可梦设定有关的小事
#    [[thought]]  蒂安希**自己的感悟**    —— 站长写的，当树洞用
#
#  ★ 改完直接保存就行 —— 不用重新跑任何脚本。
#    在编辑器左侧「蒂安希听到了」面板里改最省事（那里有表情小图可挑）。
#
#  每一条的字段：
#    text = "…"     必填 —— 要讲的那句话
#    emotion = "…"  选填 —— 用哪张脸。留空/不写就**按文本自动判断**
#
#  可以填的表情（素材里真实有的）：
#    Normal 平静 / Happy 开心 / Joyous 雀跃 / Inspired 受到启发 /
#    Determined 坚定 / Angry 生气 / Sad 难过 / Crying 哭 /
#    Teary-Eyed 含泪 / Worried 担心 / Sigh 叹气 / Shouting 大声 /
#    Surprised 吃惊 / Stunned 愣住 / Dizzy 晕 / Pain 疼
#
#  自动判断靠关键词表（.editor/emotion-words.mjs 和 static/js/diancie-heard.js
#  各有一份，必须一致）。
# ============================================================

# ------------------------------------------------------------
#  小碎钻们听到的事情（站长自己写，树洞用）
# ------------------------------------------------------------

[[heard]]
  text = "洞窟深处的水滴声很有规律。滴答、滴答，像是石头在数着时间。"
  emotion = "Normal"

[[heard]]
  text = "它们从裂缝里听回来的消息，有时候只是风声，但它们讲得很认真。"
  emotion = ""

[[heard]]
  text = "我听见了很远的回声。不知道是谁，也不知道在哪里，但它还在响。"
  emotion = ""

[[heard]]
  text = "它们告诉我，最近有人从上面下来过。留下的脚印很浅，像是怕吵醒什么。"
  emotion = "Surprised"

[[heard]]
  text = "有一处矿脉断了。小碎钻们围着看了一整个下午，谁也没说话。"
  emotion = "Sad"

# ------------------------------------------------------------
#  小碎钻们说的话（和宝可梦设定有关）
# ------------------------------------------------------------

[[said]]
  text = "小碎钻们说，今天有一块晶簇长得特别好看，像一小片倒过来的天空。"
  emotion = "Happy"

[[said]]
  text = "有一枚小碎钻在角落待了很久。它说它在等一块石头长出来。"
  emotion = "Worried"

[[said]]
  text = "它们说，光从上面漏下来的样子，和宝石里面的光很像。"
  emotion = "Inspired"

# ------------------------------------------------------------
#  蒂安希自己的感悟（站长自己写，树洞用）
# ------------------------------------------------------------

[[thought]]
  text = "我把今天听到的都记下来了。等我攒够了，就讲给你听。"
  emotion = "Joyous"

[[thought]]
  text = "地下比地上安静得多。安静到能听见自己在想什么。"
  emotion = "Normal"
