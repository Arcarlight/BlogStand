# 虹星 —— 沙漠蜻蜓。出现在繁盛之森，戴着天蓝色的围巾、触角上套着星星环，
# 尾巴上还套着钢蓝色的帽子；正在找弄丢的星图。
# 性格天真而活泼，为了喜欢的事情能奉献出一切，但冒冒失失、经常出问题。
# 电波难以对接，常讲别人听不懂的冷笑话。
name = "虹星"

greet = [
  "你好呀。请问，你见过一张星图吗。",
  "咦，是你！我刚才把帽子戴反了。",
]

