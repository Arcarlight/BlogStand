id   = "pokemon"
name = "点阵图 · 脸图"
desc = "按全国图鉴编号排：先挑世代，再点编号，就只剩那一只。行走图是 RPG Maker 原图（3 列 × 4 行 = 下 / 左 / 右 / 上），卡片上的小动画是四个方向的走路循环，点开才是完整大图；行走图和脸图能一起打包下载。"
zip  = ""

