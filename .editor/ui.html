/* ---------- 图片：拖拽 / 选择 / 粘贴 ---------- */
function isDraft(text) {
  const m = text.match(/^---\r?\n([\s\S]*?)\r?\n---/);
  return !!(m && /^draft:\s*true\s*$/m.test(m[1]));
}

function insertText(text) {
  const ta = $('#editor');
  if (ta.selectionStart === undefined) { ta.value += text; }
  else {
    const s = ta.selectionStart, e = ta.selectionEnd;
    ta.value = ta.value.slice(0, s) + text + ta.value.slice(e);
    ta.selectionStart = ta.selectionEnd = s + text.length;
  }
  ta.focus();
  setDirty(true);
}

/** 替换编辑区里 [s,e) 这一段，顺便把选区设成 [ss,se) */
function replaceRange(s, e, text, ss, se) {
  const ta = $('#editor');
  ta.value = ta.value.slice(0, s) + text + ta.value.slice(e);
  ta.focus();
  if (ss !== undefined) ta.setSelectionRange(ss, se === undefined ? ss : se);
  setDirty(true);
  updateFmtButtons();
}

/* ---------- 选中文字套格式（加粗 / 倾斜 / 心声） ----------
   正文里必须写标签：这些页面的正文是整段原生 HTML，Markdown 的
   **粗体** / *斜体* 在 HTML 块里不会被解析，只会原样显示成星号。 */
const FMT = {
  bold: { open: '<strong>', close: '</strong>' },
  italic: { open: '<i>', close: '</i>' },
  voice: { open: '<span class="inner-voice">', close: '</span>' },
};

function fmtRange(key) {
  const { open, close } = FMT[key];
  const ta = $('#editor');
  const s = ta.selectionStart, e = ta.selectionEnd;
  const v = ta.value;
  const sel = v.slice(s, e);
  // ① 选中的就是整对标签：<strong>x</strong> → 拆掉
  if (sel.length > open.length + close.length
      && sel.slice(0, open.length) === open && sel.slice(-close.length) === close) {
    const inner = sel.slice(open.length, sel.length - close.length);
    replaceRange(s, e, inner, s, s + inner.length);
    return;
  }
  // ② 标签紧贴在选区外侧：<strong>|x|</strong> → 拆掉
  if (s >= open.length && e + close.length <= v.length
      && v.slice(s - open.length, s) === open && v.slice(e, e + close.length) === close) {
    replaceRange(s - open.length, e + close.length, sel, s - open.length, e - open.length);
    return;
  }
  // ③ 其它情况：套上去。没选中就插一对空标签，光标停在中间
  replaceRange(s, e, open + sel + close, s + open.length, s + open.length + sel.length);
}

/** 光标正处在这对标签里时，把工具栏按钮点亮 */
function updateFmtButtons() {
  const ta = $('#editor');
  if (!ta || ta.selectionStart === undefined) return;
  const s = ta.selectionStart, e = ta.selectionEnd, v = ta.value;
  for (const [key, sel] of [['bold', '#btnBold'], ['italic', '#btnItalic'], ['voice', '#btnVoice']]) {
    const { open, close } = FMT[key];
    const on = (s >= open.length && v.slice(s - open.length, s) === open
                && v.slice(e, e + close.length) === close)
            || (v.slice(s, s + open.length) === open
                && v.slice(Math.max(s, e - close.length), e) === close);
    const btn = $(sel);
    if (btn) btn.classList.toggle('on', on);
  }
}

for (const [id, key] of [['#btnBold', 'bold'], ['#btnItalic', 'italic'], ['#btnVoice', 'voice']]) {
  $(id).addEventListener('click', () => {
    if (!CUR) { toast('先从左边选一个文件', 'err'); return; }
    fmtRange(key);
  });
}

/* ---------- 超链接 ----------
   正文是原生 HTML，所以链接要写成 <a href="...">文字</a>。
   三个常见需求：
     · 选中文字 → 包成链接
     · 选中的已经是链接 → 拆掉（再点一次就是取消）
     · 没选文字但有网址 → 用网址当文字
   地址栏记最近用过的 12 条，站内互相引用时不用每次手打。 */
const RANGE_OPEN = '<a href="', RANGE_CLOSE = '</a>';
const RECENT_LINKS_KEY = 'editor.recentLinks';

function recentLinks() {
  try { return JSON.parse(localStorage.getItem(RECENT_LINKS_KEY) || '[]'); } catch (e) { return []; }
}
function rememberLink(url) {
  const list = [url].concat(recentLinks().filter((x) => x !== url)).slice(0, 12);
  try { localStorage.setItem(RECENT_LINKS_KEY, JSON.stringify(list)); } catch (e) {}
}

function linkRange() {
  const ta = $('#editor');
  const s = ta.selectionStart, e = ta.selectionEnd;
  const v = ta.value;
  const sel = v.slice(s, e);

  // ① 选中的整段就是个链接 → 拆掉
  if (/^<a\s+href="[^"]*">[\s\S]*<\/a>$/.test(sel)) {
    const inner = sel.replace(/^<a\s+href="[^"]*">/, '').replace(/<\/a>$/, '');
    replaceRange(s, e, inner, s, s + inner.length);
    toast('已取消链接', 'ok');
    return;
  }
  // ② 光标紧贴在链接外侧 → 拆掉
  const before = v.slice(0, s);
  const m = before.match(/<a\s+href="[^"]*">$/);
  if (m && v.slice(e, e + RANGE_CLOSE.length) === RANGE_CLOSE) {
    const openStart = s - m[0].length;
    replaceRange(openStart, e + RANGE_CLOSE.length, sel, openStart, openStart + sel.length);
    toast('已取消链接', 'ok');
    return;
  }

  // ③ 问地址。记着最近用过的，常见情况点一下就完事。
  const recent = recentLinks();
  let hint = '地址（可以写 https://… 或站内路径 /blog/xxx/）';
  if (recent.length) hint += '\n\n最近用过：\n' + recent.slice(0, 5).join('\n');
  let url = window.prompt(hint, recent[0] || 'https://');
  if (url === null) return;
  url = url.trim();
  if (!url) return;
  // 光写域名的话补上 https://（站内路径以 / 开头，保持原样）
  if (!/^(https?:|\/|#|mailto:|\.\.?\/)/i.test(url)) url = 'https://' + url;

  const text = sel || url;
  const html = RANGE_OPEN + url + '">' + text + RANGE_CLOSE;
  replaceRange(s, e, html, s + RANGE_OPEN.length + url.length + 2, s + RANGE_OPEN.length + url.length + 2 + text.length);
  rememberLink(url);
  toast('已加链接：' + url, 'ok');
}

$('#btnLink').addEventListener('click', () => {
  if (!CUR) { toast('先从左边选一个文件', 'err'); return; }
  if ($('#editor').selectionStart === undefined) { toast('这个文件不能在编辑区加链接', 'err'); return; }
  linkRange();
});

['keyup', 'mouseup', 'click', 'select', 'input'].forEach((ev) =>
  $('#editor').addEventListener(ev, updateFmtButtons));

$('#editor').addEventListener('keydown', (e) => {
  if (!(e.ctrlKey || e.metaKey) || e.altKey) return;
  const k = e.key.toLowerCase();
  if (k === 'b') { e.preventDefault(); fmtRange('bold'); }
  else if (k === 'i') { e.preventDefault(); fmtRange('italic'); }
  else if (k === 'k') { e.preventDefault(); linkRange(); }
});

async function uploadImages(files) {
  const imgs = [...files].filter((f) => /^image\//.test(f.type));
  if (!imgs.length) { if (files.length) toast('只能上传图片文件', 'err'); return; }
  toast(`正在上传 ${imgs.length} 张图片…`);
  const w = imgWidthValue();
  let out = '';
  try {
    for (const f of imgs) {
      const data = await new Promise((res, rej) => {
        const r = new FileReader();
        r.onload = () => res(r.result);
        r.onerror = rej;
        r.readAsDataURL(f);
      });
      const r = await apiPost('/api/upload', { name: f.name, data });
      out += makeImg(r.url, f.name.replace(/\.[^.]+$/, ''), w) + '\n';
    }
    insertText(out);
    const wtxt = w ? `，宽度 ${w}${/%$/.test(w) ? '' : 'px'}` : '，原尺寸';
    toast(`已存入 static/images/，并在光标处插入 ${imgs.length} 个 <img>${wtxt}`, 'ok');
  } catch (e) { toast('上传失败: ' + e.message, 'err'); }
}

/* ---------- 图片宽度 ----------
   站点里的写法：整数用 width="300"，百分比只能用 style="width:100%"
   （HTML 的 width 属性不接受 "100%" 这种值，写了会被浏览器直接忽略，
   之前迁移过来的图里就有 width="500px" / width=30% 这种没生效的）。
   宽度存在 localStorage，插图时自动带上。 */
function imgWidthValue() {
  const v = $('#imgWidthSel').value;
  if (v === 'custom') return localStorage.getItem('editor.imgWidth.custom') || '';
  return v;
}

function makeImg(url, alt, w) {
  const attrs = [`src="${url}"`, `alt="${alt}"`];
  if (w) attrs.push(/%$/.test(w) ? `style="width:${w}"` : `width="${w}"`);
  attrs.push('loading="lazy"');
  return `<img ${attrs.join(' ')} />`;
}

/** 改一个 <img> 标签上的宽度：两种写法都先清掉，再按需要写回去 */
function setImgWidth(tag, w) {
  let style = '';
  let t = tag.replace(/\s+style\s*=\s*(?:"([^"]*)"|'([^']*)')/gi, (m, a, b) => {
    style = a !== undefined ? a : (b || '');
    return '';
  });
  t = t.replace(/\s+width\s*=\s*(?:"[^"]*"|'[^']*'|[^\s>]+)/gi, '');
  const props = style.split(';').map((s) => s.trim()).filter((s) => s && !/^width\s*:/i.test(s));
  if (w && /%$/.test(w)) props.push(`width:${w}`);
  const extra = [];
  if (props.length) extra.push(`style="${props.join('; ')}"`);
  if (w && !/%$/.test(w)) extra.push(`width="${w}"`);
  const selfClose = /\/>\s*$/.test(t);
  t = t.replace(/\s*\/?>\s*$/, '');
  return t + (extra.length ? ' ' + extra.join(' ') : '') + (selfClose ? ' />' : '>');
}

/** 把当前宽度应用到选中的 <img>（可以一次选好几个） */
function applyWidthToSelection() {
  const ta = $('#editor');
  const s = ta.selectionStart, e = ta.selectionEnd;
  if (s === e) { toast('先在编辑区里选中包含 <img> 的一段文字', 'err'); return; }
  const sel = ta.value.slice(s, e);
  if (!/<img\b/i.test(sel)) { toast('选中的这段里没有 <img>', 'err'); return; }
  const w = imgWidthValue();
  let n = 0;
  const out = sel.replace(/<img\b[^>]*>/gi, (tag) => { n++; return setImgWidth(tag, w); });
  replaceRange(s, e, out, s, s + out.length);
  toast(`改了 ${n} 张图的宽度 → ${w ? w + (/%$/.test(w) ? '' : 'px') : '原尺寸'}`, 'ok');
}

$('#imgWidthSel').addEventListener('change', () => {
  if ($('#imgWidthSel').value !== 'custom') { localStorage.setItem('editor.imgWidth', $('#imgWidthSel').value); return; }
  const v = (prompt('想要多宽？填数字（像素），或者带 % 的百分比，比如 300 / 60%', '300') || '').trim();
  if (!/^\d+%?$/.test(v)) {
    toast('没填对，宽度得是数字或百分比', 'err');
    $('#imgWidthSel').value = localStorage.getItem('editor.imgWidth') || '';
    return;
  }
  localStorage.setItem('editor.imgWidth.custom', v);
  localStorage.setItem('editor.imgWidth', 'custom');
  const sel = $('#imgWidthSel');
  let op = sel.querySelector('option[data-custom]');
  if (!op) {
    op = document.createElement('option');
    op.dataset.custom = '1';
    sel.insertBefore(op, sel.querySelector('option[value="custom"]'));
  }
  op.value = v;
  op.textContent = `自定义 ${v}`;
  sel.value = v;
});

$('#btnApplyWidth').addEventListener('click', applyWidthToSelection);

$('#btnInsertImg').addEventListener('click', async () => {
  // 两种来源：传新的（落进 static/images/），或者引用站上已经有的（不占第二份空间）
  const choice = await askChoice('插入图片', '这张图从哪来？', [
    { key: 'upload', label: '上传新图（选文件 / 也可以直接拖进编辑区）' },
    { key: 'pick', label: '站上已有的图（不复制文件，只是引用）' },
  ]);
  if (choice === 'upload') $('#filePicker').click();
  else if (choice === 'pick') pickExistingImages({});
});

/* 极简二选一对话框。站上别处没有这种需求，就不引库了。 */
function askChoice(title, hint, options) {
  return new Promise((resolve) => {
    const wrap = document.createElement('div');
    wrap.style.cssText = 'position:fixed;inset:0;z-index:400;display:flex;align-items:center;justify-content:center;background:rgba(12,24,40,.35)';
    const box = document.createElement('div');
    box.style.cssText = 'min-width:320px;padding:14px 16px;background:#fff;border:1px solid var(--line);border-radius:6px;box-shadow:0 6px 24px rgba(0,0,0,.2)';
    const h = document.createElement('div');
    h.style.cssText = 'font-weight:bold;margin-bottom:4px';
    h.textContent = title;
    const p = document.createElement('p');
    p.className = 'hint';
    p.style.margin = '0 0 10px';
    p.textContent = hint || '';
    box.append(h, p);
    options.forEach((o) => {
      const b = document.createElement('button');
      b.textContent = o.label;
      b.style.cssText = 'display:block;width:100%;margin-bottom:6px;text-align:left';
      b.addEventListener('click', () => { wrap.remove(); resolve(o.key); });
      box.appendChild(b);
    });
    const cancel = document.createElement('button');
    cancel.textContent = '取消';
    cancel.addEventListener('click', () => { wrap.remove(); resolve(null); });
    box.appendChild(cancel);
    wrap.appendChild(box);
    wrap.addEventListener('click', (e) => { if (e.target === wrap) { wrap.remove(); resolve(null); } });
    document.body.appendChild(wrap);
  });
}
document.addEventListener('keydown', (e) => {
  if (e.key === 'Escape' && $('#galPickGrid') && !$('#galPickBack').hidden) $('#galPickBack').click();
});
$('#filePicker').addEventListener('change', (e) => { uploadImages(e.target.files); e.target.value = ''; });

['dragenter', 'dragover'].forEach((ev) => $('#editor').addEventListener(ev, (e) => {
  if (e.dataTransfer && [...e.dataTransfer.types].includes('Files')) {
    e.preventDefault();
    $('#editor').classList.add('dragover');
  }
}));
['dragleave', 'drop'].forEach((ev) => $('#editor').addEventListener(ev, (e) => {
  e.preventDefault();
  $('#editor').classList.remove('dragover');
}));
$('#editor').addEventListener('drop', (e) => {
  const files = [...((e.dataTransfer && e.dataTransfer.files) || [])];
  if (files.length) uploadImages(files);
});
$('#editor').addEventListener('paste', (e) => {
  const files = [...((e.clipboardData && e.clipboardData.files) || [])];
  if (files.length) { e.preventDefault(); uploadImages(files); }
});

/* ---------- 插入日期锚点（日记专用） ---------- */
$('#btnInsertDay').addEventListener('click', () => {
  const m = CUR && CUR.match(/niki_(\d{4})(\d{2})\.md$/);
  if (!m) return;
  const mm = m[2], mi = parseInt(mm, 10);
  const day = prompt(`插入 ${mi} 月的哪一天？（1-31）`, String(new Date().getDate()));
  if (!day) return;
  const n = parseInt(day, 10);
  if (!(n >= 1 && n <= 31)) { toast('日期不对', 'err'); return; }
  const dd = String(n).padStart(2, '0');
  insertText(`\n<h2><span id="${mm}${dd}">${mi}月 ${n}日</span></h2>\n\n`);
  toast('锚点已插入。写完保存就行，日记页和导航页的日历会自动多出这一天', 'ok');
});

/* ---------- 草稿开关 ---------- */
$('#btnToggleDraft').addEventListener('click', async () => {
  if (!CUR) return;
  const now = isDraft($('#editor').value);
  try {
    await apiPost('/api/draft', { p: CUR, draft: !now });
    await openFile(CUR);
    await bootstrap();
    toast(now ? '已发布，不再是草稿' : '已设为草稿，不会出现在线上站', 'ok');
  } catch (e) { toast('操作失败: ' + e.message, 'err'); }
});

/* ---------- 通用弹窗 ---------- */
function modal({ title, fields, okText = '确定', bind }) {
  return new Promise((resolve) => {
    $('#mTitle').textContent = title;
    $('#mBody').innerHTML = fields.map((f) => {
      const id = 'mf_' + f.key;
      if (f.type === 'checkbox') {
        return `<div class="field"><label>${esc(f.label)}</label>
          <input type="checkbox" id="${id}" ${f.value ? 'checked' : ''}>
          <span class="cmt">${esc(f.hint || '')}</span></div>`;
      }
      if (f.type === 'select') {
        return `<div class="field"><label>${esc(f.label)}</label>
          <select id="${id}">${f.options.map((o) =>
            `<option value="${esc(o.v)}"${o.v === f.value ? ' selected' : ''}>${esc(o.t)}</option>`).join('')}</select></div>`;
      }
      return `<div class="field"><label>${esc(f.label)}</label>
        <input type="text" id="${id}" value="${esc(f.value ?? '')}" placeholder="${esc(f.ph || '')}">
        <span class="cmt">${esc(f.hint || '')}</span></div>`;
    }).join('');
    $('#mOk').textContent = okText;
    $('#modal').hidden = false;
    if (bind) { try { bind(); } catch (e) { console.warn(e); } }

    const done = (v) => { $('#modal').hidden = true; resolve(v); };
    $('#mCancel').onclick = () => done(null);
    $('#mOk').onclick = () => {
      const out = {};
      for (const f of fields) {
        const el = document.getElementById('mf_' + f.key);
        out[f.key] = f.type === 'checkbox' ? el.checked : el.value.trim();
      }
      done(out);
    };
    $('#modal').onkeydown = (e) => {
      if (e.key === 'Escape') done(null);
      if (e.key === 'Enter' && e.target.tagName === 'INPUT') $('#mOk').click();
    };
    const first = $('#mBody input[type=text]');
    if (first) { first.focus(); first.select(); }
  });
}

/* ---------- 新建页面 ---------- */
function defaultNameTitle(kind) {
  const now = new Date();
  if (kind === 'niki') {
    const y = now.getFullYear(), m = now.getMonth() + 1;
    return { name: `niki_${y}${String(m).padStart(2, '0')}`, title: `${y}年${m}月日记` };
  }
  if (kind === 'blog') return { name: 'new-post', title: '新文章' };
  if (kind === 'collection') return { name: 'new-piece', title: '新篇目' };
  return { name: 'new-page', title: '新页面' };
}

async function newPage() {
  const d0 = defaultNameTitle('niki');
  const res = await modal({
    title: '新建页面',
    okText: '创建',
    // 换类型时把文件名/标题的默认值也跟着换（不然选了「博客」还留着 niki_202609）
    bind() {
      const sel = $('#mf_kind');
      if (!sel) return;
      sel.addEventListener('change', () => {
        const d = defaultNameTitle(sel.value);
        $('#mf_name').value = d.name;
        $('#mf_title').value = d.title;
      });
    },
    fields: [
      { key: 'kind', type: 'select', label: '类型', value: 'niki', options: [
        { v: 'niki', t: '日记（挂到导航页，不进博客列表）' },
        { v: 'blog', t: '博客文章' },
        { v: 'collection', t: '文集（绿色主题那个页面，小说 / 随感 / 杂笔）' },
        { v: 'page', t: '独立单页' },
      ] },
      { key: 'name', type: 'text', label: '文件名', value: d0.name, hint: '英文/数字/下划线，不用写 .md' },
      { key: 'title', type: 'text', label: '标题', value: d0.title },
      { key: 'date', type: 'text', label: '日期', value: new Date().toISOString().slice(0, 10), hint: 'YYYY-MM-DD' },
      { key: 'asDraft', type: 'checkbox', label: '先存为草稿', value: true, hint: '写完在工具栏一键发布' },
    ],
  });
  if (!res) return;
  try {
    const r = await apiPost('/api/new', res);
    await bootstrap();
    document.body.classList.remove('panel');
    markActive(null);
    await openFile(r.p);
    let msg = '已创建 ' + r.p + (res.asDraft ? '（草稿）' : '');
    if (res.kind === 'niki') msg += '，日历会自动收录';
    toast(msg, 'ok');
  } catch (e) { toast('创建失败: ' + e.message, 'err'); }
}

/* ---------- 启动 ---------- */
let BOOTED = false;
const PANELS = ['settings', 'links', 'buttons', 'scripts', 'nav', 'pkmn'];

/** 恢复上次用的图片宽度、给顶栏的新建按钮接线 */
function initToolbar() {
  // macOS 上快捷键是 ⌘ 不是 Ctrl，按钮提示跟着换（代码里两种都认）
  const isMac = /Mac|iPhone|iPad|iPod/.test(navigator.platform || navigator.userAgent || '');
  if (isMac) {
    const mod = '⌘';
    $('#btnSave').title = mod + 'S';
    $('#btnBold').title = '加粗（' + mod + 'B）';
    $('#btnItalic').title = '倾斜（' + mod + 'I）';
  }

  const saved = localStorage.getItem('editor.imgWidth') || '';
  const sel = $('#imgWidthSel');
  if (saved && saved !== 'custom' && /^\d+%$/.test(saved)) {
    const op = document.createElement('option');
    op.dataset.custom = '1';
    op.value = saved;
    op.textContent = `自定义 ${saved}`;
    sel.insertBefore(op, sel.querySelector('option[value="custom"]'));
  }
  if (saved && [...sel.options].some((o) => o.value === saved)) sel.value = saved;
  $('#btnNewTop').addEventListener('click', () => newPage());
}

async function bootstrap() {
  const d = await apiGet('/api/bootstrap');
  TREE = d.tree;
  PREVIEW_URL = d.previewUrl;
  LIVE_URL = d.liveUrl || '';
  renderTree();
  if (CUR) {
    const r = document.querySelector(`.row[data-file="${CSS.escape(CUR)}"]`);
    if (r) r.classList.add('active');
  }
  // 首次打开时按地址栏的 #锚点 直达：
  //   #settings / #links / #buttons / #scripts / #nav   打开工具面板
  //   #preview                                          进预览模式
  //   #f=content/niki/niki_202602.md&preview             打开某个文件并预览它
  if (!BOOTED) {
    BOOTED = true;
    const raw = decodeURIComponent(location.hash.replace(/^#/, ''));
    if (raw.startsWith('f=')) {
      const hp = new URLSearchParams(raw);
      const file = hp.get('f');
      const row = file && document.querySelector(`.row[data-file="${CSS.escape(file)}"]`);
      if (row) row.click();
      if (hp.has('preview')) setTimeout(() => { if (!document.body.classList.contains('preview')) $('#btnPreview').click(); }, 500);
    } else if (PANELS.includes(raw)) {
      const row = document.querySelector(`.row[data-panel="${raw}"]`);
      if (row) row.click();
    } else if (raw === 'preview') {
      $('#btnPreview').click();
    }
  }
}
initToolbar();
bootstrap().catch((e) => toast('初始化失败: ' + e.message, 'err'));

/* 开机先跟线上对一次账：
   · 本机干净、也没欠着没推的提交 → 自动把线上的改动拉下来（换电脑编辑就不用管了）
   · 有本地提交没推上去 → 提示一句（多半是上次推送失败）
   · 有没提交的改动 → 不动，交给「发布」 */
async function checkRemote() {
  let g;
  try { g = await apiGet('/api/git'); } catch { return; }
  if (g.behind === null || g.behind === undefined) return;
  if (g.behind > 0 && !g.status.length && !g.ahead) { await syncPull(true); return; }
  if (g.ahead > 0) {
    toast(`本地有 ${g.ahead} 个提交还没推上去（上次推送大概失败了）—— 点「发布」重推`, 'err');
  } else if (g.behind > 0) {
    toast(`线上有 ${g.behind} 个新提交 —— 点「拉取线上」同步`, 'err');
  }
}
setTimeout(checkRemote, 1200);
</script>
